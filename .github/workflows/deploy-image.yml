name: Create and publish a Docker image

on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BRANCH: ${{ github.ref }}

jobs:
  build-and-push-image:
    runs-on: 
      - ubuntu-latest
      # - macos-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Run the test suite against the freshly-built image *before* pushing, so
      # a failing suite blocks publication. The image carries the full stack and
      # the test files (COPY . + editable install), so this needs no extra setup.
      - name: Run test suite
        run: docker run --rm ${{ steps.meta.outputs.tags }} pytest src/sp_validation/tests
      
      - name: Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-docs:
    name: Build and deploy API documentation
    needs: build-and-push-image
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    # Build inside the image we just published: it already carries the full
    # scientific stack autodoc needs to import, so we only add the docs extra.
    container:
      image: ghcr.io/cosmostat/sp_validation:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install documentation dependencies
        run: uv pip install --no-cache-dir '.[docs]'

      - name: Build API documentation
        run: |
          sphinx-apidoc -t docs/_templates -feTMo docs/source src/sp_validation
          sphinx-build -b html docs/source docs/_build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build