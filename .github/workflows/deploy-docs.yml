name: Build and deploy API documentation

# Build the Sphinx docs inside the published image — which already carries the
# full scientific stack autodoc must import — syncing the *checked-out* uv.lock
# (plus its `docs` extra) and package on top, so the docs reflect the code under
# review and never re-resolve against PyPI.
#
#   pull_request → build only, as a check (no deploy), when docs inputs change
#   push: develop → build + deploy to GitHub Pages
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

jobs:
  docs:
    name: Build and deploy API documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    concurrency:
      group: gh-pages-${{ github.ref }}
      cancel-in-progress: true

    container:
      image: ghcr.io/cosmostat/sp_validation:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Exactly what uv.lock pins: --frozen never re-resolves, and --inexact
      # keeps the image's packages outside this closure (the ShapePipe stack,
      # the glass/workflow extras) instead of pruning them. Both land in the
      # image's venv (UV_PROJECT_ENVIRONMENT). The project isn't uv-packaged, so
      # the checkout goes in by hand, replacing the copy baked into the image.
      - name: Install documentation dependencies
        run: |
          uv sync --frozen --inexact --no-cache --no-install-project --extra docs
          uv pip install --no-cache --no-deps -e .

      # Builds on every event; a failing build fails the PR check. Deploy is
      # gated to develop pushes below.
      - name: Build API documentation
        run: |
          sphinx-apidoc -t docs/_templates -feTMo docs/source src/sp_validation
          sphinx-build -b html docs/source docs/_build

      # Upload the rendered HTML so it can be downloaded from the run summary —
      # the only way to preview the docs on a PR, where the deploy is skipped.
      - name: Upload built docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-html
          path: docs/_build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build
