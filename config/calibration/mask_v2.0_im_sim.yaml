# Config file for masking and calibration of the image simulations.
#
# The v2 data's cuts (mask_v2.0.yaml) wherever they apply to simulated tiles,
# composed from that file and mask_v2.0_im_sim.overlay.yaml by
# workflow/scripts/im_compose_mask.py; do not edit by hand.

# General parameters (can also given on command line)
params:
  input_path: shape_catalog_comprehensive_ngmix.fits
  cmatrices: False
  sky_regions: False
  verbose: True

# Masks
## Cuts on catalogue columns, in the v2 grammar (sp_validation.grammar)
dat:
  # Ignore bit 16 (incomplete aperture data), then keep FLAGS <= 2.
  # Bit 16 preferentially flags large galaxies; selecting on it biases m in
  # image sims. The image-sim validation uses this same predicate.
  - col_name: FLAGS
    label: SE FLAGS
    kind: smaller_equal
    value: 2
    ignore_bits: 16

  # Duplicate objects
  - col_name: overlap
    label: tile overlap
    kind: equal
    value: True

  # Number of epochs
  # @sc [decision:dr6_catalogue.catalogue_match_tile_selection]
  - col_name: N_EPOCH
    label: r"$n_{\rm epoch}$"
    kind: greater_equal
    value: 2

  # Magnitude range
  - col_name: mag
    label: mag range
    kind: range
    value: [15, 30]

  # ngmix flags
  - col_name: NGMIX_MCAL_TYPES_FAIL
    label: "ngmix moments failure"
    kind: equal
    value: 0

  # Objects ngmix never fit. ShapePipe's make_cat pre-fills the NGMIX_*
  # columns with sentinels (G1/G2 = -10, T/FLUX = 0) and overwrites them only
  # for objects present in the ngmix output, so a never-fit object also keeps
  # NGMIX_MCAL_FLAGS = 0 and is not caught by any flag cut. In
  # final_cat_smk-g7.hdf5 that is 18,983 of 1,851,100 objects (1.03%);
  # admitting them gives mean e1 = -0.107 (std 1.03) against -0.004 (std
  # 0.22). The -10 cuts below do reject them today, but only because make_cat
  # happens to use the same literal for the PSF columns: that is an exact
  # float equality against a sentinel ShapePipe may change, so state the
  # condition directly. Mirrors the guard in
  # sp_validation.galaxy.classification_galaxy_ngmix.
  - col_name: NGMIX_N_EPOCH
    label: "ngmix never fit"
    kind: greater_equal
    value: 1

  # invalid PSF ellipticities
  - col_name: NGMIX_G1_PSF_ORIG_NOSHEAR
    label: "bad PSF ellipticity comp 1"
    kind: not_equal
    value: -10
  - col_name: NGMIX_G2_PSF_ORIG_NOSHEAR
    label: "bad PSF ellipticity comp 2"
    kind: not_equal
    value: -10

# Metacal parameters
metacal:
  # Ellipticity dispersion
  sigma_eps_prior: 0.34

  # Signal-to-noise range
  gal_snr_min: 10
  gal_snr_max: 500

  # Moment ratio T_gal / T_PSF; admit galaxies below 9.
  gal_rel_size_min: 0.707
  gal_rel_size_max: 9

  # Correct relative size for ellipticity?
  gal_size_corr_ell: False

  # DES weights: the data's table, which the image-sims workflow names
  # (weight_table), evaluated on each branch's own S/N and size.
  weight_scheme: des
  des_num_bins: 20

  # Constant-shear simulations keep their mean shear.
  additive_correction: False
