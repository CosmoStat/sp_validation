# Config file for masking and calibration.
# Standard cuts without halo masks, type v1.X.14.

# General parameters (can also given on command line)
params:
  input_path: unions_shapepipe_comprehensive_struc_ugriz_2024_v1.X.c.hdf5
  cmatrices: False
  sky_regions: False
  verbose: True

# Masks
## Cuts on catalogue columns, in the v2 grammar (sp_validation.grammar)
dat:
  # SExtractor flags
  - col_name: FLAGS
    label: SE FLAGS
    kind: smaller_equal
    value: 2

  # Duplicate objects
  - col_name: overlap
    label: tile overlap
    kind: equal
    value: True

  # ShapePipe flags
  - col_name: IMAFLAGS_ISO
    label: SP mask
    kind: equal
    value: 0

  # Number of epochs
  - col_name: N_EPOCH
    label: $n_{\rm epoch}$
    kind: greater_equal
    value: 2

  # Magnitude range
  - col_name: mag
    label: r
    kind: range
    value: [15, 30]

  # ngmix flags
  - col_name: NGMIX_MCAL_TYPES_FAIL
    label: "ngmix moments failure"
    kind: equal
    value: 0

  # invalid PSF ellipticities
  - col_name: NGMIX_G1_PSF_ORIG_NOSHEAR
    label: "bad PSF ellipticity comp 1"
    kind: not_equal
    value: -10
  - col_name: NGMIX_G2_PSF_ORIG_NOSHEAR
    label: "bad PSF ellipticity comp 2"
    kind: not_equal
    value: -10

  # photometry cuts ugriz
  - col_name: Z_B
    label: z
    kind: range
    value: [0, 3]
  - col_name: MAG_GAAP_0p7_u
    label: uband
    kind: not_equal
    value: -99
  - col_name: MAG_GAAP_0p7_g
    label: gband
    kind: not_equal
    value: -99
  - col_name: MAG_GAAP_0p7_r
    label: rband
    kind: not_equal
    value: -99
  - col_name: MAG_GAAP_0p7_i
    label: iband
    kind: not_equal
    value: -99
  - col_name: MAG_GAAP_0p7_z
    label: zband
    kind: not_equal_2bands
    col_name2: MAG_GAAP_0p7_z2
    value: -99

  # Healsparse mask bits and post-processing columns (the comprehensive
  # HDF5's data_ext dataset)

  # Stars
  - col_name: MASK_4_Stars
    label: "Stars"
    kind: equal
    value: False

  # Manual mask
  - col_name: MASK_8_Manual
    label: "manual mask"
    kind: equal
    value: False

  # r-band footprint
  - col_name: MASK_64_r
    label: "r-band imaging"
    kind: equal
    value: False

  # Maximask
  - col_name: MASK_1024_Maximask
    label: "maximask"
    kind: equal
    value: False

# Metacal parameters
metacal:
  # Ellipticity dispersion
  sigma_eps_prior: 0.34

  # Signal-to-noise range
  gal_snr_min: 10
  gal_snr_max: 500

  # Relative-size (hlr / hlr_psf) range
  gal_rel_size_min: 0.5
  gal_rel_size_max: 3

  # Correct relative size for ellipticity?
  gal_size_corr_ell: False

  # Weight for global response matrix, None for unweighted mean
  global_R_weight: w
