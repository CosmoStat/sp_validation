# Config file to create mask file from comprehensive catalogue.
# Standard cuts without halo masks, type v1.X.6.

# General parameters (can also given on command line)
params:
  input_path: /n17data/UNIONS/WL/v1.4.x/unions_shapepipe_comprehensive_struc_2024_v1.X.c.hdf5
  cmatrices: False
  sky_regions: False
  verbose: True

# Masks
## Using columns in 'dat' group (ShapePipe flags)
dat:
  # Duplicate objects
  - col_name: overlap
    label: tile overlap
    kind: equal
    value: True

  # Number of epochs
  - col_name: N_EPOCH
    label: $n_{\rm epoch}$
    kind: greater_equal
    value: 2

## Using columns in 'dat_ext' group (post-processing flags)
dat_ext:

  # Stars
  - col_name: 4_Stars
    label: "Stars"
    kind: equal
    value: False

  # Manual mask
  - col_name: 8_Manual
    label: "manual mask"
    kind: equal
    value: False

  # r-band footprint
  - col_name: 64_r
    label: "r-band imaging"
    kind: equal
    value: False

  # Maximask
  - col_name: 1024_Maximask
    label: "maximask"
    kind: equal
    value: False

  # Rough pointing coverage
  - col_name: npoint3
    label: $n_{\rm pointing}$
    kind: greater_equal
    value: 3

# Metacal parameters
metacal:
  # Ellipticity dispersion
  sigma_eps_prior: 0.34

  # Signal-to-noise range
  gal_snr_min: 10
  gal_snr_max: 500

  # Relative-size (hlr / hlr_psf) range
  gal_rel_size_min: 0.707
  gal_rel_size_max: 3

  # Correct relative size for ellipticity?
  gal_size_corr_ell: False

  # Weight for global response matrix, None for unweighted mean
  global_R_weight: w

# Binned footprint mask
binned_mask:
  # Resolution
  nside: 4096

  # Mask value for "good region (observed)
  good: False

  # Output file path base
  output_base: "footprint_binned"
