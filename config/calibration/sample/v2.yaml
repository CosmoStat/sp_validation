# as the assemble stage wrote them (scripts/assembly/): the primary catalogue
# of the v2 collection.
snapshot: ${unions_v2}/run1-snap3
catalogue: ${unions_v2}/run1-snap3-collection
# @sc [decision:dr6_catalogue.selection_cuts]
# The cuts and the metacal block (S/N and size range, weight scheme), relative
# to the repository root.
selection: config/calibration/mask_v2.0.yaml
# @sc [decision:dr6_catalogue.footprint]
footprint_nside: 4096
