name: v2_DR6_BPZ_SOM_EGS_tomo
limitation: EGS-only calibration (DEEP2/3) for validation and null tests; no independent-field variance.
inputs:
  calibrators:
    # PhotoPipe's spec-z matches on Stephen Gwyn's DR6 detections, staged per
    # tile from arc:projects/unions/catalogues/unions/GAaP_photometry/UNIONS_DR6/
    # (UNIONS.<tile>/UNIONS.<tile>_ugriz_photoz_ext_specz.cat and
    # specz/UNIONS.<tile>_redshifts-<compilation>.asc) over the EGS field.
    specz_dir: ${unions_data}/photopipe-dr6-specz
    compilation: "20261019"
    surveys: [deep2_final, deep3_final]
    z_min: 0.002  # stars
    output: ${nz_v2}/inputs/calibrators.npz
    # Every other survey with 100 or more spectra in the field: the alternative
    # calibrators of the ensemble's specz_selection term.
    selection:
      surveys: [deep2_final, deep3_final, DESI_dr1_iron, NED, SIMBAD,
                herschel_help, SPITZER_DATAFUSION, HETDEX_PSC_PDR1_V1.5,
                SDSS_QSO, c3r2_dr2, rcsed_final, SDSS_BHM_v6_2_1, candels_v2]
      output: ${nz_v2}/inputs/calibrators_selection.npz
  sources:
    # The cosmo_val catalogue of SP_v2.0, its shapes and their PhotoPipe join.
    catalogue: ${v2_tomo}/shape_catalog_tomo.fits
    shapes: ${unions_data}/v2.x/run1-snap3-hats/catalogue
    photometry: ${unions_data}/photopipe-dr6/catalogue
    output: ${nz_v2}/inputs/sources.npz
som:
  side: 101
  epochs: 60
  seed: 42
groups: 2000
edges: [0.10, 0.37, 0.55, 0.76, 1.20]
gold_qc:
  floor: 0.4
  nmad_factor: 5
# Canonical z takes precedence over z2.
z2_offset: -0.1104888916015625
# The step is the delivered n(z) resolution; the README says why 0.05.
grid: {min: 0, max: 5, step: 0.05}
# n(z) realisations (sp_validation.nz_ensemble). Each key switches a term on;
# the README says why each size.
ensemble:
  draws: 2000
  seed: 1
  bootstrap: true            # calibrator shot noise
  density:                   # line-of-sight density through the DEEP2/3 strip
    field: [2.0, 0.25]       # degrees
    bias: 1.3
  zero_points:               # EGS against the wide field, mag
    # u-g g-r r-i i-z: stellar-locus offsets of 3.4 deg² patches, noise removed
    colour_sigma: [0.0215, 0.0194, 0.0119, 0.0208]
    colour_corr:
      - [1.0, -0.59, 0.13, -0.13]
      - [-0.59, 1.0, -0.05, 0.16]
      - [0.13, -0.05, 1.0, -0.49]
      - [-0.13, 0.16, -0.49, 1.0]
    grey: 0.01               # Pan-STARRS 3π uniformity
  z2_offset: 0.02            # mag, error of the z2 -> z constant
  specz_failure: 0.01        # 1 - the compilation's DEEP2/3 confidence (0.99)
  nmad_factor: [4, 6]        # gold-QC factor, around the fiducial 5
  specz_selection: 0.5       # of the shift to the alternative calibrators
# Clustering redshifts of the gold bins (sp_validation.nz_clustering): a check
# on the n(z), not a product.
clustering:
  reference:
    # DESI DR1 LSS clustering catalogues, v1.5:
    # <tracer>_{NGC,SGC}_clustering.dat.fits and _<i>_clustering.ran.fits
    directory: ${desi_dr1}/LSScats-v1.5
    randoms: 2               # random files per cap
    slices:                  # tracer: [z_min, z_max, slice width]
      BGS_BRIGHT: [0.05, 0.40, 0.05]
      LRG: [0.40, 0.80, 0.05]
      ELG_LOPnotqso: [0.80, 1.60, 0.05]
      QSO: [1.60, 3.00, 0.10]
  footprint: ${v2_tomo}/footprint-nside4096-ring.fits
  annulus: [1.5, 5.0]        # comoving Mpc/h
  patches: 100               # jackknife
  gate: [LRG, 0.40, 1.10, 0.05]  # half of this tracer as the known answer
  core: [[0.05, 0.50], [0.25, 0.70], [0.40, 0.90], [0.60, 1.40]]  # fit window per bin
  output: ${nz_v2}/clustering
output: ${nz_v2}
