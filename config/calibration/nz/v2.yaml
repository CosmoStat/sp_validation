name: v2_DR6_BPZ_SOM_EGS_tomo
limitation: EGS-only calibration (DEEP2/3) for validation and null tests; no independent-field variance.
inputs:
  # @sc [decision:nz.calibrator_set]
  calibrators:
    # The spectra the collection's spec-z extension matches to PhotoPipe's
    # objects (by its own sky match), selected by survey and by the
    # spectrum's position. DEEP2 is in the EGS and in Field 2 (RA 252,
    # Dec 35), which DEEP2 preselected by BRI colour to z > 0.7; only the EGS,
    # the field the ensemble's density term describes, is used.
    photometry: ${unions_v2}/run1-snap3-collection
    surveys: [deep2_final, deep3_final]
    field: {ra: [213.0, 217.0], dec: [51.5, 54.0]}  # EGS
    z_min: 0.002  # stars
  # @sc [decision:nz.source_photometry_join]
  sources:
    # The released calibrated shear catalogue; each row's photometry comes
    # from the v2 collection (shapes with their PhotoPipe extension) by its
    # DR6 object ID.
    catalogue: ${unions_v2}/v2.0.0/catalogs/calibrated
    photometry: ${unions_v2}/run1-snap3-collection
# @sc [decision:nz.som_map]
som:
  side: 101
  epochs: 60
  seed: 42
groups: 2000
# @sc [decision:nz.tomographic_bins]
# Tomographic bins: equal shear weight in DR6 BPZ, computed by each run from
# its sources with complete photometry and BPZ in range, before gold
# (summary.json records the edges). The README says why.
bins: {count: 4, range: [0.10, 1.20]}
# @sc [decision:nz.gold_selection]
gold_qc:
  floor: 0.4
  nmad_factor: 5
# @sc [decision:nz.z2_offset]
# Canonical z takes precedence over z2.
z2_offset: -0.1104888916015625
# @sc [decision:nz.grid_step]
# The step is the delivered n(z) resolution; the README says why 0.05.
grid: {min: 0, max: 5, step: 0.05}
# @sc [decision:nz.ensemble_terms]
# n(z) realisations (sp_validation.nz.ensemble). Each key switches a term on;
# the README says why each size.
ensemble:
  draws: 2000
  seed: 1
  bootstrap: true            # calibrator shot noise
  density:                   # line-of-sight density through the DEEP2/3 strip
    field: [2.0, 0.25]       # degrees
    bias: 1.3
  # @sc [decision:nz.photometry_as_delivered]
  zero_points:               # EGS against the wide field, mag
    # u-g g-r r-i i-z: stellar-locus offsets of 3.4 deg² patches, noise removed
    colour_sigma: [0.0215, 0.0194, 0.0119, 0.0208]
    colour_corr:
      - [1.0, -0.59, 0.13, -0.13]
      - [-0.59, 1.0, -0.05, 0.16]
      - [0.13, -0.05, 1.0, -0.49]
      - [-0.13, 0.16, -0.49, 1.0]
    grey: 0.01               # Pan-STARRS 3π uniformity
  z2_offset: 0.02            # mag, error of the z2 -> z constant
  specz_failure: 0.01        # 1 - the compilation's DEEP2/3 confidence (0.99)
  nmad_factor: [4, 6]        # gold-QC factor, around the fiducial 5
  # @sc [decision:nz.specz_selection]
  specz_selection:
    scale: 0.5               # σ of the coefficient along the alternative shift
    # Alternative calibrators: the calibrators' selection with every survey
    # holding 100 or more spectra in the field.
    surveys: [deep2_final, deep3_final, DESI_dr1_iron, NED, SIMBAD,
              herschel_help, SPITZER_DATAFUSION, HETDEX_PSC_PDR1_V1.5,
              SDSS_QSO, c3r2_dr2, rcsed_final, SDSS_BHM_v6_2_1, candels_v2]
# Clustering redshifts of the gold bins (sp_validation.nz.clustering), a
# diagnostic outside the release. See scripts/calibration/README.md for scope
# and estimator conventions.
clustering:
  reference:
    # DESI DR1 LSS clustering catalogues, v1.5:
    # <tracer>_{NGC,SGC}_clustering.dat.fits and _<i>_clustering.ran.fits
    directory: ${desi_dr1}/LSScats-v1.5
    randoms: 2               # random files per cap
    slices:                  # tracer: [z_min, z_max, slice width]
      BGS_BRIGHT: [0.05, 0.40, 0.05]
      LRG: [0.40, 0.80, 0.05]
      ELG_LOPnotqso: [0.80, 1.60, 0.05]
      QSO: [1.60, 3.00, 0.10]
    # Optional [tracer1, tracer2, z_min, z_max] windows, extending both measurements.
    # Both catalogues must contain data/randoms there, on the same slice grid.
    # Example: [[LRG, ELG_LOPnotqso, 0.80, 1.10]]
    overlaps: []
  footprint: ${unions_v2}/v2.0.0/masks/footprint-nside4096-ring.fits
  annulus: [1.5, 5.0]        # comoving Mpc/h
  patches: 100               # jackknife
  source_nside: 256          # random-occupied source mask; rerun at 512/1024
  gate: [LRG, 0.40, 1.10, 0.05]  # half of this tracer as the known answer
  core: [[0.05, 0.50], [0.25, 0.70], [0.40, 0.90], [0.60, 1.40]]  # fit window per bin
  output: ${unions_data}/nz-v2/clustering
output: ${unions_v2}/v2.0.0/nz
