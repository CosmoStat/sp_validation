# Config file for masking and calibration.
# Less conservative cuts, type v1.X.9 (e.g. for matching with spectroscopic sample).

# General parameters (can also given on command line)
params:
  input_path: shape_catalog_comprehensive_ngmix.fits
  cmatrices: False
  sky_regions: False
  verbose: True

# Masks
## Cuts on catalogue columns, in the v2 grammar (sp_validation.grammar)
dat:
  # SExtractor flags
  - col_name: FLAGS
    label: SE FLAGS
    kind: smaller_equal
    value: 2

  # Duplicate objects
  - col_name: overlap
    label: tile overlap
    kind: equal
    value: True

  # Number of epochs
  - col_name: N_EPOCH
    label: r"$n_{\rm epoch}$"
    kind: greater_equal
    value: 1

  # Magnitude range
  - col_name: mag
    label: mag range
    kind: range
    value: [15, 30]

  # ngmix flags
  - col_name: NGMIX_MCAL_TYPES_FAIL
    label: "ngmix moments failure"
    kind: equal
    value: 0

  # invalid PSF ellipticities (ShapePipe-v2 grammar: scalar G1/G2 components)
  - col_name: NGMIX_G1_PSF_ORIG_NOSHEAR
    label: "bad PSF ellipticity comp 1"
    kind: not_equal
    value: -10
  - col_name: NGMIX_G2_PSF_ORIG_NOSHEAR
    label: "bad PSF ellipticity comp 2"
    kind: not_equal
    value: -10

# Metacal parameters
metacal:
  # Ellipticity dispersion
  sigma_eps_prior: 0.34

  # Signal-to-noise range: the v2 data's (mask_v2.0.yaml)
  gal_snr_min: 10
  gal_snr_max: 500

  # Moment ratio T_gal / T_PSF: the v2 data's (mask_v2.0.yaml)
  gal_rel_size_min: 0.707
  gal_rel_size_max: 9

  # Correct relative size for ellipticity?
  gal_size_corr_ell: False

  # DES weights. The image-sims workflow names the data's table
  # (weight_table), which then weights every simulation.
  weight_scheme: des

  # Subtract additive bias (mean shear)? Use False for constant-shear
  # image sims
  additive_correction: False
