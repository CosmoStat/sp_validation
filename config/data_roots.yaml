# Named data roots. A config writes `${name}/relative/path`; each root lists the
# directory that holds it on each machine, and the first that exists is used.
# A `vos:` entry always resolves: what a run reads is fetched from the CADC
# vault into ~/.cache/sp_validation/vos/ (sp_validation.data_roots.local).
# A copy elsewhere is reached with SPV_ROOT_<NAME>=<dir>; a root that resolves
# nowhere stays `${name}` and fails when opened.
# The same relative layout must hold under every directory of a root.

# UNIONS data staged on a cluster, the inputs and output of the v2 collection
# (config/assembly/v2.yaml): v2.x/ (run-1 shapes and the collection),
# photopipe-dr6-extract/ and photopipe-dr6-specz-all/ (PhotoPipe's DR6 columns
# and spec-z match, staged by scripts/assembly/fetch_photopipe.sh).
unions_data:
  - /project/rrg-kyi/cdaley/unions/data                                     # fir
  - /project/6001537/cdaley/unions/data                                     # nibi

# UNIONS v2 releases, one directory per release (v2.0.0/, v2.0.1/, ...), each
# laid out as on VOSpace (vos:cfis/weak_lensing/ShapePipe/v2.x/): catalogs/,
# masks/, nz/, data_vector/, blind/. A cat_config entry SP_v<x.y.z> reads
# `${unions_v2}/v<x.y.z>/`; a new release is a new directory, not a new root.
unions_v2:
  - /project/rrg-kyi/cdaley/unions/data/v2.x                                 # fir
  - /project/6001537/cdaley/unions/data/v2.x                                 # nibi
  - vos:cfis/weak_lensing/ShapePipe/v2.x                                     # anywhere else

# Named analysis products, `<name>/<version>/` with a README.md and MD5SUMS,
# sealed once and never changed (a rebuild is a new version). The same tree
# sits on each cluster and on the vault, which is how products move between
# machines; a product with no local copy is read from the vault.
unions_products:
  - /project/rrg-kyi/cdaley/unions/data/products                            # fir
  - /project/6001537/cdaley/unions/data/products                            # nibi
  - vos:cfis/cosmostat/sp-transfer/products                                  # anywhere else
