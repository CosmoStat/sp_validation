# Named data roots. A config writes `${name}/relative/path`; each root lists the
# directory that holds it on each machine, and the first that exists is used.
# A copy elsewhere is reached with SPV_ROOT_<NAME>=<dir>; a root that resolves
# nowhere stays `${name}` and fails when opened.
# The same relative layout must hold under every directory of a root.

# v2 SOM n(z) products (config/calibration/nz/v2.yaml).
nz_v2:
  - /project/rrg-kyi/cdaley/unions/data/nz-v2                               # fir
  - /project/6001537/cdaley/nz-v2                                           # nibi

# UNIONS data staged on a cluster: v2.x/, photopipe-dr6/, photopipe-dr6-specz/.
unions_data:
  - /project/rrg-kyi/cdaley/unions/data                                     # fir

# Blinded v2 tomographic cosmo_val catalogue.
v2_tomo:
  - /project/rrg-kyi/cdaley/unions/data/v2.x/cosmo-val-v2-tomo               # fir
  - /project/6001537/cdaley/cosmo-val-v2-tomo/catalogue                      # nibi

# DESI DR1 LSS catalogues (https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/LSS/iron/LSScats/).
desi_dr1:
  - /project/6001537/cdaley/desi-dr1                                        # nibi
