# Committed SLURM profile for the candide cluster (IAP).
#
# Drive any target with
#
#     snakemake --profile workflow/profiles/candide \
#         -s workflow/image_sims/Snakefile \
#         --configfile <run config> <target>
#
# Snakemake owns scheduling and the container wrapping; run it host-side, never
# inside an ``apptainer shell``. workflow/README.md is the full story.

executor: slurm

# --- GENERIC: mirrored in workflow/profiles/default/config.yaml -------------
software-deployment-method: apptainer

# Rerun a job when its code / params / inputs change, not only on mtime.
# Caveat: "code" watches rule bodies and ``script:`` files, not ``src/`` --
# editing a module under src/ does not mark outputs stale on its own.
rerun-triggers: ["mtime", "params", "input", "code"]

# Give an appearing output file a moment on networked filesystems before
# Snakemake calls a job failed for a missing output.
latency-wait: 5
# --- end GENERIC ------------------------------------------------------------

# No ``apptainer-prefix``: the entry Snakefiles resolve ``container:`` to this
# user's own image path, so there is nothing for Snakemake to cache.
#
# candide's disks, plus the one machine-specific env var: the host OpenMPI libs
# MPI rules need to find libmpi inside the container (only rules importing
# mpi4py care; harmless for the rest). The bind list matches ``spv-container
# exec``'s default; keep the two in step.
apptainer-args: >-
  --cleanenv
  --bind /home,/scratch,/automnt,/n17data,/n23data1,/n09data
  --env LD_LIBRARY_PATH=/softs/openmpi/5.0.5-slurm-CentOS8/lib

# Cluster policy applied to every job unless a rule overrides it. Excludes are
# the flaky/no-internet candide nodes (n17 mount issues, n09 no internet, n36).
#
#   * ``runtime`` MUST carry a unit (``60m``, ``6h``, ``2d``). Snakemake's
#     resource parser reads a bare number as SECONDS, so ``runtime: 60`` would
#     silently give every job a 60-second wall clock and kill it on start.
#     (A bare integer in a rule's own ``resources: runtime=720`` is fine --
#     rule-level numeric runtime is read as minutes; the seconds trap is only
#     the CLI/default-resources parser.)
#
#   * ``cpus_per_task`` is pinned to 12 to CAP JOBS PER NODE, not because a job
#     needs 12 cores. candide's per-user process limit is ``ulimit -u 1200``
#     per node, and apptainer crashes ("can't start new thread") beyond ~4
#     concurrent jobs on a 48-core node; 12 CPUs/job holds SLURM to ~4 jobs per
#     node.
#
#   * After launching a real fan-out, verify the request landed:
#     ``squeue -u $USER -o "%C %l"`` should show 12 (CPUs) and the intended
#     wall clock.
default-resources:
  slurm_account: "cusers"
  slurm_partition: "comp,pscomp"
  runtime: "60m"
  cpus_per_task: 12
  slurm_extra: "'--exclude=n17,n09,n36'"

# Retry a job once on transient node failure, and keep the SLURM logs of
# successful jobs (candide debugging).
retries: 1
slurm-keep-successful-logs: true
