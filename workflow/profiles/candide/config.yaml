# SLURM profile for the candide cluster (IAP). Drive any target with
#
#     snakemake --profile workflow/profiles/candide \
#         -s workflow/image_sims/Snakefile \
#         --configfile <run config> <target>
#
# from the host, never inside an ``apptainer shell``; workflow/README.md is the
# full story.

executor: slurm

# --- mirrored in workflow/profiles/default/config.yaml ----------------------
software-deployment-method: apptainer

# Every trigger but software-env, which hashes the image *path*: that path is
# per person (~/.cache/sp_validation/...) and switches between SIF and sandbox,
# so it would rerun everything without the stack having changed.
# "code" watches rule bodies and ``script:`` files, not ``src/``.
rerun-triggers: ["mtime", "params", "input", "code"]

# A job's write can take more than 5 s to show on the launching host (candide's
# /home does); a shorter wait reads a finished job as failed and re-runs it.
latency-wait: 60
# --- end mirrored -----------------------------------------------------------

# candide's disks; the same list as ``spv-container exec``'s default.
apptainer-args: >-
  --cleanenv
  --bind /home,/scratch,/automnt,/n17data,/n23data1,/n09data

#   * ``runtime`` MUST carry a unit (``60m``, ``6h``, ``2d``): Snakemake reads a
#     bare number here as SECONDS. (In a rule's own ``resources:`` a bare
#     integer is minutes.) 60m is the partitions' default; setting it keeps the
#     slurm executor from warning on every job that names none.
#
#   * ``cpus_per_task`` is 12 to CAP JOBS PER NODE, not because a job needs 12
#     cores: past ~4 concurrent jobs on a 48-core node, candide's per-user
#     process limit (``ulimit -u 1200``) crashes apptainer ("can't start new
#     thread"). After launching a fan-out, ``squeue -u $USER -o "%C %l"``
#     should show 12 CPUs and the intended wall clock.
#
#   * ``slurm_account``: the slurm executor's guess fails on candide (its
#     ``sacct`` call errors) and warns on every launch.
#
#   * The excludes are the flaky nodes: n17 (mount issues), n36, n09; and
#     n34, n35 (grid_3 image-sims jobs filled n35's /tmp on 2026-09-30).
default-resources:
  slurm_account: "cusers"
  slurm_partition: "comp,pscomp"
  runtime: "60m"
  cpus_per_task: 12
  slurm_extra: "'--exclude=n09,n17,n34,n35,n36'"

# Snakemake refuses a real run on a remote executor without a job bound.
jobs: 100

# Jobs inherit the launch env; leaving out source-cache keeps them from being
# handed the launch's (possibly node-local) cache path. common.py drops
# XDG_CACHE_HOME for the jobstep's own Snakemake.
shared-fs-usage:
  - persistence
  - input-output
  - software-deployment
  - sources
  - storage-local-copies
  - software-deployment-cache

# One retry absorbs a node failure in a large fan-out, which would otherwise
# stop the launch scheduling new jobs.
retries: 1

# A successful job's SLURM log is the only record of what its script printed.
slurm-keep-successful-logs: true
