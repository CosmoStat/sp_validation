# Image-simulation m-bias workflow configuration.
#
# OPERATIONAL keys default here and nowhere else -- the .smk reads them bare, so
# this file is their single home. PATH and SCIENCE keys have no default: they
# appear below only as commented template lines, and each run states them in a
# run config layered on top. A run config that omits one fails at DAG parse,
# naming the key; an unknown key under `image_sims:` fails as a typo.

image_sims:

  # --- container --------------------------------------------------------
  # One image for the whole chain: the sp_validation image is built FROM the
  # ShapePipe image, so it carries both stacks. CI builds it from the uv lock --
  # an unlocked build drifts NumPy past numba's ceiling and the ngmix stage dies
  # ("Numba needs NumPy 2.4 or less").
  #
  # `null` means the workflow's one image: your own .sif if you have pulled one
  # with `spv-container pull`, else the registry tag for Snakemake to autopull
  # (workflow/README.md).  Neither is repeated here.
  # Override with a local .sif path, or with a branch tag
  # (docker://ghcr.io/cosmostat/sp_validation:<sanitized-branch>) to run a
  # branch's own CI image.
  sif: null

  # --- paths (REQUIRED in the run config; no default) ------------------
  # sp_validation is the checkout that launches the workflow; its src and the
  # ShapePipe checkout's go on PYTHONPATH, so both branches' code wins over the
  # image's copies. grids_base is the run/output root, one sub-directory per
  # simulation; config_dir holds ShapePipe's cfis_image_sims configs
  # (final_cat.param etc.).
  #
  # shapepipe_repo: /path/to/shapepipe
  # grids_base: /path/to/run/grids
  # input_sims_base: /path/to/skills_out        # SKiLLS simulation images
  # psf_dict: /path/to/Full_psf_dict.pickle
  # config_dir: /path/to/cfis_image_sims

  # --- simulation grid --------------------------------------------------
  sims_type: grid        # 'grid' -> *_grid_{num}; anything else -> *_{num}  [operational]
  num: 1
  # Branches this run requests: the unsheared reference plus the four +/-
  # sheared branches.  Injected shear is NOT set here -- it is parsed from each
  # branch's basic_info.txt by im_manifest.  [operational]
  branches: ["1z2z", "1p2z", "1m2z", "1z2p", "1z2m"]
  # Tiles to process: an explicit list, the one tile-input mechanism.
  tile_ids: ["233.293", "237.292", "238.292"]

  # --- calibration ------------------------------------------------------
  shape: ngmix           # [operational]
  psf_model: psfex       # [operational]
  n_smp: -1              # [operational]

  # --- science knobs (REQUIRED in the run config; no default) -----------
  # Copy these into your run config and set them.  There is deliberately no
  # default: each fixes the estimator's scientific behaviour, so a run must
  # state it.  The injected |g| is separate -- parsed from basic_info.txt by
  # im_manifest, never set here.
  #
  # mask_config: config/calibration/mask_v1.X.9_im_sim.yaml  # relative to the checkout
  # weight_table: /path/to/data/des_weights.fits  # DES weight-table product of the
  #                            # data (response.write_table); `self` weights each
  #                            # simulation with its own table (biased by
  #                            # -1/N_cell, diagnostic only); `unit` gives unit
  #                            # weights (IV weights when the mask config's
  #                            # weight_scheme is iv)
  # des_min_count: 3           # pooling threshold of `self` tables
