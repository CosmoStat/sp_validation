# Image-simulation m-bias workflow configuration.
#
# OPERATIONAL keys default here and nowhere else -- the .smk reads them bare, so
# this file is their single home. STRUCTURAL keys (where things are) and
# SCIENCE keys have no default: a run config layered on top states them
# (workflow/image_sims/fir.yaml is one). A run config that omits one fails at
# DAG parse, naming the key; an unknown key under `image_sims:` fails as a typo.

image_sims:

  # --- simulation grid --------------------------------------------------
  sims_type: grid        # 'grid' -> *_grid_{num}; anything else -> *_{num}
  # Branches this run requests: the unsheared reference plus the four +/-
  # sheared branches.  Injected shear is NOT set here -- it is parsed from each
  # branch's basic_info.txt by im_manifest.
  branches: ["1z2z", "1p2z", "1m2z", "1z2p", "1z2m"]

  # --- calibration ------------------------------------------------------
  shape: ngmix
  # S/N bin edges of im_measure's binned m, on FLUX/FLUX_ERR of each branch,
  # within the metacal S/N cuts.
  snr_edges: [10, 15, 20, 30, 50, 500]

  # --- structural keys (REQUIRED in the run config) ---------------------
  # sif: null                  # null: your spv-container image (workflow/README.md)
  # sp_validation_repo: /path/to/sp_validation   # its src/ and scripts run
  # catalogues: /path/{sim}/final_cat_{sim}.hdf5 # ShapePipe's merged catalogue per sim
  # input_sims_base: /path/to/sims   # <sim>/basic_info.txt and <sim>/tiles.txt
  # grids_base: /path/to/output      # one run dir per sim, and results/
  # num: 1

  # --- science knobs (REQUIRED in the run config; no default) -----------
  # Each fixes the estimator's scientific behaviour, so a run must state it.
  # The injected |g| is separate -- parsed from basic_info.txt by im_manifest.
  #
  # mask_config: config/calibration/mask_v2.0_im_sim.yaml  # relative to sp_validation_repo
  # weight_table: /path/to/data/des_weights.fits  # DES weight-table product of the
  #                            # data (response.write_table); `self` weights each
  #                            # simulation with its own table (biased by
  #                            # -1/N_cell, diagnostic only); `unit` gives unit
  #                            # weights
  # des_min_count: 3           # pooling threshold of `self` tables
