# ASTRA record of sp_validation's scientific decisions: the choices embedded in
# the code and the committed configurations (papers/*/config, cosmo_val/
# cat_config.yaml, config/calibration/, cosmo_inference/cosmosis_config/
# templates/), why they stand, and the alternatives. AGENTS.md says when to
# amend it.
#
# Conventions (`src/sp_validation/tests/decision_record.py` implements them and
# documents the full value grammar; `test_decision_record.py` enforces them):
#   * Put `@sc [decision:<id>]` at every code/config site that implements a
#     decision. Decision citations have no id or prose; the record is the source
#     of rationale. IDs are bare for top-level decisions and dotted
#     `<sub_analysis>.<decision>` for sub-analysis decisions; repeat `decision:`
#     to cite several. A local constraint adds a stable id and prose:
#     `@sc [decision:<id>,label:<kind>] <contract-id>`.
#   * In Python, put the tag in a def/class docstring (it governs that
#     declaration) or as a `#` comment on its own line immediately above a
#     statement, at the statement's indentation (it governs that statement). In
#     Snakemake, a `#` comment immediately above `rule <name>:` governs the rule
#     block; elsewhere it governs the paragraph below (the next run of non-blank
#     lines). In YAML, a `#` comment governs the paragraph below, every key in
#     it at any depth by its dotted path from the document root. In CosmoSIS
#     INI, a `;` or `#` comment directly above `[section]` governs the section;
#     above a key, the paragraph. A blank line between a tag and its site is an
#     error; `scope:file` governs the whole file.
#   * A rationale may end with `Values: <ref> = <value>; ... .`. Every ref must
#     resolve to exactly one location among the decision's tagged sites and
#     match the literal there. A Python ref is a name: a parameter default, a
#     keyword argument, an assignment or a dict entry inside the governed span.
#     A YAML ref is the dotted key path (`cosmo_val.npatch`), an INI ref is
#     `section.key`. Qualify with a path suffix and `#` or `::` when a ref
#     occurs in several tagged files (`cosmo_val/config/config.yaml#...`).
#     Numbers compare as exact decimals, booleans as True/False, bare words and
#     quoted text as strings, `[a, b]` as flat lists. `= absent` asserts that no
#     setting of that name exists anywhere in the one tagged file it names.
#   * The checker's scan scope is src/, workflow/, cosmo_inference/, cosmo_val/,
#     config/ and papers/*/config/. scripts/, papers/*/scripts and
#     papers/*/rules are described in prose but carry no tags. Dependencies
#     (cosmo_numba, shear_psf_leakage, cs_util, TreeCorr, NaMaster, CosmoSIS)
#     are not tagged either: a default that governs a result is named in the
#     rationale and, where a literal exists, pinned at the sp_validation call
#     site that selects it.
#   * A decision's `default` is the option the committed code and configs
#     select; universes/committed.yaml pins it.
#   * `excluded: true` means considered and rejected. An option the code does
#     not implement says so in its description and is not excluded.
#   * [HARDCODED]: the committed choice is fixed in code, with no config key.
#     [LINT]: the code disagrees with itself, its configuration or its own
#     documentation; the issue that tracks it follows in parentheses, or,
#     where none exists, the audit key its regression test is named for.
#   * Tomography merge (CosmoStat/sp_validation #374/#375): the tomography
#     branch's src/sp_validation/cosmo_val/*.py, pseudo_cl.py, rho_tau.py,
#     glass_mock.py, statistics.py, cosmo_val/cat_config.yaml and
#     scripts/glass_mock/* replace develop's. Decisions whose sites live in
#     those files are described against the surviving version, the develop
#     difference is stated where the two differ in substance, and their tags
#     wait for the merge (`PENDING_SITES` in the checker names the decisions
#     with no site elsewhere).

version: "0.0.14"
name: sp_validation scientific decisions
description: >-
  Codebase-level decision record for sp_validation, the UNIONS weak-lensing
  package that turns ShapePipe shear catalogues into the numbers the UNIONS
  papers report: calibrated and selected catalogues, the shear field every
  two-point statistic correlates, xi+-, pure E/B modes, COSEBIs, pseudo-Cl,
  rho/tau PSF diagnostics, their covariances, the terminal SACC file and the
  CosmoSIS inputs, plus the GLASS mocks and image simulations that test them.
  Membership test: a different defensible choice would change a reported
  statistic, its uncertainty, a null-test verdict, or the data vector or
  covariance handed to inference. The committed configuration that selects
  the defaults is papers/bmodes/config/config.yaml, papers/cosmo_val/config/
  config.yaml, cosmo_val/cat_config.yaml, config/calibration/mask_v2.0.yaml
  (and the v1.X mask configs that produced the fiducial SP_v1.4.6.3
  catalogue), the CosmoSIS templates under cosmo_inference/cosmosis_config/
  templates/, and the code's own literals.
tags: [sp_validation, weak-lensing, unions, codebase-record]
container: ghcr.io/cosmostat/sp_validation:develop

inputs:
  - id: comprehensive_catalogue
    type: data
    source: ShapePipe comprehensive HDF5 (unions_shapepipe_comprehensive_*.hdf5), one row per detection with the ngmix metacal columns
    description: >-
      The uncut ShapePipe output the calibration stage selects and calibrates
      into a cut shear catalogue.
  - id: shear_catalogue
    type: data
    source: cosmo_val/cat_config.yaml shear.path of the analysed version (SP_v1.4.6.3 unions_shapepipe_cut_struc_2024_v1.4.6.3.fits)
    description: >-
      The calibrated, selected shear catalogue cosmo_val reads: calibrated e1/e2,
      their leakage-corrected variants, e1_PSF/e2_PSF, w_des and w_iv.
  - id: psf_catalogues
    type: data
    source: cat_config psf.path and star.path (unions_shapepipe_psf_2024_v1.4.a.fits, unions_shapepipe_star_2024_v1.4.a.fits)
    description: PSF-model and star shape catalogues for rho/tau and the leakage diagnostics.
  - id: source_nz
    type: data
    source: cat_config shear.redshift_path (nz_SP_v1.4.6.3_A.txt)
    description: The one survey-wide source n(z); the SACC tracer and every theory covariance read it.
  - id: footprint_products
    type: data
    source: cosmo_inference/data/mask/mask_map_footprint_nside_4096.fits and mask_cls_footprint*_nside_4096_norm.txt
    description: >-
      Occupancy footprint of the comprehensive catalogue under the spatial cuts
      only, and its area-normalised power spectrum, built by scripts/masking.py.
  - id: glass_mocks
    type: data
    source: glass_mocks.data_dir, /n09data/guerrini/glass_mock_v1.4.6.3_v2/results (unions_glass_sim_{id}_4096.fits)
    description: GLASS lognormal mock catalogues generated by the mocks sub-analysis.
  - id: image_simulations
    type: data
    source: SKiLLS-based UNIONS image simulations (workflow/image_sims/config.yaml input_sims_base)
    description: Sheared-branch image simulations run through ShapePipe for the multiplicative-bias measurement.

outputs:
  - id: bmode_summary
    type: report
    format: json
    description: cosmo_val/output/bmode_summary.json, the B-mode PTE table per catalogue version.
    inputs: [shear_catalogue, footprint_products, source_nz]
    decisions: [spin2_sign_convention]
  - id: analysis_sacc
    type: data
    format: fits
    description: The terminal {version}.sacc, every analysis statistic with its covariance.
    inputs: [shear_catalogue, psf_catalogues, footprint_products, source_nz]
    decisions: [spin2_sign_convention]
  - id: cosmosis_inputs
    type: data
    format: fits
    description: The 2pt FITS file and INI the inference_prep rule writes for CosmoSIS.
    inputs: [shear_catalogue, psf_catalogues, source_nz]
    decisions: [spin2_sign_convention]
  - id: mbias_results
    type: metric
    format: yaml
    description: Multiplicative and additive bias from the image simulations.
    inputs: [image_simulations]
    decisions: []

decisions:

  # ── cross-cutting ────────────────────────────────────────────────────────

  spin2_sign_convention:
    label: e2 sign convention per estimator
    rationale: >-
      e2 reaches TreeCorr without a sign change
      (real_space.calculate_2pcf_version passes the calibrated g2 as g2), while
      the committed catalogue-derived pseudo-Cl signal fields negate e2 on both
      the map and catalogue paths. develop's pseudo_cl.py reads pol_factor as a
      boolean and flips when True; the tomography branch's pseudo_cl.py, which
      the merge adopts, multiplies e2 by pol_factor itself, and that branch's
      CosmologyValidation constructor (cosmo_val/core.py) asserts pol_factor in
      (-1, 1) with default -1. The GLASS mock writer stores e2 = -Im(g) of the
      GLASS shear, and the mock pseudo-Cl code (glass_mock.py,
      workflow/scripts/run_glass_mock_pseudo_cl.py) negates it again before
      NaMaster, so mocks follow the data convention. No rationale is recorded
      at the tagged sites; NaMaster's NmtField documentation gives it: NaMaster
      uses HEALPix's polarization convention, and ellipticities in the IAU
      convention need e2 negated. A wrong sign on the NaMaster side mixes E
      into B in the pseudo-Cl spectra and in the B-mode PTEs and SACC parts
      built from them; the TreeCorr input is separate and unaffected. [LINT]
      the papers/cosmo_val config key pol_factor: true reaches only the
      cv_runner rules, which compute no pseudo-Cl, through
      common.cv_init_params; the pseudo-Cl producers generate_pseudo_cl.py and
      generate_pseudo_cl_cov.py build CosmologyValidation without it, so the
      constructor default applies (#381). After the merge those cv_runner rules
      pass the same True to a constructor that accepts it as +1, a no-flip.
      Values:
      cosmo_val.pol_factor = True;
      generate_pseudo_cl.py#pol_factor = absent.
    default: flip_for_namaster_only
    options:
      flip_for_namaster_only:
        label: No e2 sign change for TreeCorr; catalogue e2 negated for NaMaster
      no_flip:
        label: No e2 sign change for any estimator
        excluded: true
        excluded_reason: >-
          NaMaster uses HEALPix's polarization convention, and its NmtField
          documentation says IAU-convention ellipticities need e2 negated; a
          pure-E field stored as the GLASS writer stores it (e2 = -Im g) shows
          BB comparable to EE in NaMaster without the flip.

analyses:

  # ═════════════════════════════════════════════════════════════════════════
  calibration:
    description: >-
      From the comprehensive catalogue to the cut shear catalogue: the object
      selection, the metacalibration response, the shape weights, the
      additive-bias subtraction and the object-wise PSF-leakage correction,
      as scripts/calibration/calibrate_comprehensive_cat.py runs them with a
      config/calibration/mask_*.yaml. SP_v1.4.6.3 was produced with the v1.X.6
      cuts; mask_v2.0.yaml is the committed config for ShapePipe v2 products.
    inputs:
      - id: comprehensive_catalogue
        from: ../comprehensive_catalogue
    outputs:
      - id: cut_catalogue
        type: data
        format: fits
        description: The cut, calibrated shear catalogue (e1/e2, e*_leak_corrected, w_des, w_iv, R).
        inputs: [comprehensive_catalogue]
        decisions:
          [catalogue_cuts, metacal_selection, noshear_psf_size,
           response_estimator, response_weighting, shape_weights,
           additive_bias, objectwise_leakage_correction]
    decisions:
      catalogue_cuts:
        label: Catalogue-level object selection before metacal
        rationale: >-
          The mask config's dat list is ANDed over the comprehensive catalogue
          (masks.catalogue_cuts, get_masks_from_config). mask_v2.0.yaml keeps
          FLAGS <= 2, overlap True, the six r-band mask bits False (star
          bodies, faint and bright star halos, manual, MaxiMask, r-band
          coverage: the ShapePipe r-band default bitmask, whose OR matches
          mask_r on covered granules), N_EPOCH >= 2, 15 <= mag <= 30,
          NGMIX_MCAL_TYPES_FAIL == 0, NGMIX_N_EPOCH >= 1 (objects ngmix never
          fit keep sentinel shapes and no flag) and PSF ellipticity != -10.
          mask_v1.X.6.yaml, the selection behind SP_v1.4.6.3, keeps FLAGS == 0,
          IMAFLAGS_ISO == 0, N_EPOCH >= 2, four mask bits (no halo bits) and
          npoint3 >= 3, with the same overlap, magnitude, ngmix-failure and
          PSF-ellipticity cuts and no NGMIX_N_EPOCH cut; v2 catalogues carry no
          npoint3. For v1 inputs the grammar presents NGMIX_MOM_FAIL as
          NGMIX_MCAL_TYPES_FAIL by name, so the "ngmix failure" cut removes
          moments-guess failures there and failed metacal types on v2 products.
          The mask_v2.0.yaml comments give three reasons: FLAGS <= 2 is the
          image-simulation selection (mask_v1.X.9_im_sim.yaml), so data and
          simulations select identically (shapepipe#885); the six bits
          reproduce mask_r; and NGMIX_N_EPOCH >= 1 states the never-fit
          condition directly instead of relying on the -10 sentinel. The other
          cuts carry one-line labels only. Together with the metacal cuts, the
          selection sets the galaxy sample, hence n_eff, the response and every
          shear statistic.
          Values:
          mask_v2.0.yaml#dat.0.col_name = FLAGS;
          mask_v2.0.yaml#dat.0.kind = smaller_equal;
          mask_v2.0.yaml#dat.0.value = 2;
          mask_v2.0.yaml#dat.2.col_name = MASK_4_Stars;
          mask_v2.0.yaml#dat.3.col_name = MASK_1_Faint_star_halos;
          mask_v2.0.yaml#dat.4.col_name = MASK_2_Bright_star_halos;
          mask_v2.0.yaml#dat.5.col_name = MASK_8_Manual;
          mask_v2.0.yaml#dat.6.col_name = MASK_1024_Maximask;
          mask_v2.0.yaml#dat.7.col_name = MASK_64_r;
          mask_v2.0.yaml#dat.8.value = 2;
          mask_v2.0.yaml#dat.9.value = [15, 30];
          mask_v2.0.yaml#dat.10.col_name = NGMIX_MCAL_TYPES_FAIL;
          mask_v2.0.yaml#dat.11.col_name = NGMIX_N_EPOCH;
          mask_v2.0.yaml#dat.11.value = 1;
          mask_v2.0.yaml#dat.12.value = -10;
          mask_v1.X.6.yaml#dat.0.value = 0;
          mask_v1.X.6.yaml#dat.2.col_name = IMAFLAGS_ISO;
          mask_v1.X.6.yaml#dat.3.value = 2;
          mask_v1.X.6.yaml#dat.12.col_name = npoint3;
          mask_v1.X.6.yaml#dat.12.value = 3.
        default: v2_flags_le_2_rband_bits
        options:
          v2_flags_le_2_rband_bits:
            label: mask_v2.0.yaml cuts (FLAGS <= 2, six r-band mask bits, N_EPOCH >= 2, 15-30 mag, ngmix validity)
          v1x6_flags_eq_0_imaflags:
            label: mask_v1.X.6.yaml cuts (FLAGS == 0, IMAFLAGS_ISO == 0, npoint3 >= 3), the SP_v1.4.6.3 selection
          v2_flags_eq_0:
            label: FLAGS == 0 on v2 products
            description: A config edit; drops the neighbour and deblend flags the v2 config admits.
      metacal_selection:
        label: Metacal signal-to-noise and relative-size cuts
        rationale: >-
          Each metacal type keeps NGMIX_FLAGS == 0, snr_min < flux/flux_err <
          snr_max and rel_size_min < T/Tpsf < rel_size_max, strict on both
          sides, with T the ngmix size T = 2 sigma^2 and Tpsf the
          reconvolved-PSF size (metacal._masking_gal). The committed configs
          set 10 < SNR < 500 and 0.707 < T/Tpsf < 3 and gal_size_corr_ell
          False, so the cut uses the raw T; the class defaults are 0.5 < T/Tpsf
          < 3 and size_corr_ell True, which rescales T by (1 - |g|^2)/(1 +
          |g|^2). scripts/calibration/params.py gives the reasons: the SNR
          floor removes noisy objects, the ceiling too-bright objects that may
          be too large for the postage stamp, the size floor objects likely to
          be point-like, and the size ceiling objects so large they seem to
          bias the correlation functions. That file's own size floor is 0.5;
          the two data configs set 0.707 without a rationale comment, while
          Paper II describes the tightened 0.707 threshold as removing galaxies
          whose shape measurement and leakage correction are least reliable.
          The selection defines the sample and the selection response. [LINT]
          the config comment calls the ratio hlr/hlr_psf; the cut is on T/Tpsf.
          Values:
          mask_v2.0.yaml#metacal.gal_snr_min = 10;
          mask_v2.0.yaml#metacal.gal_snr_max = 500;
          mask_v2.0.yaml#metacal.gal_rel_size_min = 0.707;
          mask_v2.0.yaml#metacal.gal_rel_size_max = 3;
          mask_v2.0.yaml#metacal.gal_size_corr_ell = False;
          mask_v1.X.6.yaml#metacal.gal_rel_size_min = 0.707;
          mask_v1.X.6.yaml#metacal.gal_rel_size_max = 3;
          snr_min = 10;
          snr_max = 500;
          rel_size_min = 0.5;
          rel_size_max = 3.0;
          size_corr_ell = True.
        default: snr_10_500_size_0p707_3_raw_t
        options:
          snr_10_500_size_0p707_3_raw_t:
            label: 10 < SNR < 500, 0.707 < T/Tpsf < 3, no ellipticity correction of T
          size_0p5_corrected_t:
            label: 0.5 < T/Tpsf < 3 on ellipticity-corrected T (class defaults)
            description: >-
              The metacal() constructor defaults;
              calibrate_comprehensive_cat.py always passes the config values,
              so selecting them is a config edit.
      noshear_psf_size:
        label: Which reconvolved-PSF size the no-shear selection divides by
        rationale: >-
          For a v1 table the grammar reads NGMIX_T_PSF_RECONV_NOSHEAR from
          NGMIX_Tpsf_1P when the column exists and from NGMIX_Tpsf_NOSHEAR
          otherwise; ShapePipe v2 reuses one reconvolved PSF across metacal
          types and needs no correction. In the v1.4, v1.5 and v1.6
          comprehensive catalogues NGMIX_Tpsf_NOSHEAR differs by about 2% from
          the kernel metacal applied, which the sheared types' sizes record
          (they agree to about 1e-5), and the v1.4.6.3 release cut on the 1P
          value. The size cut moves with the denominator, so the selected
          sample and its response move with this choice. The same column sets
          the size ratio of the w_des and leakage bins; the release binned on
          the raw value, so calibrating through the grammar reproduces the
          release's selection but not its w_des and leakage columns bit for
          bit.
          Values: fallback = NGMIX_Tpsf_NOSHEAR.
        default: tpsf_1p_for_v1
        options:
          tpsf_1p_for_v1:
            label: v1 no-shear PSF size read from NGMIX_Tpsf_1P where the table has it
          tpsf_noshear_as_written:
            label: NGMIX_Tpsf_NOSHEAR as written
            excluded: true
            excluded_reason: >-
              In the v1.4, v1.5 and v1.6 comprehensive catalogues
              NGMIX_Tpsf_NOSHEAR is about 2% off the kernel metacal applies.
      response_estimator:
        label: Metacal response, R = <R_shear> + R_selection
        rationale: >-
          Per-object R_shear is the finite difference (g+ - g-)/(2h) of the
          sheared types on the no-shear selection, R_selection is the
          difference of the no-shear ellipticity means over the +h and -h
          sheared selections divided by 2h, and the global 2x2 R is the mean of
          R_shear (weighted as response_weighting sets) plus R_selection
          (metacal._shear_response, _selection_response, _total_response).
          Calibrated shears are inv(R) applied to the no-shear ellipticities
          (get_calibrated_quantities). h = 0.01 matches the metacal step
          ShapePipe's ngmix module applies in both generations. Standard
          metacalibration (Sheldon and Huff 2017). R is the multiplicative
          calibration of the cut-catalogue shears that the downstream shear
          statistics read; cosmo_val applies no further response to SP_v1.4.6.3
          (shear.R 1.0). [HARDCODED] estimator form.
          Values: step = 0.01.
        default: global_response
        options:
          global_response:
            label: One global R over the selected sample, shear plus selection terms
          two_point_response:
            label: Two-point (scale-dependent) response
            description: Not implemented.
      response_weighting:
        label: Weight used to average the global shear response
        rationale: >-
          global_R_weight names the no-shear quantity that weights the mean of
          per-object R_shear (metacal._total_response); the committed configs
          set w, the weight metacal.get_variance_ivweights computes
          (shape_weights), and the class default None gives an unweighted mean.
          R_selection is unweighted in every case. cosmo_val weights the
          SP_v1.4.6.3 statistics by w_des (shear.w_col) with shear.R 1.0, so
          the applied response is averaged under a different weight from the
          one those statistics use. No rationale is recorded at the sites.
          [LINT] on a 6M-row sample of SP_v1.4.6.3 the mean diagonal R_g is
          0.804 under w_iv and 0.827 under w_des; holding R_selection fixed, a
          w_des-weighted shear response would make the total response about
          2.9% larger, so shear amplitudes sit about 2.9% and xi about 5.9%
          above that counterfactual. This is a normalization inconsistency
          between weightings, not a measured bias against true shear: whether
          the published image-simulation m = -0.057 absorbs it is not
          established (response-weight-mismatch).
          Values:
          mask_v2.0.yaml#metacal.global_R_weight = w;
          mask_v1.X.6.yaml#metacal.global_R_weight = w;
          global_R_weight = None.
        default: iv_weighted_shear_response
        options:
          iv_weighted_shear_response:
            label: >-
              R_shear averaged with w (the coded inverse-variance weight),
              R_selection unweighted
          unweighted:
            label: Unweighted means (class default; the committed image-simulation configs)
          statistic_weight:
            label: Average R_shear and R_selection with the statistic weight w_des
            description: >-
              Not implemented; w_des is computed after metacal. The response of
              a w_des-weighted mean also carries weight and cell-migration
              derivatives in its selection term, which averaging R_selection
              with w_des does not capture.
      shape_weights:
        label: Inverse-variance and DES-like shape weights
        rationale: >-
          metacal.get_variance_ivweights computes w = 1/(2 sigma_eps^2 +
          NGMIX_G1_ERR_NOSHEAR + NGMIX_G2_ERR_NOSHEAR), with sigma_eps the
          configured prior dispersion; w weights the global shear response
          (response_weighting). The cut catalogue's w_iv column is copied from
          the comprehensive catalogue (calibrate_comprehensive_cat.py), and on
          the 791,667 selected objects of a 6M-row v1.4 comprehensive sample it
          equals that formula exactly. w_des follows Gatti et al. (2021): 20 x
          20 logarithmic bins in SNR and T/Tpsf over the metacal cut ranges,
          each bin's weight the squared mean diagonal response over the mean
          (e1^2 + e2^2)/2 of the uncalibrated ellipticities; a value outside
          the range, or missing, falls in the last bin of its axis (get_w_des,
          compute_weights_gatti). cosmo_val weights the SP_v1.4.6.3 statistics
          by w_des (shear.w_col), and the n_eff and sigma_e it reports use the
          configured weight. The data calibration configs set sigma_eps_prior =
          0.34 without a rationale comment. [LINT] G1_ERR and G2_ERR are
          standard deviations added to variances
          (iv-weight-adds-sigma-to-variance).
          Values:
          mask_v2.0.yaml#metacal.sigma_eps_prior = 0.34;
          sigma_eps = 0.34;
          num_bins = 20.
        default: gatti_20x20_and_iv
        options:
          gatti_20x20_and_iv:
            label: w_des from 20x20 SNR-size bins; w_iv as coded
          iv_only:
            label: Inverse-variance weights for the statistics
            description: cosmo_val reads shear.w_col; the SP_v1.4.6_uncal_w_iv entry selects w_iv.
      additive_bias:
        label: Additive bias subtracted in the cut catalogue
        rationale: >-
          c is the unweighted mean of the uncalibrated no-shear ellipticities
          over the metacal selection, and the calibrated shear is inv(R)(g - c)
          when additive_correction is True, the default the data configs take
          by omission; the image-simulation configs set it False
          (get_calibrated_m_c). Subtracting the sample mean treats the
          survey-mean shear as zero; the get_calibrated_m_c docstring keeps the
          mean for constant-shear image simulations, where it is the signal
          (#226). On a 6M-row sample of SP_v1.4.6.3 the w_des-weighted and
          unweighted means of the uncalibrated ellipticities differ by 3e-5 in
          e1 and 8e-6 in e2.
          Values:
          additive_correction = True;
          mask_v2.0.yaml#metacal.additive_correction = absent.
        default: unweighted_mean_subtracted
        options:
          unweighted_mean_subtracted:
            label: Unweighted mean c, subtracted as inv(R) c
          weighted_mean:
            label: w_des-weighted mean
            description: >-
              Not implemented in get_calibrated_m_c (#156). The on-disk helper
              get_calibrate_e_from_cat computes a w_<weight_type>-weighted c,
              but no pipeline calls it.
          none:
            label: No subtraction (additive_correction False)
      objectwise_leakage_correction:
        label: Object-wise PSF-leakage correction producing e*_leak_corrected
        rationale: >-
          Following Li et al. (2023), galaxies are split into 20 quantile bins
          of the size ratio Tpsf/(T + Tpsf) and, within each, 20 SNR quantiles;
          a weighted least-squares slope alpha (with an intercept) of the
          calibrated shear e against e_PSF is fit per bin with w_des, a
          five-term trend (constant, SNR^-2, SNR^-3, size ratio, size ratio
          times SNR^-2) is fit across bins, and a second per-bin fit on the
          trend-corrected shears adds a residual slope
          (get_alpha_leakage_per_object). The catalogue stores e_leak_corrected
          = e - alpha e_PSF, the fiducial shear columns of Paper II
          (shear_field.fiducial_columns). e_PSF is the comprehensive
          catalogue's e1_PSF/e2_PSF; the committed extract_info.py writes these
          as copies of NGMIX_G1_PSF_ORIG_NOSHEAR and NGMIX_G2_PSF_ORIG_NOSHEAR,
          which the grammar presents from reconvolved-PSF aliases for v1
          inputs. [LINT] the trend fit weights by 1/err^4 (#382), and any
          exception in the fit becomes alpha = -99, which the caller applies to
          the shears (#382).
          Values: catalog_builders.py#weight_type = des; num_bins = 20.
        default: li2024_20x20_wdes
        options:
          li2024_20x20_wdes:
            label: Binned alpha with trend and residual passes, w_des weights
          global_alpha:
            label: No per-object correction
            description: cosmo_val's uncorrected versions read e1/e2 instead of the corrected columns.

  # ═════════════════════════════════════════════════════════════════════════
  shear_bias_simulations:
    description: >-
      The multiplicative and additive bias measured on the image simulations
      (workflow/image_sims, sp_validation.image_sims). Each sheared branch is
      run through ShapePipe and the data calibration script, then the +g and
      -g branches are differenced. The science keys, mask_config among them,
      are required run keys with no committed value; the defaults recorded
      here are the estimator's code and the values the workflow template
      (workflow/image_sims/config.yaml) suggests.
    inputs:
      - id: image_simulations
        from: ../image_simulations
    outputs:
      - id: mbias
        type: metric
        format: yaml
        description: m1, m2, c1, c2 with bootstrap errors per weight scheme.
        inputs: [image_simulations]
        decisions: [mbias_estimator, mbias_sim_selection, mbias_uncertainty]
    decisions:
      mbias_estimator:
        label: Paired finite-difference m and c on calibrated ellipticities
        rationale: >-
          ImageSimMBias reads each branch's calibrated e1/e2: inv(R) applied
          with that branch's own global response R = <R_shear> + R_sel,
          estimated on the branch's full selected sample. With pair_match true
          it matches each -g object to its nearest +g object within
          match_radius_deg, which does not guarantee one-to-one pairs, and
          averages m = (e+ - e-)/(2 g_in) - 1 and c = (e+ + e-)/2 over the
          pairs, each weighted by the mean of its two objects' weights;
          pair_match false differences and sums the two branches' weighted
          means instead. Only the diagonal components are measured: m1 and c1
          come from e1 of the g1-sheared pair, m2 and c2 from e2 of the
          g2-sheared pair, and the unsheared branch is loaded but does not
          enter m or c. The headline m is the residual after metacalibration,
          not the raw response bias. Pairing cancels intrinsic shape in m only
          to the extent the two branches share a response, since each is
          calibrated with its own. [LINT] m is measured on the matched pairs
          while each branch's R comes from its full selected sample, so the
          pairs' selection response is not the one removed (#386): in a
          synthetic fixture with true m = 0, paired m is +0.042 while
          pair_match false on the same catalogues gives +0.002 +- 0.007. The
          size of this bias on the SKiLLS m has not been measured. pair_match
          and match_radius_deg have no committed value; the template suggests
          true and 0.0002 deg.
          Values:
          image_sims/config.yaml#image_sims.pair_match = absent;
          image_sims/config.yaml#image_sims.match_radius_deg = absent.
        default: paired_difference
        options:
          paired_difference:
            label: Matched +g/-g pair difference, calibrated e, per-branch R
          unpaired_means:
            label: Difference of branch means (pair_match False)
          raw_response_bias:
            label: m from the uncalibrated ellipticities
            description: >-
              Not implemented; the estimator reads the calibrated e1/e2, not
              e1_uncal/e2_uncal.
      mbias_sim_selection:
        label: Selection and calibration applied to the simulated catalogues
        rationale: >-
          The run key mask_config selects the calibration config; the template
          suggests mask_v1.X.9_im_sim.yaml. That file is composed from the data
          config mask_v1.X.9.yaml by an overlay that drops IMAFLAGS_ISO and the
          healsparse mask-bit cuts, which the simulated tiles do not carry, and
          sets an unweighted global response and no additive-bias subtraction.
          Its cuts are FLAGS <= 2, overlap, N_EPOCH >= 1, 15 <= mag <= 30, no
          ngmix failure, valid PSF ellipticities, 5 < SNR < 500 and 0.25 <
          T/Tpsf < 10. Additive-bias subtraction is off because it makes each
          branch's unweighted full-sample mean calibrated shear zero, giving m
          = -1 for an unweighted, unmatched estimate but not necessarily for
          matched or weighted estimates (#226). The response is unweighted and
          the template's w_cols leads with "none" (unit weights; the first
          w_cols entry is the headline result) because w_des weights on the
          simulations are dominated by a few objects, and #227 closed on using
          no weights in the simulation m-bias. When mask_config selects
          mask_v1.X.9_im_sim.yaml, the headline m applies to its
          simulation-selected sample (the matched pairs among it when
          pair_match is true) under the first w_cols scheme, while the
          SP_v1.4.6.3 FITS header records the mask_v1.X.6.yaml selection (among
          it FLAGS = 0, N_EPOCH >= 2, SNR > 10 and 0.707 < T/Tpsf < 3) with a
          response weighted by w, and cosmo_val analyses that catalogue under
          w_des. mask_config and w_cols are required run keys.
          Values:
          mask_v1.X.9_im_sim.yaml#dat.0.value = 2;
          mask_v1.X.9_im_sim.yaml#dat.2.value = 1;
          mask_v1.X.9_im_sim.yaml#metacal.gal_snr_min = 5;
          mask_v1.X.9_im_sim.yaml#metacal.gal_snr_max = 500;
          mask_v1.X.9_im_sim.yaml#metacal.gal_rel_size_min = 0.25;
          mask_v1.X.9_im_sim.yaml#metacal.gal_rel_size_max = 10;
          mask_v1.X.9_im_sim.yaml#metacal.global_R_weight = None;
          mask_v1.X.9_im_sim.yaml#metacal.additive_correction = False;
          _UNWEIGHTED = none;
          image_sims/config.yaml#image_sims.mask_config = absent;
          image_sims/config.yaml#image_sims.w_cols = absent.
        default: v1x9_im_sim_unweighted
        options:
          v1x9_im_sim_unweighted:
            label: mask_v1.X.9_im_sim.yaml, unit weights, no additive correction
          fiducial_matched:
            label: Simulation cuts matching the analysed catalogue's selection and weights
            description: >-
              No image-simulation config with the v1.X.6 cuts exists
              (mask_v1.X.4_im_sim.yaml has SNR > 10 but 0.5 < T/Tpsf < 3). A
              w_des entry in w_cols gives the analysis weighting, which #227
              found dominated by a few objects on the simulations.
      mbias_uncertainty:
        label: Object bootstrap with the response held fixed
        rationale: >-
          Errors are the standard deviation of m and c over n_bootstrap
          resamples. With pair_match true each resample draws matched pairs
          with replacement; with pair_match false the +g and -g catalogues are
          resampled independently. For each shear pair the indices come from a
          generator seeded with bootstrap_seed and are reused across weight
          schemes. Each resample uses calibrated ellipticities and their
          corresponding weights, with each branch's response held fixed. [LINT]
          the reported error omits response-estimation noise (#386): in a
          synthetic ensemble the repeat-run scatter of m is 1.96 (m1) and 1.89
          (m2) times the mean reported error, and a diagnostic on one SKiLLS
          tile on disk (imsims-ab grid_1, tile 233.293), using assumed g_in =
          0.02 rather than the injected 0.025, raises sigma(m1) from 0.027 to
          0.039 and sigma(m2) from 0.022 to 0.042 when the mean shear response
          is re-estimated on each matched resample with selection response held
          fixed. Both keys are required run keys; the template suggests 500 and
          42.
          Values:
          image_sims/config.yaml#image_sims.n_bootstrap = absent;
          image_sims/config.yaml#image_sims.bootstrap_seed = absent.
        default: object_bootstrap_fixed_response
        options:
          object_bootstrap_fixed_response:
            label: Object bootstrap (paired when pair_match is true), R fixed
          tile_jackknife:
            label: Leave-one-tile-out jackknife
            description: >-
              Not implemented; #346 proposes it because tile-level systematics
              can correlate objects within a tile. A jackknife that keeps each
              branch's full-sample R would still omit response noise.

  # ═════════════════════════════════════════════════════════════════════════
  shear_field:
    description: >-
      The shear field the two-point statistics correlate, and the survey
      numbers the analytic covariances take from it: which catalogue columns
      and weights, the mean subtraction and response (applied to the
      real-space field; pseudo-Cl takes the configured e1/e2 as they are), the
      area, and the effective density and shape noise.
    inputs:
      - id: shear_catalogue
        from: ../shear_catalogue
    outputs:
      - id: calibrated_shear_field
        type: data
        format: fits
        description: Positions, (e - c)/R and weights of the analysed version as TreeCorr receives them; NaMaster receives the configured e1/e2 and weights.
        inputs: [shear_catalogue]
        decisions: [fiducial_columns, mean_subtraction_and_response]
      - id: survey_numbers
        type: metric
        format: json
        description: Area, n_eff and sigma_e handed to CosmoCov and OneCovariance.
        inputs: [shear_catalogue]
        decisions: [survey_area, covariance_survey_inputs]
    decisions:
      fiducial_columns:
        label: Catalogue versions, shear columns and weight the statistics read
        rationale: >-
          A version is a cat_config entry; a requested <version>_leak_corr with
          no entry of its own is a deep copy of its parent with
          shear.e1_col/e2_col replaced by e1_col_corrected/e2_col_corrected,
          inheriting the path, weight, n(z), footprint and covariance survey
          numbers (CosmologyValidation constructor; common.catalogue_entry,
          base_version). SP_v1.4.6.3 reads e1/e2 with w_des, and its corrected
          columns are e1_leak_corrected/e2_leak_corrected, so the Paper II
          fiducial SP_v1.4.6.3_leak_corr is the leakage-corrected shear field
          under w_des. papers/cosmo_val measures SP_v1.4.6.3 and its corrected
          variant; papers/bmodes compares v1.4.5, v1.4.6.3, v1.4.8 and
          v1.4.11.3, each with its corrected variant. The columns and weight
          feed xi+-, COSEBIs, pure E/B, pseudo-Cl and tau: the weight is
          TreeCorr's per-object weight in real space and the per-object weight
          of the NaMaster catalogue fields and shear maps. [LINT] the SACC
          assembly takes tracers and metadata from the first part only (#381).
          Values:
          cosmo_val/config/config.yaml#versions = ["SP_v1.4.6.3", "SP_v1.4.6.3_leak_corr"];
          cosmo_val/config/config.yaml#fiducial.version = SP_v1.4.6.3_leak_corr;
          bmodes/config/config.yaml#versions = ["SP_v1.4.5", "SP_v1.4.5_leak_corr", "SP_v1.4.6.3", "SP_v1.4.6.3_leak_corr", "SP_v1.4.8", "SP_v1.4.8_leak_corr", "SP_v1.4.11.3", "SP_v1.4.11.3_leak_corr"];
          bmodes/config/config.yaml#fiducial.version = SP_v1.4.6.3_leak_corr;
          bmodes/config/config.yaml#fiducial.mock_version = SP_v1.4.6.3.
        default: leak_corrected_wdes
        options:
          leak_corrected_wdes:
            label: SP_v1.4.6.3_leak_corr, e*_leak_corrected with w_des
          uncorrected:
            label: SP_v1.4.6.3, e1/e2 with w_des (the comparison version)
          iv_weighted:
            label: w_iv instead of w_des
            description: >-
              cat_config's inverse-variance entry, SP_v1.4.6_uncal_w_iv, reads
              v1.4.6's e1_uncal/e2_uncal with w_iv; no entry pairs
              SP_v1.4.6.3's columns with w_iv. The weight enters n_eff and the
              galaxy-shear correlation estimators.
      mean_subtraction_and_response:
        label: Survey-mean subtraction and scalar response in the real-space shear field
        rationale: >-
          cosmo_val estimates c as the w-weighted mean of e/R per component
          over the whole version, with R the entry's scalar shear.R
          (calculate_additive_bias, survey.additive_bias), and the real-space
          statistics correlate g = (e - c)/R (_calibrated_g); for DES, g
          divides by the catalogue means of the R11/R22 columns instead.
          SP_v1.4.6.3 sets R 1.0, so its g is e minus its w_des-weighted mean.
          xi+- (and through it COSEBIs and pure E/B) and the aperture-mass
          dispersion read this g; on the tomography branch g is formed before
          the bin masks are applied, so the mean is global, not per bin. The
          pseudo-Cl fields take the configured e1/e2 columns with no mean
          subtracted and no response applied, and tau's galaxy field subtracts
          its own w-weighted mean of the raw columns inside shear_psf_leakage.
          For the fiducial R = 1 field, subtracting its w_des-weighted mean
          removes a constant offset from its catalogue components; the change
          in xi+ depends on pair geometry and cross-terms with the nonconstant
          field. The user guide (docs/source/using_the_catalogues.md) gives the
          reason for treating the survey-mean shear as zero: over the UNIONS
          area it is an excellent approximation to zero. #156 prefers weighting
          that mean with the weights the statistics use, which w (the entry's
          w_col) does. [LINT] c is the mean of e/R but is subtracted from e
          before the division by R, so for a scalar R other than 1 the field
          keeps a mean of c(R - 1)/R, and the pseudo-Cl and tau fields ignore
          shear.R (#382).
        default: global_weighted_mean_scalar_r
        options:
          global_weighted_mean_scalar_r:
            label: Global w-weighted <e/R> subtracted, scalar R from cat_config
          per_bin_mean:
            label: Mean subtracted per tomographic bin
            description: Not implemented; the tomography branch subtracts the full-catalogue mean.
          no_subtraction:
            label: Correlate e/R and model c in inference
            description: Not implemented.
      survey_area:
        label: Survey area from the configured mask, else catalogue occupancy
        rationale: >-
          CosmologyValidation.area sums the configured mask map's values times
          the pixel area when the entry has a top-level mask key, and otherwise
          counts HEALPix pixels at nside_mask holding at least one galaxy
          (calculate_area, calculate_area_from_binned_catalog;
          survey.area_from_coords implements the same count for
          compute_survey_stats). SP_v1.4.6.3 names the nside-4096 footprint
          map, whose integral is 2894.03 deg^2, the entry's cov_th.A. The area
          enters n_eff_gal, and both reach the OneCovariance survey inputs.
          [LINT] an occupancy test on a contiguous 1e6-row block of the
          fiducial catalogue at nside_mask 8192 finds that 63% of the sampled
          interior footprint pixels hold a galaxy, implying a 37% area deficit
          for those pixels rather than a full-catalogue area measurement
          (#387); mask values are summed as-is so an UNSEEN pixel contributes a
          huge negative area (#387), and area_from_coords' docstring says
          occupancy overestimates the area (#387).
          Values: cosmo_val.nside_mask = 8192.
        default: mask_integral
        options:
          mask_integral:
            label: Sum of the configured mask map times pixel area
          occupancy:
            label: Occupied pixels at nside_mask (entries without a mask key)
          mask_support:
            label: Count mask > 0 pixels, excluding UNSEEN
            description: Not implemented.
      covariance_survey_inputs:
        label: Survey numbers CosmoCov and OneCovariance take, and their conventions
        rationale: >-
          CosmoCov reads the entry's static cov_th block verbatim
          (covariance.smk get_cat_params, through common.catalogue_entry, so a
          _leak_corr version takes its parent's): area A in deg^2, n_e the Kish
          effective count (Sum w)^2/Sum w^2 divided by A in arcmin^2, and
          sigma_e the summed-component dispersion sqrt(Sum w^2 (e1^2 +
          e2^2)/Sum w^2) that survey.effective_survey_stats computes. No
          workflow rule regenerates cov_th:
          CosmologyValidation.compute_survey_stats(overwrite_config=True) takes
          A from a readable mask, otherwise reuses an existing cov_th.A before
          trying catalogue occupancy with nside, computes n_e and sigma_e, and
          writes the three values to cat_config; nothing committed calls it.
          OneCovariance instead receives the live area, n_eff_gal and the
          per-component dispersion sqrt(0.5(<e1^2> + <e2^2>)) with w^2 weights
          (survey.n_eff_density, survey.ellipticity_dispersion;
          _modify_onecov_config, called from calculate_pseudo_cl_onecovariance,
          which no workflow rule runs). Both dispersions are uncentred
          root-mean-square measures of ellipticity columns, not divided by R;
          OneCovariance's comes from the analysed version's configured columns.
          On the tomography branch each bin's n_eff divides its Kish count by
          the full-version area. CosmoCov's source takes the per-component
          shape noise as sigma_e^2/(2 n), which matches the summed-component
          convention, and its Gaussian terms carry a 1/A factor, so these
          numbers set the shape-noise and area scaling of the analytic xi
          covariance handed to inference. The tau covariance (shear_psf_leakage
          CovTauTh) computes its own A and n_e from the galaxy catalogue.
          [LINT] in the tomography cat_config, which the merge adopts,
          SP_v1.3.6 and SP_v1.4.6 are each defined twice, and SP_v1.3.6,
          SP_v1.6.6 and the second, live SP_v1.4.6 block carry SP_v1.4.6.1's
          cov_th verbatim (A 2405.39 deg^2, n_e 6.128, sigma_e 0.3796) (#374).
        default: static_cov_th_summed_sigma
        options:
          static_cov_th_summed_sigma:
            label: >-
              Static cov_th from cat_config (summed-component sigma_e) for
              CosmoCov; live per-component numbers for OneCovariance
          measured_per_run:
            label: Survey numbers generated from catalogue and mask as a workflow product
            description: >-
              No workflow rule produces them;
              compute_survey_stats(overwrite_config=True) writes them into
              cat_config when called by hand.

  # ═════════════════════════════════════════════════════════════════════════
  real_space:
    description: >-
      The TreeCorr xi+- measurement: the reporting grid that is the analysis
      data vector, the fine integration grid the B-mode statistics integrate
      over, the pair approximation, and the jackknife patches.
    inputs:
      - id: calibrated_shear_field
        from: ../shear_field.calibrated_shear_field
    outputs:
      - id: xi_parts
        type: data
        format: fits
        description: Per-grid xi+- SACC parts (reporting and integration), each with its measured covariance.
        inputs: [calibrated_shear_field]
        decisions: [reporting_grid, integration_grid, pair_approximation, jackknife_patches]
    decisions:
      reporting_grid:
        label: Reporting xi+- grid, 20 logarithmic bins over 1-250 arcmin
        rationale: >-
          GGCorrelation receives min_sep, max_sep and nbins in arcmin with
          RA/Dec in degrees and no bin_type, so TreeCorr's Log binning applies
          (CosmologyValidation.treecorr_config; common.xi_grids; the xi rule).
          The same grid bins rho and tau and, snapped onto the integration
          grid, indexes the pure-E/B PTE matrices. It is the
          configuration-space data-vector binning of Paper III, which Paper II
          adopts (unions_bmodes.tex); no further rationale is recorded.
          CosmologyValidation's own default lower bound is 0.1 arcmin; the
          workflow scripts pass the configured bounds. The grid sets the bins
          pairs are counted into (up to the pair approximation,
          real_space.pair_approximation), the scale cuts available downstream
          and the terminal data vector.
          Values:
          cosmo_val.theta_min = 1.0;
          cosmo_val.theta_max = 250.0;
          cosmo_val.nbins = 20;
          bmodes/config/config.yaml#fiducial.min_sep = 1.0;
          bmodes/config/config.yaml#fiducial.max_sep = 250.0;
          bmodes/config/config.yaml#fiducial.nbins = 20.
        default: log_1_250_20
        options:
          log_1_250_20:
            label: 20 Log bins, 1-250 arcmin
          other_range:
            label: Different bounds or bin count
            description: A config change; the CosmoCov covariance is requested on the same grid.
      integration_grid:
        label: Fine xi+- grid the pure-E/B and COSEBIs integrals use
        rationale: >-
          A second named grid feeds both B-mode statistics (common.xi_grids;
          cosmo_val.smk routes the integration part and its CosmoCov covariance
          to cv_pure_eb and cv_cosebis). papers/cosmo_val integrates 0.08-300
          arcmin in 1000 Log bins with one patch; papers/bmodes 0.5-300 arcmin
          in 1000 bins, the grid of Paper II. The pure-E/B transform integrates
          over the fine grid's extent, which must reach beyond the reporting
          range on both sides (b_modes.pure_eb_operator); Paper II gives the
          extended range as reducing edge effects in the boundary functions S+-
          and V+- (unions_bmodes.tex). No site records why 0.08 or 0.5 arcmin
          in particular. The grid sets the transform interval
          (bmodes.pure_eb_transform), the snapped reporting edges and the
          CosmoCov covariance paired with it. The GLASS-mock xi is measured on
          the same grid node for node (glass_mock.smk). The API methods default
          to their own grids: CosmologyValidation.calculate_pure_eb to 0.08-300
          arcmin and calculate_cosebis to 0.5-500 arcmin, 1000 bins each.
          [LINT] papers/cosmo_val carries both cosmo_val.integration.min_sep
          0.08 and fiducial.min_sep_int 0.5; the first governs the cosmo_val
          rules and the second the covariance.smk fiducial target.
          Values:
          cosmo_val.integration.min_sep = 0.08;
          cosmo_val.integration.max_sep = 300;
          cosmo_val.integration.nbins = 1000;
          bmodes/config/config.yaml#fiducial.min_sep_int = 0.5;
          bmodes/config/config.yaml#fiducial.max_sep_int = 300.0;
          bmodes/config/config.yaml#fiducial.nbins_int = 1000.
        default: cosmo_val_0p08_300_1000
        options:
          cosmo_val_0p08_300_1000:
            label: 0.08-300 arcmin, 1000 bins (papers/cosmo_val)
          bmodes_0p5_300_1000:
            label: 0.5-300 arcmin, 1000 bins (papers/bmodes)
          reporting_grid_only:
            label: Integrate the 20-bin reporting grid
            excluded: true
            excluded_reason: >-
              Integrating over the reporting range itself leaves the edge
              reporting bins without kernel support beyond them, so
              pure_eb_operator rejects the under-determined rows.
      pair_approximation:
        label: TreeCorr pair approximation and tree depth
        rationale: >-
          bin_slop and angle_slop are left at TreeCorr's defaults (bin_slop =
          min(1, 0.1/bin_size), 0.36 on the 20-bin reporting grid and 1.0 on
          the 1000-bin grids; angle_slop 0.1) and the metric is TreeCorr's
          Euclidean chord. The tomography branch's core.py, which the merge
          adopts, sets neither min_top nor num_threads, so TreeCorr takes its
          thread count from the node's CPU count (multiprocessing.cpu_count)
          and derives min_top from it, and xi+- measured with patches depends
          on the node the job runs on [LINT] (#374). develop's core.py pins
          min_top = 6, the value TreeCorr derives on candide's 48- and 64-CPU
          nodes, and num_threads to the process's CPU affinity. No site records
          why approximate pairs are kept; TreeCorr's docstring describes its
          default bin_slop as giving a maximum error of 10% on any bin.
          Approximate pairs can shift xi+- and meanr near bin edges. On UNIONS
          the pair-weighted average of the 1000-bin xi+ differs from the
          measured 20-bin xi+ by 1.5% of its maximum (0.46 sigma), and xi- by
          0.63 sigma; a synthetic catalogue reproduces gaps of that size from
          the default bin_slop, so they are attributed to it, which is not
          proved on the data (Paper II referee-response work). In the #253
          end-to-end run the reporting-grid xi+- moved by up to 0.55 sigma
          between two patch-centre sets and 0.63 sigma between 1 and 100
          patches (sigma from the CosmoCov diagonal), likely through the same
          approximation (unconfirmed). [HARDCODED]
        default: treecorr_defaults
        options:
          treecorr_defaults:
            label: Default bin_slop and angle_slop, Euclidean metric
          exact_pairs:
            label: bin_slop = 0, angle_slop = 0
            description: Only through TreeCorr keyword arguments; no config key.
      jackknife_patches:
        label: Patch count and the variance it selects
        rationale: >-
          calculate_2pcf_version, which calculate_2pcf calls per version, sets
          var_method to jackknife when npatch > 1 and to shot otherwise,
          whatever the constructor's var_method. cross_patch_weight is the
          constructor's: match (the Mohammad & Percival 2022 cross-pair weight)
          when its var_method is jackknife, the constructor default, and simple
          otherwise. With npatch > 1 and no existing centres file, TreeCorr
          computes unseeded k-means centres from the first measurement's
          catalogue (with tomography, the first bin pair's first bin) and
          writes them to {version}_patches_npatch={N}.dat for reuse; a fresh
          output tree can therefore get a different layout. run_2pcf.py selects
          the dense jackknife covariance for patched measurements and the
          shot-noise varxip/varxim diagonal otherwise, but it expects a
          GGCorrelation where the surviving calculate_2pcf returns a nested
          dict; assembly replaces any reporting-part covariance with CosmoCov.
          papers/cosmo_val uses 100 patches on the reporting grid,
          papers/bmodes and the integration grid 1. The B-mode rules and
          terminal reporting vector use CosmoCov rather than the xi+- jackknife
          covariance; on the API path, calculate_cosebis without cov_path
          propagates gg.cov (jackknife when npatch > 1, shot noise otherwise),
          and plot_2pcf_tomography with the xi+- plotting callback uses
          sqrt(varxip) and sqrt(varxim) for error bars. The #253 comparisons
          show that patch layout and count can move xi+- itself, with the pair
          approximation as an unconfirmed cause
          (real_space.pair_approximation). [LINT] the constructor docstring and
          papers/cosmo_val's cosmo_val.var_method offer a variance method the
          xi+- measurement does not apply, and the top-level var_method key of
          both paper configs is read by nothing.
          Values:
          cosmo_val.npatch = 100;
          cosmo_val.var_method = jackknife;
          bmodes/config/config.yaml#fiducial.npatch = 1.
        default: kmeans_jackknife_by_npatch
        options:
          kmeans_jackknife_by_npatch:
            label: Unseeded k-means patches, persisted; jackknife iff npatch > 1
          seeded_kmeans:
            label: Seeded k-means on a tree of pinned depth, no centres file
            description: >-
              Not implemented in the committed code; open as
              CosmoStat/sp_validation PR #367.
          sample_or_bootstrap:
            label: TreeCorr sample or bootstrap variance
            description: Not reachable; calculate_2pcf_version overrides var_method.

  # ═════════════════════════════════════════════════════════════════════════
  bmodes:
    description: >-
      The B-mode null tests: pure E/B modes (Schneider et al. 2022) and
      COSEBIs from the integration-grid xi+-, the C_l^BB test from the
      pseudo-Cl, the covariance behind them, the chi2 statistic, the fiducial
      scale cut and the summary. The committed path is the cosmo_val workflow
      (cv_pure_eb, cv_cosebis, cv_summarize_bmodes), which reads SACC parts
      and calls b_modes.py directly; the CosmologyValidation mixins are the
      API path.
    inputs:
      - id: xi_parts
        from: ../real_space.xi_parts
      - id: footprint_products
        from: ../footprint_products
    outputs:
      - id: bmode_ptes
        type: metric
        format: json
        description: bmode_summary.json plus the pure-E/B and COSEBIs npz products and SACC parts.
        inputs: [xi_parts, footprint_products]
        decisions:
          [pure_eb_transform, pure_eb_rebinning, pure_eb_xim_padding,
           bmode_covariance, null_test_statistic, fiducial_scale_cut,
           cosebis_modes, bmode_summary]
    decisions:
      pure_eb_transform:
        label: Pure-E/B transform as a fixed-quadrature linear operator on the fine grid
        rationale: >-
          b_modes.pure_eb_operator evaluates the Schneider et al. (2022)
          transform as one matrix on the integration grid: cosmo_numba's
          get_pure_EB_operator integrates a degree-5 interpolant in log theta
          with 16-node Gauss-Legendre quadrature per cell (its defaults), on
          the log-uniform fine-grid nodes (TreeCorr rnom), with the local term
          read from the fine grid (local_from_int) and [tmin, tmax] at the
          extent of the nodes (the window of the xi- modes reaches further,
          bmodes.pure_eb_xim_padding), so the transform is a function of the
          grid alone. The reporting bins then average whole fine bins under the
          pair weight (bmodes.pure_eb_rebinning). The modes are linear in xi,
          so their covariance is exactly K C K^T. The adaptive dqags path of
          cosmo_numba's get_pure_EB_modes, which the tomography branch's
          b_modes.py calls with [tmin, tmax] at the reporting edges, chooses
          its subdivision from the data: on noisy xi it often fails to converge
          (630 of 1278 integrals on the test of aguinot/cosmo-numba#23) and
          cosmo_numba discards the flag, so the modes are non-linear in xi, B
          modes pick up a bias and a Monte Carlo covariance built through it
          picks up quadrature noise (aguinot/cosmo-numba#23; #373). The merge
          (#374) brings in develop's operator, which has no adaptive path.
          [LINT] the pinned cosmo-numba (uv.lock, cailmdaley/cosmo-numba
          a64cb2e) evaluates the K+ kernel as H_-(theta, theta_int) where Eq.
          51 needs H_-(theta_int, theta), which leaks pure E into xi-^B
          (aguinot/cosmo-numba#22, fix with tests in cailmdaley/cosmo-numba#3);
          the committed padding suppresses the leak
          (bmodes.pure_eb_xim_padding). [HARDCODED] interpolation order and
          node count.
          Values: local_from_int = True.
        default: fixed_quadrature_fine_grid_extent
        options:
          fixed_quadrature_fine_grid_extent:
            label: Fixed quadrature on the fine nodes, interval at the fine-grid extent
          adaptive_dqags_reporting_edges:
            label: Adaptive quadrature per evaluation, interval at the reporting edges (tomography branch)
            excluded: true
            excluded_reason: >-
              Non-linear in xi: on noisy xi it often fails to converge, biases
              B modes and adds quadrature noise to Monte Carlo covariances
              (aguinot/cosmo-numba#23; #373).
          fiducial_cut_interval:
            label: The fiducial scale cut as the transform interval
            description: Not implemented; a narrow interval exposes the K+ kernel defect.
      pure_eb_rebinning:
        label: Fine-to-reporting rebinning weights of the pure modes
        rationale: >-
          Each requested reporting edge snaps to the nearest fine edge in log
          theta, and one matrix P averages the fine bins of each reporting bin
          under the TreeCorr pair weight Sum w_i w_j (gg.weight, carried on the
          integration part), acting on the local and integral terms alike
          (b_modes._reporting_binning; cv_pure_eb.py reads the weights with
          get_xi_weight). P gives the reporting modes, xi and theta; the
          reporting variances are diag(P C P^T). The 2026-09-07 ruling fixes
          the structure and names the weight: the pure-mode identity holds
          pointwise, so collapsing the two terms with different functionals
          biases the estimator, as 350 GLASS mocks showed; among consistent
          functionals it names pair counts, because the pair-count-weighted
          mean of fine-bin xi-hat is the reporting-bin xi-hat (Asgari et al.
          2019 App. A); uniform weights are indistinguishable for the integral
          term and wrong for the local term. The code uses the pair weight,
          which generalises pair counts to weighted pairs: with exact binning
          it reproduces TreeCorr's own coarse-bin xi+- and meanr, where npairs
          misses by about 3% on a weighted synthetic catalogue; on UNIONS
          weight/npairs is flat to 0.2% across fine bins, so the two move the
          modes by under 1e-3 sigma. Reporting edges move by up to half a fine
          bin, 0.41% in theta on cosmo_val's 0.08-300 arcmin, 1000-bin grid.
          The tomography branch's Monte Carlo covariance (its b_modes.py and
          papers/bmodes/scripts/precompute_pure_eb_chunk.py) averages fine bins
          uniformly while its data xi are pair-weighted [LINT] (#374); the
          merge (#374) brings in develop's operator for the pure-E/B path.
          Values: grid = integration.
        default: treecorr_pair_weight
        options:
          treecorr_pair_weight:
            label: Sum w_i w_j per fine bin, one functional for local and integral terms
          npairs:
            label: Pair counts per fine bin, one functional for both terms
            description: >-
              The ruling's named weight; the committed pair weight refines it
              to weighted pairs and agrees with it to 0.2% on UNIONS.
          uniform:
            label: Equal weight per fine bin
            excluded: true
            excluded_reason: >-
              The unweighted mean of fine-bin xi is not the reporting-bin
              xi-hat: it differs from the pair-count mean by 2.7% on rebinned
              xi+, so the local term departs from the measured xi (ruled
              2026-09-07).
          split_functional:
            label: Different weights on the local and integral terms
            excluded: true
            excluded_reason: Biased on 350 GLASS mocks; the identity holds pointwise.
      pure_eb_xim_padding:
        label: Zero-padding of the xi- branch above the integration grid
        rationale: >-
          _fixed_quadrature_operator passes no pad_xim, so cosmo_numba's
          defaults apply: pad_xim True extends the integration grid of the
          xi-^E, xi-^B and xi-^amb modes by one decade above the top fine node
          (pad_theta_max_decade 1.0, rounded to whole log steps), with zeros on
          the added nodes, and sets their window to [tmin, tmax_xim] with
          tmax_xim about 10 tmax; the xi+ modes keep [tmin, tmax]. The
          dependency gives avoiding edge effects as the reason; sp_validation
          records none. [LINT] with the pinned kernel the padding suppresses
          the K+ argument-order defect (aguinot/cosmo-numba#22): at tmax_xim,
          B_xim is close to 1 and the (1-B)^2 prefactor of H_- shrinks the K+
          term. On cosmo_numba's CCL test data, max |xi-^B/xi-| is 33% unpadded
          and 1.4% padded with the bug, and 0.015% unpadded and 0.9% padded
          with the fix (aguinot/cosmo-numba#22), so with the fixed kernel
          padding adds leakage. On cosmo_val's 0.08-300 arcmin grid the bug
          moves the fiducial xi-^B by at most 3.3e-7 sigma; in the upstream
          comparison on a 0.5-300 arcmin input grid, evaluated at reporting
          meanr with a separately npairs-rebinned local term and [tmin, tmax] =
          [1.1658, 221] arcmin, xi-^B/sigma spans up to about 0.06 across the
          four kernel/padding variants inside 12-83 arcmin, while xi+^B/sigma
          is identical in all four. [HARDCODED] in the dependency default.
          Values: pad_xim = absent; pad_theta_max_decade = absent.
        default: pad_one_decade
        options:
          pad_one_decade:
            label: pad_xim True, one decade of zeros above the grid (dependency default)
          no_padding:
            label: pad_xim False
            description: >-
              Pass pad_xim=False in _fixed_quadrature_operator. With the fixed
              kernel (cailmdaley/cosmo-numba#3) it leaks less than padding:
              0.015% against 0.9% on the CCL test data
              (aguinot/cosmo-numba#22).
          theory_extrapolation:
            label: Extend xi- with a theory model
            description: Not implemented.
      bmode_covariance:
        label: Covariance behind the pure-E/B and COSEBIs tests
        rationale: >-
          The cosmo_val workflow feeds both statistics the CosmoCov Gaussian
          ("g") xi+- covariance on the integration grid (cosmo_val.smk
          cv_xi_cov_integration), whose shape noise carries no footprint
          correction (covariance.footprint_mask_power), and propagates the full
          pure-mode covariance as K C K^T (calculate_pure_eb_correlation) and
          the COSEBIs EE and BB marginal blocks through their linear kernels
          (cosmo_numba's cosebis_covariance_from_xipm_covariance), while
          setting the COSEBIs E/B cross block to zero; npatch is None, so no
          Hartlap factor applies. The docstring of cv_xi_cov_integration gives
          the reason: B-modes only need the scatter a Gaussian field would
          give. [LINT] the same docstring says the pure-E/B Monte Carlo draws
          from the covariance, while cv_pure_eb propagates it exactly. Without
          a covariance file, develop's API mixins
          (PureEBMixin.calculate_pure_eb, CosebisMixin.calculate_cosebis) use
          the TreeCorr jackknife of the integration-grid xi, with Hartlap. The
          choice sets every pure-E/B and COSEBIs error bar and PTE.
          Values: cv_cosebis.py#npatch = absent.
        default: cosmocov_gaussian_exact
        options:
          cosmocov_gaussian_exact:
            label: CosmoCov Gaussian integration-grid covariance, propagated exactly
          jackknife:
            label: TreeCorr jackknife of the fine-grid xi, with Hartlap
            description: Develop's API path without a covariance file (cov_path_int, cov_path).
          gaussian_monte_carlo:
            label: Monte Carlo draws from the CosmoCov covariance through the transform
            excluded: true
            excluded_reason: >-
              With a linear transform, K C K^T is the exact limit of the Monte
              Carlo covariance, without its sampling noise (#373).
          cosmocov_nongaussian:
            label: CosmoCov with connected and super-sample terms
            description: A rule change; the integration-grid request is Gaussian-only (covariance.cosmocov_terms_per_grid).
      null_test_statistic:
        label: Zero-mean chi2 with asymptotic PTE, Hartlap for sample covariances
        rationale: >-
          Every B-mode test computes chi2 = d^T C^-1 d for a zero-mean null and
          its chi2 upper-tail probability with dof = len(d)
          (statistics.chi2_and_pte; b_modes.calculate_eb_statistics,
          cosebis_scan_from_xi); cosebis_scan_from_xi takes the tail as 1 - cdf
          rather than the survival function, which rounds PTEs below about
          1e-16 to 0. hartlap_factor scales the chi2 of a covariance from N
          jackknife patches over p data points by (N - p - 2)/(N - 1) (Hartlap
          et al. 2007) and of an analytic covariance by 1. Pure E/B tests
          xi+^B, xi-^B and their joint vector with the cross block, p = n and
          2n. The covariances committed in the cosmo_val workflow and
          papers/bmodes are analytic, so the factor is 1 there; where a
          jackknife is used, [LINT] the COSEBIs marginal E and B tests apply p
          = 2 nmodes although each inverts an nmodes x nmodes block (#378), and
          the tomography branch's b_modes.py, which the merge replaces with
          develop's operator, applies p = n to the joint 2n vector (#374). Even
          after Hartlap, a chi2 on a sample covariance does not follow the chi2
          distribution exactly (Sellentin & Heavens 2016).
        default: chi2_sf_hartlap
        options:
          chi2_sf_hartlap:
            label: chi2 upper tail; Hartlap for sample covariances
          sellentin_heavens:
            label: Sellentin-Heavens t-distribution likelihood
            description: Not implemented.
          mock_calibrated:
            label: Null distribution calibrated on mocks
            description: Not implemented for the per-test PTEs.
      fiducial_scale_cut:
        label: Fiducial angular range and its mapping to bins
        rationale: >-
          B-mode PTEs are quoted at 12-83 arcmin for xi+^B, xi-^B, their joint
          vector and COSEBIs, Paper II's fiducial cuts (config comments;
          unions_bmodes.tex); papers/bmodes also reports the full 1-250 arcmin range.
          Pure-E/B cuts snap each end to the nearest reporting edge in log
          theta (bins_from_scale_cut), so a cut on a nominal edge selects the
          same bins whichever fine grid the edges snapped to; COSEBIs keep
          only integration bins wholly inside the cut (bins_from_edges), and
          when no scanned COSEBIs cut fits inside the request the nearest by
          L1 endpoint distance is used (find_conservative_scale_cut_key). The
          cut selects 7 of 20 reporting bins and the COSEBIs filter support.
          [LINT] the fallback can select a cut wider than requested.
          Values:
          cosmo_val.fiducial_scale_cut = [12, 83];
          fiducial.fiducial_min_scale = 12;
          fiducial.fiducial_max_scale = 83;
          fiducial.fiducial_xip_scale_cut = [12, 83];
          fiducial.fiducial_xim_scale_cut = [12, 83].
        default: cut_12_83_snap_and_containment
        options:
          cut_12_83_snap_and_containment:
            label: 12-83 arcmin; nearest-edge snapping for pure E/B, containment for COSEBIs
          full_range:
            label: The whole 1-250 arcmin reporting range
          separate_xip_xim_cuts:
            label: Different xi+ and xi- cuts
            description: Both config keys exist and are set equal; COSEBIs need one range.
      cosebis_modes:
        label: Log-COSEBIs, 20 modes, filters on the surviving bins' meanr range
        rationale: >-
          Logarithmic COSEBIs (the only kind cosmo_numba implements) with N_max
          20 and sympy root precision 120 rather than the dependency's 80,
          which the code comment gives as avoiding root-convergence failures
          for modes 11 and up; for each cut the filters are defined on [min
          meanr, max meanr] of the integration bins inside the cut and the
          modes integrate xi+- with cosmo_numba's irregular-grid Simpson
          weights (cosebis_scan_from_xi). cosmo_val scans seven cuts ([1, 250]
          to [20, 250] and [12, 83]) and writes the fiducial cut's result to
          the SACC part tagged with the nominal cut; papers/bmodes also
          evaluates the first 6 modes and scans all reporting-edge pairs except
          (9,10), (10,11), (11,12) and (13,14), where root finding fails even
          at precision 120. The mode count sets the length of the tested vector
          and the dof. cosebis_scan_from_xi, calculate_cosebis and CosebisMixin
          default to 10 modes; cv_cosebis passes cosmo_val.cosebis.nmodes and
          the papers/bmodes PTE scripts pass fiducial.nmodes, both 20. [LINT]
          the figures.smk comment calls the excluded windows high modes outside
          the analysis range; they are single reporting bins between 12 and 48
          arcmin, inside the bins the fiducial cut selects. The filter support
          uses the retained integration bins' measured meanr extrema rather
          than the nominal cut recorded in the SACC tags; on cosmo_val's
          0.08-300 arcmin grid, the first and last retained bins for the 12-83
          arcmin cut span about 12.014-12.113 and 81.738-82.413 arcmin,
          respectively. [LINT] papers/bmodes' cosebis.mode_subsets ([6, 20])
          is read by nothing; compute_cosebis_pte_single.py hardcodes the 6-
          and 20-mode evaluations.
          Values:
          cosmo_val.cosebis.nmodes = 20;
          precision = 120;
          bmodes/config/config.yaml#fiducial.nmodes = 20.
        default: log_20_modes
        options:
          log_20_modes:
            label: Log-COSEBIs, 20 modes, precision 120
          first_6_modes:
            label: PTE on the first 6 modes (papers/bmodes subset)
          linear_cosebis:
            label: Linear-theta COSEBIs
            description: Not implemented.
      bmode_summary:
        label: Statistics and ranges in the B-mode summary, and the verdict threshold
        rationale: >-
          cv_summarize_bmodes reports, per version, the xi+^B, xi-^B and joint
          pure-E/B PTEs at the fiducial cut read from the PTE matrices, the
          20-mode COSEBIs PTE at the fiducial cut, and, with include_pseudo_cl,
          the C_l^BB PTE over all 32 bandpowers (harmonic.fiducial.nbins)
          against the NaMaster BB-BB block. The config comment gives the reason
          for including pseudo-Cl: it costs no more than the other diagnostics,
          and the C_l^BB column belongs in the standard summary. papers/bmodes
          quotes its fiducial C_l^BB PTE over the bandpowers inside 300 <= ell
          <= 1600, the fiducial harmonic range of Papers II and IV, beside the all-band one, so the
          summary's C_l^BB entry is not the paper's fiducial C_l^BB PTE [LINT].
          No pass/fail verdict is computed: the summary carries PTEs, and the
          paper heatmaps colour PTEs below 0.05 and above 0.95 solid
          (plotting_utils.make_pte_norm's defaults, which the paper scripts
          take). [LINT] papers/bmodes' cl.n_ell_bins is read by nothing, and
          papers/bmodes' statistics.pte_healthy_range is read by nothing, and
          its comment calls the interval 2 sigma, though it leaves 10% in the
          two tails. develop's statistics.calibrate_min_pte, a mock-calibrated
          global minimum-PTE threshold, is called by no rule, and its
          global_pte (count/N) can reject more often than alpha with a finite
          mock set: under exchangeable continuous null ranks, p <= 0.05 rejects
          2/21 of the time with 20 mocks (#378); the tomography branch's
          statistics.py, which the merge keeps, has no such function.
          Values:
          cosmo_val.include_pseudo_cl = True;
          cl.fiducial_ell_min = 300;
          cl.fiducial_ell_max = 1600;
          harmonic.fiducial.nbins = 32;
          plotting_utils.py#low = 0.05;
          plotting_utils.py#high = 0.95.
        default: pure_eb_cosebis_clbb_all_bands
        options:
          pure_eb_cosebis_clbb_all_bands:
            label: Pure E/B x3 and COSEBIs at 12-83 arcmin; C_l^BB over all bandpowers; no threshold applied
          clbb_fiducial_ell_range:
            label: C_l^BB over 300-1600 (papers/bmodes)
          mock_calibrated_global_threshold:
            label: Global minimum-PTE threshold calibrated on mocks
            description: >-
              calibrate_min_pte exists on develop but is wired to no rule; the
              tomography branch's statistics.py, which the merge keeps, has
              none.

  # ═════════════════════════════════════════════════════════════════════════
  harmonic:
    description: >-
      The NaMaster pseudo-Cl data vector: estimator, multipole range and
      bandpowers. The committed producers are the twopoint.smk rules
      pseudo_cl and pseudo_cl_cov through generate_pseudo_cl*.py.
    inputs:
      - id: calibrated_shear_field
        from: ../shear_field.calibrated_shear_field
    outputs:
      - id: pseudo_cl_part
        type: data
        format: fits
        description: The EE/BB/EB bandpowers with their shared window, as a SACC part.
        inputs: [calibrated_shear_field]
        decisions: [shear_estimator, multipoles_and_bandpowers]
    decisions:
      shear_estimator:
        label: Catalogue-based pseudo-Cl with NaMaster's self-pair noise removal
        rationale: >-
          The data-vector producer, generate_pseudo_cl.py, builds one
          NmtFieldCatalog on per-object (RA, Dec, w, e1, -e2) and correlates it
          with itself, so NaMaster subtracts its analytic self-pair noise from
          the coupled auto-spectrum before decoupling with the mode-coupling
          matrix; no random rotations touch the data vector
          (pseudo_cl.get_pseudo_cls_catalog). That chain assumes the merge
          keeps develop's producer interface: generate_pseudo_cl.py calls
          calculate_pseudo_cl(out_path=...), which the tomography branch's
          mixin does not accept (it takes compute_tomography and writes FITS).
          The map alternative averages w-weighted shears in nside pixels, uses
          the weight-sum map as the mask and subtracts the mean spectrum of
          nrandom_cell random rotations seeded by cell_seed. On the tomography
          branch bins are the positive tomo_bin_col values, pairs i <= j, and
          both estimators remove noise for auto pairs only. No rationale for
          the catalogue estimator is recorded at the sites. The catalogue field
          is not pixelised; the map estimator's pixel averaging suppresses
          power roughly as the HEALPix pixel window, pw^2 = 0.91 at ell 1000
          and 0.70 at ell 1988 for nside 1024 (healpy.pixwin), which the stored
          bandpower window does not include. The estimator therefore changes
          the high-ell bandpowers and the noise treatment, and so the BB null
          test. [LINT] generate_pseudo_cl.py and generate_pseudo_cl_cov.py
          hardcode cell_method catalog and nrandom_cell 100 while the
          constructor default is map and the papers/cosmo_val keys cell_method
          and nrandom_cell do not reach them (#381); nrandom_cell does nothing
          under the catalogue estimator, and under the committed analytic
          noise_bias_method neither literal changes the covariance.
          Values: generate_pseudo_cl.py#cell_method = catalog.
        default: catalog_field
        options:
          catalog_field:
            label: NmtFieldCatalog, analytic self-pair noise removed by NaMaster
          map_field:
            label: Pixelised weighted shear map, random-rotation noise subtraction
      multipoles_and_bandpowers:
        label: Multipole range and bandpower binning
        rationale: >-
          The geometry is fixed by nside = 1024 (pseudo_cl.pseudo_cl_geometry):
          band edges run from LMIN 8 to lmax = 2 nside, while the fields,
          NmtBin and the catalogue field's mask band-limit lmax_mask stop at
          b_lmax = 2 nside - 1, so the bands cover ell 8-2047
          (get_pseudo_cls_catalog). Bandpowers are powspace: 32 bands with
          edges uniform in ell^0.5 between lmin and lmax, integer ells assigned
          by digitize with the first and last forced into the end bands
          (make_namaster_bin), giving ell_eff from 12.5 to 1988.5. No rationale
          is recorded at the sites for nside, lmin or the 32 bands; the
          papers/bmodes comment on cl.cosebis_nbins says 96 powspace bands
          recover COSEBIs modes 1-5 within about 2% of configuration space on
          GLASS mocks. The binning sets the band averages, the mode-coupling
          conditioning, the bandpower windows and the 32 dof of the full-range
          BB test (cv_summarize_bmodes.py); the mask's harmonics are computed
          only to 2047, so mask power above that does not enter the coupling.
          [LINT] the twopoint.smk pseudo_cl and pseudo_cl_cov rules set nside
          and power as literals and take binning and nbins from their
          wildcards, so the papers/cosmo_val keys cosmo_val.nside, binning,
          power and n_ell_bins reach only the cv_runner constructors (#381);
          the binning and band count come from harmonic.fiducial, through the
          tag common.pseudo_cl_tag puts in the pseudo-Cl and covariance file
          names that the B-mode summary, the figures and the assembly request.
          Values:
          nside = 1024;
          power = 0.5;
          harmonic.fiducial.binning = powspace;
          harmonic.fiducial.nbins = 32.
        default: nside1024_lmin8_powspace32
        options:
          nside1024_lmin8_powspace32:
            label: ell 8-2047 at nside 1024, 32 sqrt-spaced bands
          powspace_96:
            label: 96 bands (COSEBIs comparison)
          logspace_or_linear:
            label: >-
              Logarithmic bands with edges from ell 50 (lower ells padded into
              the first), or linear bands of ell_step
            description: >-
              Implemented in make_namaster_bin and selected by the binning
              wildcard; pseudo_cl_fine_all requests linear bands of ell_step 1
              (nbins=2040) for COSEBIs.

  # ═════════════════════════════════════════════════════════════════════════
  psf:
    description: >-
      PSF systematics: which stars enter rho and tau, how the statistics are
      estimated, the alpha/beta/eta error model, the tau covariance, the
      sampling of the fit, and the scale-dependent and object-wise leakage
      diagnostics. The committed path is the rho_tau_stats rule
      (run_rho_tau.py) and the cv_rho_tau_fits and cv_objectwise_leakage
      rules.
    inputs:
      - id: calibrated_shear_field
        from: ../shear_field.calibrated_shear_field
      - id: psf_catalogues
        from: ../psf_catalogues
    outputs:
      - id: rho_tau_part
        type: data
        format: fits
        description: rho_0..5 and tau_0/2/5 with the tau theory covariance, as FITS tables and a SACC part.
        inputs: [calibrated_shear_field, psf_catalogues]
        decisions: [psf_star_sample, rho_tau_estimator, tau_covariance]
      - id: leakage_fit
        type: metric
        format: pkl
        description: alpha, beta, eta samples, xi_psf_sys, and the scale and object-wise leakage coefficients.
        inputs: [rho_tau_part]
        decisions: [psf_error_model, leakage_fit_sampling, leakage_diagnostics]
    decisions:
      psf_star_sample:
        label: Which PSF-catalogue rows enter rho/tau, and their shape and size conventions
        rationale: >-
          The tomography branch's psf_systematics, which the merge adopts,
          keeps rows with HSM_FLAG_PSF == 0 and HSM_FLAG_STAR == 0
          (_get_star_mask) and passes that mask to the rho/tau builders and
          CovTauTh. It and the merged rho_tau.py read the PSF catalogue
          straight from FITS, not through the grammar, so on the committed
          v1.4.a file, whose columns are FLAG_*_HSM, E*_HSM and SIGMA_*_HSM,
          _get_star_mask raises KeyError [LINT] (#374). Develop reads the
          catalogue through the grammar and forwards the flag names in params
          but builds the catalogues with no cut, so every row enters [LINT
          develop-rho-tau-ignores-hsm-flags; 1.4e-4 of the v1.4.a stars are
          flagged, with sentinel-like sizes]. The grammar renames the v1 E*_HSM
          columns to HSM_G* with no value change, because ShapePipe stored
          galsim's observed_shape g under the E names (shapepipe psfex_interp),
          and presents SIGMA_*_HSM as HSM_T_* = 2 sigma^2 (grammar._v1_rules).
          cat_config names HSM_T_PSF/HSM_T_STAR as the sizes, so the size
          residual is (T_star - T_psf)/T_star = 2r - r^2 for a fractional sigma
          residual r, about twice it, and rho_3, rho_4, rho_5 and tau_5 carry
          it. Treating the stored values as e and converting them to g
          approximately halves small PSF and star ellipticities, but the
          conversion factor depends on each object's ellipticity and does not
          uniformly rescale the rho and tau statistics.
        default: flags_zero_g_and_t
        options:
          flags_zero_g_and_t:
            label: Both HSM flags zero; shapes as g, sizes as T = 2 sigma^2
          all_rows:
            label: Every PSF-catalogue row (develop)
            excluded: true
            excluded_reason: >-
              On v1.4.a, flagged stars have a median star sigma of 0.1856 and
              enter the size-error field with a median |w| about nine times
              that of clean stars.
          sigma_residual:
            label: Size residual in sigma
            description: Not implemented; the grammar presents T.
      rho_tau_estimator:
        label: rho/tau estimator, its fields, weights, centering and binning
        rationale: >-
          shear_psf_leakage builds four TreeCorr catalogues, galaxies g, PSF p
          = e_PSF, residual q = e_star - e_PSF and size error w = e_star
          (T_star - T_psf)/T_star, and measures rho_0..5 among the star fields
          and tau_0, tau_2, tau_5 of galaxies against p, q and w, on the
          reporting grid of real_space.reporting_grid (20 Log bins, 1-250
          arcmin). Galaxies are weighted by shear.w_col, w_des, and have their
          weighted mean subtracted per component; star fields are unweighted
          and uncentred. No rationale is recorded. Uncentred PSF fields retain
          mean-shape contributions in rho (the mean PSF ellipticity on v1.4.a
          is (0.011, 0.010)); galaxy centering removes correlations of the
          subtracted galaxy mean with each star field, which need not be
          scale-independent in a finite survey. On the tomography branch the
          galaxy mean is the full-catalogue mean even under a bin mask [LINT]
          (#374). [HARDCODED] in the dependency: the field definitions, weights
          and centering; the columns and the grid come from cat_config and the
          constructor.
        default: wdes_galaxies_centred_stars_raw
        options:
          wdes_galaxies_centred_stars_raw:
            label: w_des galaxies, weighted mean subtracted; unit-weight uncentred stars
          centre_all_fields:
            label: Subtract the mean of p, q and w too
            description: Not implemented; the dependency's centering lines are commented out.
      psf_error_model:
        label: PSF error model alpha, beta, eta on the p, q, w fields
        rationale: >-
          PSFErrorFit models the galaxy-PSF correlations as e_sys = alpha p +
          beta q + eta w, fitting tau_0+, tau_2+ and tau_5+ against rho_0+ to
          rho_5+ with use_eta True and no fourth-moment terms (the dependency
          defaults the psf_fitter property takes), and CovTauTh is built with
          the same use_eta. The dependency attributes the model to Gatti et al.
          2022 (PSFErrorFit docstring); no rationale is recorded at the
          sp_validation sites. The model sets alpha, beta, eta and every
          xi_psf_sys derived from them; inference uses alpha and beta only
          (inference.psf_leakage_model). [HARDCODED] in the dependency default.
        default: alpha_beta_eta
        options:
          alpha_beta_eta:
            label: alpha, beta, eta; no fourth moments
          alpha_beta:
            label: alpha, beta only (use_eta False)
            description: A dependency keyword sp_validation does not pass.
          fourth_moments:
            label: Add alpha_4 and beta_4 fourth-moment terms
            description: Implemented in shear_psf_leakage, not reachable from sp_validation.
      tau_covariance:
        label: Covariance of tau (semi-analytic) and rho (jackknife) for the leakage fit
        rationale: >-
          With cov_estimate_method th, the constructor default the
          rho_tau_stats rule takes, the tau covariance is CovTauTh's
          semi-analytic estimate, the sum of shot-noise, mixed and
          cosmic-variance terms (rho_tau.get_rho_tau_w_cov, get_theory_cov;
          CovTauTh.build_cov). The shot noise is TreeCorr's shot-noise
          covariance of the galaxy-PSF correlations; the mixed and
          cosmic-variance terms integrate measured correlations, interpolated
          linearly over 30 log bins from 0.08 to 1000 arcmin and zero outside,
          with Simpson's rule on nbin_ang 100 angles and nbin_rad 200 linear
          radii from 0.1 to 1000 arcmin. CovTauTh recomputes the area from
          occupied nside-4096 pixels of the galaxy catalogue and n_eff from the
          weights; the cat_config cov_th values play no part. The rho
          covariance is a single TreeCorr jackknife with the entry's
          patch_number (compute_cov_rho True), which the tomography branch's
          get_params_rho_tau defaults to 100 when the entry has none, as its
          cat_config SP_v1.4.6.3 entry has none; develop's entry carries 150.
          jk averages the rho and tau jackknife covariances over 100 k-means
          partitions into patch_number patches (get_rho_tau_w_cov's ncov
          default; n_cov is stored by the constructor and read nowhere) and
          Hartlap-debiases the tau precision matrix with patch_number; th and
          sim are not debiased. sim fits with a precomputed cov_tau_*_sim.npy,
          while its producer branch requires cov_tau_*_th.npy to exist. [LINT]
          CovTauTh fills shot noise only for the tau auto-blocks
          (shear_psf_leakage#49, in shear_psf_leakage), develop passes A and
          n_e that CovTauTh ignores (cs_util#81), the papers/cosmo_val keys
          cov_estimate_method and compute_cov_rho do not reach the producer
          rule (#381), and its n_cov reaches no code.
          Values:
          cosmo_val.cov_estimate_method = th;
          cosmo_val.compute_cov_rho = True.
        default: theory_tau_jackknife_rho
        options:
          theory_tau_jackknife_rho:
            label: CovTauTh tau covariance; single-jackknife rho covariance
          jackknife_both:
            label: Jackknife tau and rho, averaged over 100 k-means partitions (jk)
          simulation:
            label: Precomputed covariance file (sim)
          joint_rho_tau:
            label: Joint rho-tau covariance
            description: Not implemented.
      leakage_fit_sampling:
        label: How the alpha, beta, eta posterior and xi_psf_sys are sampled and summarised
        rationale: >-
          rho_tau_method lsq draws rho ~ N(rho, C_rho) and tau ~ N(tau, C_tau)
          independently 10000 times (get_samples' n_samples fallback, equal to
          the dependency default) and solves the generalised least squares per
          draw (get_least_squares_params_samples); alpha, beta and eta are
          summarised by their 16th, 50th and 84th percentiles. rho_tau_method
          emcee runs emcee at the measured rho with flat box priors; the
          constructor docstring lists this value as mcmc, which get_samples
          rejects. xi_psf_sys is evaluated per draw at the measured rho and
          summarised by its mean, ddof-0 variance and the 1 - quantile and
          quantile sample quantiles, 0.8413 and 0.1587 for one sigma. On the
          tomography branch cross-bin xi_psf_sys zips the samples of two
          independently fitted bins. The rho-tau cross covariance is ignored.
          [LINT] the draws use the global unseeded numpy generator
          (lsq-draws-unseeded).
          Values: cosmo_val.rho_tau_method = lsq; cosmo_val.quantile = 0.1587.
        default: lsq_independent_draws
        options:
          lsq_independent_draws:
            label: >-
              GLS on 10000 independent rho and tau draws; xi_psf_sys mean and
              15.87/84.13% quantiles
          mcmc:
            label: emcee (rho_tau_method emcee) with flat box priors at fixed rho
          joint_draws:
            label: Draw rho and tau jointly
            description: Not implemented.
      leakage_diagnostics:
        label: Scale-dependent and object-wise leakage coefficients
        rationale: >-
          The merged psf_systematics reports the scale-dependent leakage as
          alpha(theta) = tau_0+/rho_0+ from the rho/tau products
          (_get_alpha_leakage), so it inherits psf.rho_tau_estimator's centred,
          w_des-weighted galaxies and uncentred PSF field. Its error is the
          standard deviation of the ratio over 10000 seeded Gaussian draws of
          tau_0+ and rho_0+, which on the committed path
          (plot_objectwise_leakage with cov_type None) use the variances stored
          in the rho and tau tables. It is reduced to an inverse-variance
          weighted alpha_mean, alpha_1 at the smallest scale, and the intercept
          alpha_0 of an affine fit weighted by those per-point errors
          (_alpha_summaries). The object-wise regression fits e_gal = A e_PSF +
          c against the shear catalogue's e1_PSF/e2_PSF with a full 2x2 linear
          A (mix True, order lin) and errors 1/sqrt(w), and reports (a11 +
          a22)/2 (calculate_objectwise_leakage). The sp_validation sites record
          no rationale; mix True and order lin are the dependency's PSF_leakage
          defaults. Develop instead forms alpha(theta) = xi_gp+/xi_pp+ of
          uncentred galaxy and star-catalogue ellipticities with fast True, so
          the <e_g><e_p> and |<e_p>|^2 mean terms are not subtracted
          (calculate_scale_dependent_leakage; run_scale.do_alpha, whose
          docstring calls them small and time-consuming), and its affine fit
          gives every point the scalar scatter as its error; the merged file
          keeps that method, but nothing in the committed workflow calls it.
          With fast True a residual additive bias c changes develop's
          alpha(theta) by xi_cp+/xi_pp+, where xi_cp+ is the correlation of the
          constant galaxy field c with the star field; a 60,041-star sample of
          the v1.4.a star catalogue has mean ellipticity (0.011, 0.010).
          [HARDCODED]
        default: tau0_rho0_ratio_seeded_and_linear_mix
        options:
          tau0_rho0_ratio_seeded_and_linear_mix:
            label: >-
              alpha = tau_0+/rho_0+ with errors from seeded draws (develop:
              uncentred xi_gp+/xi_pp+ with mean terms dropped); 2x2 linear
              object-wise fit
          full_ratio:
            label: fast False, mean terms subtracted
            description: >-
              Applies to develop's xi_gp+/xi_pp+ route; the dependency's
              do_alpha default, which sp_validation does not select.
          diagonal_or_quadratic:
            label: Diagonal (mix False) or quadratic (order quad) object-wise model
            description: Dependency options not selected by sp_validation.

  # ═════════════════════════════════════════════════════════════════════════
  covariance:
    description: >-
      The analytic covariances and how they are assigned: the CosmoCov xi+-
      covariance (cosmology, terms per grid, footprint mask power), the
      NaMaster Gaussian pseudo-Cl covariance and its fiducial theory, and
      which covariance each statistic carries into the terminal file.
    inputs:
      - id: survey_numbers
        from: ../shear_field.survey_numbers
      - id: footprint_products
        from: ../footprint_products
      - id: source_nz
        from: ../source_nz
    outputs:
      - id: analytic_covariances
        type: data
        format: txt
        description: CosmoCov processed xi+- covariances per grid and the NaMaster COVAR_* FITS.
        inputs: [survey_numbers, footprint_products, source_nz]
        decisions:
          [cosmocov_cosmology, cosmocov_terms_per_grid, footprint_mask_power,
           pseudo_cl_gaussian_covariance, pseudo_cl_fiducial_theory,
           terminal_covariance]
    decisions:
      cosmocov_cosmology:
        label: Cosmology and intrinsic alignment at which the CosmoCov covariance is evaluated
        rationale: >-
          rule covariance_ini writes the Planck18 parameters that
          common.configure loads from the run directory's
          results/cosmology/planck18.json, committed for both papers and
          regenerated by rule cosmology_params from cs_util.cosmo.PLANCK18
          (Omega_m 0.30966, Omega_b 0.04897, h 0.6766, sigma_8 0.8102, n_s
          0.9665, Omega_v = 1 - Omega_m), with w0 = -1, wa = 0 and the NLA IA
          switch on with A_ia = eta_ia = 0, so the covariance carries no IA
          term. workflow/common.py names the source as astropy Planck18 (Table
          2 + BAO); no rationale is recorded for a zero IA amplitude. CosmoCov
          computes the Gaussian sample variance from the theory C_l and the
          non-Gaussian terms from the matter power spectrum at these
          parameters, so a different cosmology changes the xi+- covariance that
          the terminal file and inference_prep take.
          Values:
          w0 = -1;
          wa = 0;
          IA = 1;
          A_ia = 0.0;
          eta_ia = 0.0;
          COSMOLOGY_PARAMS = results/cosmology/planck18.json.
        default: planck18_no_ia
        options:
          planck18_no_ia:
            label: Planck18, w0 = -1, wa = 0, A_ia = 0
          best_fit_iterated:
            label: Re-evaluate at the best-fit cosmology
            description: Not implemented.
          ia_in_covariance:
            label: Non-zero IA amplitude in the covariance
            description: A template edit; A_ia and eta_ia are literals in covariance_ini.
      cosmocov_terms_per_grid:
        label: Non-Gaussian terms on the reporting grid, Gaussian only on the integration grid
        rationale: >-
          The gaussian wildcard sets ng = cng = 1 or 0 in the CosmoCov INI. In
          CosmoCov, ng switches on the non-Gaussian block, which always holds
          the super-sample term, and cng adds the connected trispectrum to it;
          the INI's ss : true selects the shear-shear block. cosmo_val.smk
          requests "ng" for the reporting-grid covariance that the terminal
          file carries (cv_xi_cov) and "g" for the integration-grid covariance
          behind pure E/B and COSEBIs (cv_xi_cov_integration), and
          fiducial_covariance_outputs makes the same ng/g split on the fiducial
          block's grids. The inference_prep rule's covariance_path call takes
          common.py's default, ng. cosmocov_process.py sums the Gaussian and
          non-Gaussian columns into the processed matrix and also writes the
          Gaussian part. The cv_xi_cov_integration docstring gives the reason
          for the split: B-modes only need the scatter a Gaussian field would
          give. Reporting xi+- errors include the non-Gaussian terms; the
          E-mode uncertainties of the B-mode statistics omit them.
          Values: gaussian = ng.
        default: ng_reporting_g_integration
        options:
          ng_reporting_g_integration:
            label: ng on the reporting grid, g on the integration grid
          gaussian_everywhere:
            label: Gaussian covariance on both grids
          ng_everywhere:
            label: Non-Gaussian terms on the 1000-bin integration grid too
            excluded: true
            excluded_reason: >-
              Cost: the tomography branch's papers/bmodes/config/covariance.md
              calls non-Gaussian contributions computationally prohibitive at
              1000 bins, and the B-mode null test needs only Gaussian-field
              scatter (cv_xi_cov_integration docstring).
      footprint_mask_power:
        label: Footprint mask power in the CosmoCov covariance
        rationale: >-
          With covariance.default_masked true in both paper configs,
          common.configure sets the _masked suffix and covariance_ini passes
          c_footprint_file = an nside-4096 footprint mask power spectrum: the
          star-halo footprint for SP_v1.4.8 and its _leak_corr and _ecut
          variants (base_version), the standard footprint for every other
          version, the fiducial included (covariance.smk MASK_CLS_FILES,
          STARHALO_CATALOGUES, get_mask_cls_path). The spectra are not in the
          repository; their names and scaling are those scripts/masking.py
          writes: a pixel is 1 when at least one comprehensive-catalogue object
          survives the cuts whose column is spatial (overlap, IMAFLAGS_ISO, the
          MASK_* bits, N_EPOCH, npoint3), binary with no fractional coverage;
          anafast to 3 nside - 1 scaled by A/Sum((2l+1) C_l/4pi) with A the
          kept area in steradians, which is 4pi up to the lmax truncation,
          written as *_norm.txt. CosmoCov (the build tools.cosmocov_executable
          names) reads the file in two places. The super-sample survey variance
          divides it by C_0, so the normalisation drops out there. The
          shape-noise boundary correction w_mask(theta) uses the absolute C_l,
          but CosmoCov sets it to 1 when the file stops below l = 2pi/tmin: the
          nside-4096 files stop at l = 12287, below 21600 for the 1-arcmin
          reporting grid and further below for the finer integration grids, so
          no boundary correction is applied. The footprint therefore enters
          only the super-sample term of the ng reporting covariance and leaves
          the Gaussian-only integration-grid covariance unchanged. masking.py's
          docstring says footprint-only mode defines a consistent footprint
          from the comprehensive catalogue; no rationale is recorded for
          occupancy over fractional coverage, for the 4pi scaling or for the
          SP_v1.4.8 split. One footprint file serves versions whose cov_th.A
          differs. [LINT] masking.py prefixes a fixed v1.4.5 directory to the
          absolute input_path of
          config/calibration/mask_from_compr_v1.X.6.yaml, so the committed
          builder cannot open the catalogue the committed config names, and
          masks.smk's spectra are raw anafast while the covariance takes the
          normalised convention.
          Values:
          cosmo_val/config/config.yaml#covariance.default_masked = True;
          bmodes/config/config.yaml#covariance.default_masked = True.
        default: occupancy_footprint_area_normalised
        options:
          occupancy_footprint_area_normalised:
            label: >-
              nside-4096 occupancy footprint, area-normalised C_l, star-halo
              footprint for the SP_v1.4.8 family
          area_only:
            label: >-
              No mask spectrum: circular f_sky window in the super-sample term
              (default_masked false)
          per_version_geometric_mask:
            label: Fractional-coverage mask spectrum per catalogue version
            description: Not implemented; the masks.smk path writes NEST data as RING and inflates partial pixels.
      pseudo_cl_gaussian_covariance:
        label: NaMaster Gaussian (iNKA) pseudo-Cl covariance and its noise model
        rationale: >-
          The covariance is nmt.gaussian_covariance of a spin-2 x spin-2
          workspace built from the nside weight-sum map, also when the data
          vector is catalogue based, with the fiducial EE spectrum plus a white
          noise term in EE and BB (zero in EB) as input: the analytic noise is
          pixel area times the mean per-pixel Sum w^2 (e1^2 + e2^2)/2,
          decoupled and unbinned; fiducial_input_inka coupled multiplies the
          four-spectrum input by the coupling matrix and divides by the mean
          product of the two weight maps, mean(mask^2) for the non-tomographic
          spectrum (the improved narrow-kernel approximation, iNKA). Below the
          first band the tomography branch's cosmo_val/pseudo_cl.py, which the
          merge adopts, sets the unbinned noise to zero and applies no pixel
          window to the fiducial spectrum; develop fills ell < lmin with the
          lowest band's value and multiplies by pixwin(nside)^2 for every
          cell_method. In the noise-only checks, the tomography branch's BB
          variance diagonals agree with a NaMaster iNKA reference built from
          flat white-noise input to about 1% on the v1.4.6.3 footprint at nside
          256 and within 3.7% in the nside-16 toy; develop's fill counts the
          noise the mask couples in from ell < 8 twice and gives a first-band
          BB variance 1.55 times the reference on that footprint. Only the
          Gaussian covariance reaches the SACC and the BB PTE; the
          OneCovariance Gaussian plus non-Gaussian hybrid
          (calculate_pseudo_cl_g_ng_cov) is called by no rule. The covariance
          sets every C_l error bar and the BB PTE. The pixelised workspace's
          coupling differs from the catalogue estimator's: the EE windows
          differ by 1.6% in a 5000-object nside-64 toy, and the production
          difference is not measured. [LINT] the producer's constructor takes
          noise_bias_method analytic, fiducial_input_inka coupled and cell_seed
          8192 from its defaults (cosmo_val/core.py on both branches); the
          papers/cosmo_val keys of those names hold the same values but reach
          only the cv_runner rules (#381), and generate_pseudo_cl_cov.py calls
          calculate_pseudo_cl_eb_cov, which fails against the locked cs_util on
          develop and which the tomography branch's class does not define
          (#374).
          Values: twopoint.smk#nside = 1024.
        default: inka_coupled_analytic_noise
        options:
          inka_coupled_analytic_noise:
            label: iNKA coupled input, analytic white noise, pixelised weight-map workspace
          decoupled_input:
            label: NKA with the full-sky input (fiducial_input_inka decoupled)
          randoms_noise:
            label: Noise spectra from random rotations (noise_bias_method randoms)
          onecovariance_hybrid:
            label: iNKA Gaussian plus OneCovariance non-Gaussian terms
            description: Implemented in calculate_pseudo_cl_g_ng_cov; no rule calls it.
      pseudo_cl_fiducial_theory:
        label: Fiducial theory C_l behind the Gaussian pseudo-Cl covariance
        rationale: >-
          A lensing-only C_l for the version's n(z) at the Planck18 parameters
          of results/cosmology/planck18.json, which the twopoint.smk rules pass
          and generate_pseudo_cl_cov.py remaps to Omega_m, Omega_b, h, sig8 and
          ns; the neutrino mass is 0.06 eV, the default of both
          cs_util.get_cosmo and CAMB. The tomography branch's
          pseudo_cl.get_fiducial_cl, which the merge adopts, calls
          cs_util.get_theo_c_ell with the CAMB backend, whose nonlinear power
          is CAMB's default HMCode-2020 without baryonic feedback (mead2020);
          develop calls CCL, whose nonlinear power is halofit. [LINT] the
          papers/cosmo_val cosmo_params block (mead2020_feedback,
          HMCode_log_T_AGN 7.8) reaches neither producer: the rule passes
          planck18.json and the script keeps five parameters. Were it routed,
          CCL would ignore the camb settings unless matter_power_spectrum were
          camb, the CAMB conversion would drop them, and CCL reads the
          temperature only under the key HMCode_logT_AGN (#381). The CAMB
          conversion also drops the neutrino mass, which matters only for a
          value other than 0.06 eV (cs_util#95). The theory sets the
          sample-variance term; for the synthetic n(z) in the backend test, the
          unwindowed C_l at ell 2000 exceeds the CAMB mead2020_feedback
          reference by 18% with develop's CCL backend and 14% with the
          tomography branch's CAMB backend.
          Values: COSMOLOGY_PARAMS = results/cosmology/planck18.json.
        default: planck18_lensing_only
        options:
          planck18_lensing_only:
            label: Planck18 lensing-only C_l, no intrinsic alignments
          with_intrinsic_alignments:
            label: Add NLA intrinsic alignments to the fiducial spectrum
            description: Not implemented.
          configured_nonlinear_model:
            label: HMCode-2020 with AGN feedback (mead2020_feedback), as the config intends
            description: Not reached by the producers.
      terminal_covariance:
        label: Which covariance each statistic carries into the terminal file
        rationale: >-
          assemble_sacc loads the parts in canonical order and gives the
          reporting xi+- part the CosmoCov covariance (--xi-cov) and the
          pseudo-Cl part the NaMaster COVAR_EE_EE, COVAR_BB_BB and COVAR_EB_EB
          blocks laid block-diagonally, replacing whatever estimate the part
          was born with; COSEBIs and pure E/B keep their propagated CosmoCov
          covariance, and the rho/tau part keeps a varrho diagonal for rho, the
          CovTauTh matrix on the tau-plus points when cov_tau_{base}_th.npy
          exists and a vartau diagonal otherwise, with zero rho-tau and
          tau+/tau- blocks (rho_tau_to_sacc). The blocks become one
          BlockDiagonalCovariance with zero cross-statistic blocks
          (assemble_analysis_sacc, sacc_io.assemble_covariance). The
          assemble_sacc.py docstring and comments give the reasons for the
          injection (the external block is the analysis covariance for those
          two statistics) and for dropping the pseudo-Cl cross-spectrum blocks
          (they match what the B-mode PTE reads); no rationale is recorded for
          the zero cross-statistic blocks. A joint chi2 from this file ignores
          cross-statistic covariance and the cross-polarisation covariance
          between pseudo-Cl EE, BB and EB, while retaining the supplied
          within-part covariance for COSEBIs and pure E/B; no code in the
          repository computes such a joint chi2 from the terminal file. The
          part writers (cosmo_val/sacc_writers.py and
          PSFSystematicsMixin.rho_tau_to_sacc_part) exist only on develop; the
          tomography branch's cosmo_val defines neither. [LINT] the tau
          covariance kind is chosen by a file's existence rather than
          cov_estimate_method, and nothing in the SACC records which one was
          used (#374).
          Values: xi_reporting = xi_cov; pseudo_cl = pseudo_cl_cov.
        default: analytic_injected_block_diagonal
        options:
          analytic_injected_block_diagonal:
            label: >-
              CosmoCov ng for xi, NaMaster auto blocks for C_l, each other
              part's own block; no cross-statistic terms
          keep_measured:
            label: Keep the covariance each part was born with (the xi jackknife or shot estimate)
            description: Not reachable; assembly always injects the external blocks.
          joint_mock_covariance:
            label: Joint covariance across statistics from GLASS mocks
            description: The covariance_glass_mock rule exists but nothing consumes its output.

  # ═════════════════════════════════════════════════════════════════════════
  data_products:
    description: >-
      What the terminal {version}.sacc carries and how its points are
      labelled: the statistics assembled, the single n(z) tracer, the theta
      and ell labels and the bandpower window.
    inputs:
      - id: xi_parts
        from: ../real_space.xi_parts
      - id: pseudo_cl_part
        from: ../harmonic.pseudo_cl_part
      - id: rho_tau_part
        from: ../psf.rho_tau_part
    outputs:
      - id: analysis_sacc
        type: data
        format: fits
        description: The assembled {version}.sacc.
        inputs: [xi_parts, pseudo_cl_part, rho_tau_part]
        decisions: [terminal_vector_contents, point_labels_and_windows]
    decisions:
      terminal_vector_contents:
        label: Statistics and tracer carried in the terminal file
        rationale: >-
          cv_assemble_inputs gathers the reporting xi+- part, the pseudo-Cl
          EE/BB/EB part when include_pseudo_cl is true, the COSEBIs part at the
          fiducial cut, the six pure-E/B series and rho_0..5 with tau_0/2/5;
          the integration-grid xi+- stays a per-part intermediate
          (cosmo_val.smk; assemble_sacc.CANONICAL). The xi+-, pseudo-Cl and
          rho/tau parts attach the version's shear.redshift_path, loaded
          verbatim without renormalisation, as the single NZ tracer source_0
          (CosmologyValidation.sacc_nz), and the COSEBIs and pure-E/B parts
          copy it from their xi+- part; every part also carries the Misc tracer
          psf_stars. The shear statistics use the source pair (0, 0)
          (sacc_writers.BIN), tau uses (source_0, psf_stars) and rho
          (psf_stars, psf_stars). This describes develop's SACC layer, which
          the record assumes the merge keeps: the tomography branch's cosmo_val
          modules have no sacc_nz and write no SACC part. sacc_io's writers
          take a bin pair and new_sacc builds one source_i tracer per n(z) it
          is given, but the committed analysis producers supply one source
          tracer and use the source pair (0, 0). No rationale is recorded at
          the sites. No committed rule reads {version}.sacc (the CosmoSIS
          pipelines read FITS); the file fixes the rows and the n(z) available
          to a SACC-reading likelihood, which is not implemented
          (CosmoStat/sp_validation PR #255). [LINT] assemble_analysis_sacc
          takes tracers and metadata from the first part without comparing the
          others (#381).
        default: reporting_plus_derived_single_bin
        options:
          reporting_plus_derived_single_bin:
            label: Reporting xi+-, C_l, COSEBIs, pure E/B, rho/tau; one source_0 tracer
          include_integration_xi:
            label: Also carry the integration-grid xi+- and its covariance
            description: Not wired in cv_assemble_inputs.
          tomographic:
            label: Per-bin tracers and all auto/cross pairs
            description: >-
              Not implemented: the writers hardcode BIN = (0, 0) and sacc_nz
              supplies one n(z).
      point_labels_and_windows:
        label: Theta and ell labels, and the window stored with the pseudo-Cl
        rationale: >-
          xi+- points are tagged theta = TreeCorr meanr, the pair-weighted mean
          separation of each bin (rnom for a bin with no pairs), with rnom kept
          as theta_nom (run_2pcf.py, sacc_io.add_xi). Pseudo-Cl points are
          tagged ell = ell_eff (NmtBin.get_effective_ells) and share one
          BandpowerWindow, NaMaster's EE<-EE decoupled window, which equals the
          BB<-BB and EB<-EB diagonals; the cross-polarisation blocks are
          dropped (pseudo_cl.bandpower_window_from_workspace,
          sacc_writers.pseudo_cl_to_sacc, sacc_io.add_pseudo_cl). The stored
          spectra are NaMaster's EE, BB and EB rows; for the single-field
          auto-spectrum the EB row equals the BE row. The window includes no
          HEALPix pixel window, which suits the catalogue field but not the map
          alternative's pixel-averaged bandpowers (CosmoStat/sp_validation PR
          #366 adds pw^2 for the map path). This describes develop's SACC
          layer, which the record assumes the merge keeps: the tomography
          branch's pseudo_cl.py has no bandpower_window_from_workspace and its
          mixin writes ELL, EE, EB, BE and BB to a FITS table with no window.
          No rationale for meanr is recorded at the sites; SACC's window model
          holds one window per bandpower. COSEBIs normalise their filters on,
          and integrate over, the integration part's meanr (cv_cosebis.py,
          b_modes.cosebis_scan_from_xi), so the theta label enters the COSEBIs
          B-mode PTEs; a theory sampled at meanr can differ from one sampled at
          rnom or averaged over the bin when xi is curved across the bin. A
          theory with E-mode power only predicts the EE bandpowers exactly
          through the stored window, but predicts zero BB where NaMaster leaves
          W(BB<-EE) C_EE; an audit emulation of the production geometry put
          that at 5.8% of C_EE in the first band (0.17 sigma) and a chi-square
          of 0.03 over the 32 bands (#381).
        default: meanr_shared_ee_window
        options:
          meanr_shared_ee_window:
            label: theta = meanr with theta_nom tag; one EE<-EE window shared by EE/BB/EB; EB = NaMaster row 1
          nominal_centres:
            label: theta = rnom
            description: Not implemented; rnom is stored only as the theta_nom tag.
          full_polarisation_windows:
            label: Full four-index response
            excluded: true
            excluded_reason: Not representable as one SACC BandpowerWindow per bandpower.

  # ═════════════════════════════════════════════════════════════════════════
  inference:
    description: >-
      The CosmoSIS cosmological inference: the data vector and scale cuts, the
      theory sampling, the likelihood covariance, the nuisance models and
      priors, the parameter space, the nonlinear model, the sampler and the
      posterior summary. The committed configuration is the templates under
      cosmo_inference/cosmosis_config/templates/ as inference_prep (which runs
      cosmosis_fitting.py with --use-rho-tau) selects them; the subsystem
      prepares the FITS and INI and does not itself run CosmoSIS. The
      templates are working defaults that evolve after an analysis; each
      published chain embeds the priors it ran with (Paper III:
      SP_v1.4.6.3_B_fiducial_config).
    inputs:
      - id: xi_parts
        from: ../real_space.xi_parts
      - id: rho_tau_part
        from: ../psf.rho_tau_part
      - id: analytic_covariances
        from: ../covariance.analytic_covariances
      - id: source_nz
        from: ../source_nz
    outputs:
      - id: cosmosis_inputs
        type: data
        format: fits
        description: cosmosis_{version}_*.fits and cosmosis_pipeline_*.ini.
        inputs: [xi_parts, rho_tau_part, analytic_covariances, source_nz]
        decisions:
          [likelihood_data_vector, theory_sampling, likelihood_covariance,
           psf_leakage_model, shear_calibration_prior, photoz_shift,
           intrinsic_alignment_model, cosmological_parameter_space,
           nonlinear_power_and_baryons, sampler, posterior_summary]
    decisions:
      likelihood_data_vector:
        label: Statistics and scale cuts the likelihood fits
        rationale: >-
          inference_prep always passes --use-rho-tau, so the real-space
          likelihood is 2pt_like_xi_sys over XI_PLUS, XI_MINUS, TAU_0_PLUS and
          TAU_2_PLUS with add_xi_sys, built from the legacy 2pt FITS the script
          writes (not {version}.sacc), with xi+ and xi- both cut to 12-83
          arcmin and tau uncut, all 20 bins; the harmonic template fits CELL_EE
          alone over 300-1600. tau_5 is measured but not fitted, and the xi_sys
          and tau models carry no eta term (Paper III fixes eta = 0). In Paper
          III the 83 arcmin upper cut keeps xi_sys below 10% of the signal, 12
          arcmin is the smallest xi- lower cut with a passing xi-^B PTE (Paper
          II), and the xi+ lower cut sits at 12 arcmin, where S8 stops drifting
          as the cut rises; Paper IV's 300-1600 range drops the scales where
          the B-mode PTEs show a potential signal. [HARDCODED] the data sets
          live in cosmosis_fitting.py. The no-PSF template cuts xi+ to 10-200
          and xi- to 20-200 arcmin.
          Values:
          cosmosis_pipeline_A_psf.ini#2pt_like.angle_range_XI_PLUS_1_1 = 12.0 83.0;
          cosmosis_pipeline_A_psf.ini#2pt_like.angle_range_XI_MINUS_1_1 = 12.0 83.0;
          cosmosis_pipeline_A_ia_cell.ini#2pt_like.angle_range_CELL_EE_1_1 = 300.0 1600.0.
        default: xi_12_83_with_tau_02
        options:
          xi_12_83_with_tau_02:
            label: xi+- at 12-83 arcmin plus tau_0+ and tau_2+ with xi_sys; harmonic CELL_EE at 300-1600
          xi_only:
            label: xi+- without the PSF model (cosmosis_pipeline_A_ia.ini, without --use-rho-tau)
          xip_from_5_arcmin:
            label: xi+ from 5 arcmin
            description: A template edit (the Paper III small_scales run).
          sacc_likelihood:
            label: Read {version}.sacc with a SACC likelihood
            description: Not implemented (CosmoStat/sp_validation PR #255).
      theory_sampling:
        label: Theory point-sampled at the data angles; rho/tau relabelled onto the xi grid
        rationale: >-
          cosmosis_fitting.py writes WINDOWS = SAMPLE on the two-point HDUs it
          builds and copies the data-mode XI_PLUS and XI_MINUS HDUs unchanged;
          sacc_io._twopoint_hdu writes it on the XI_PLUS, XI_MINUS, CELL_EE,
          TAU_0_PLUS and TAU_2_PLUS tables in sacc_to_twopoint_fits, which no
          committed workflow rule calls. 2pt_like interpolates xi at the stored
          ANG and C_l at the stored NaMaster ell_eff because these theory
          sections are not flagged bin-averaged (spec_tools bin_avg defaults to
          False), while tau uses exact-angle lookup; neither xi nor C_l is
          bin-averaged in the likelihood, and sacc_io._build_cell drops the
          SACC bandpower windows. cosmosis_fitting.py overwrites the rho and
          tau theta with the xi ANG without interpolation, printing a warning
          when they differ by more than 5% and continuing;
          sacc_io._build_rho_tau does the same without the check. The converter
          docstrings give consistency with xi as the reason, and the xi_sys
          lookup, a searchsorted on angle, relies on the shared grid. No
          rationale is recorded for point sampling. For a normalised window
          centred on ell_eff and a spectrum varying on the scale ell_eff, the
          leading relative point-sampling error is of order (Delta
          ell/ell_eff)^2. [LINT] 2pt_like_xi_sys adds the next bin's xi_sys
          when a data angle exceeds the xi_sys angle by one ulp, because the
          two arcmin-to-radian conversions differ (#391).
          Values:
          cosmosis_fitting.py#WINDOWS = SAMPLE;
          sacc_io.py#WINDOWS = SAMPLE;
          threshold = 5.0.
        default: sample_at_data_angles
        options:
          sample_at_data_angles:
            label: WINDOWS = SAMPLE; rho/tau theta set to the xi meanr
          bandpower_windows:
            label: Convolve the C_l theory with the NaMaster windows
            description: >-
              Not implemented: neither converter writes the windows into the
              2pt FITS.
          own_theta:
            label: Keep rho and tau at their own meanr
            description: >-
              tau_to_fits and rho_to_fits keep their own theta when called
              without one, but cosmosis_fitting.py always passes the xi theta
              and has no option to select this.
      likelihood_covariance:
        label: Fixed Gaussian likelihood with a block-diagonal xi, tau, C_l covariance
        rationale: >-
          2pt_like reads COVMAT with gaussian_covariance F and sets neither
          covariance_realizations nor sellentin, so the likelihood is Gaussian
          in a fixed covariance with no Hartlap or Sellentin-Heavens
          correction; those corrections address noise in covariances estimated
          from simulations, and every input here is computed (CosmoCov,
          CovTauTh, the pseudo-C_l covariance). covdat_to_fits stacks the
          processed CosmoCov xi covariance (the ng product, Gaussian plus
          non-Gaussian terms, masked), the leading 2n x 2n block (tau_0+,
          tau_2+) of the 3n x 3n CovTauTh covariance, and the COVAR_FULL HDU of
          the pseudo-C_l covariance file as the CELL_EE block, with zero cross
          blocks. The C_l block enters only the harmonic likelihood, which fits
          CELL_EE alone, so the zero xi-tau block is the only cross block a fit
          uses. No xi-tau covariance is computed and its size is not measured;
          a nonzero block would change the real-space likelihood through the
          alpha and beta that the tau and xi_sys terms share.
          Values:
          cosmosis_pipeline_A_psf.ini#2pt_like.gaussian_covariance = False;
          cosmosis_pipeline_A_psf.ini#2pt_like.covmat_name = COVMAT.
        default: fixed_gaussian_block_diagonal
        options:
          fixed_gaussian_block_diagonal:
            label: Fixed COVMAT, zero xi-tau and xi-C_l blocks
          joint_xi_tau:
            label: Joint xi-tau covariance
            description: Not implemented.
          sellentin_heavens:
            label: Multivariate-t likelihood for a simulated covariance
            description: A CosmoSIS option not selected; the covariances are analytic.
      psf_leakage_model:
        label: PSF leakage term in the likelihood and its priors
        rationale: >-
          add_xi_sys and tau_from_rho (shear/xi_sys in the UNIONS-WL CosmoSIS
          Standard Library fork) model xi_sys = alpha^2 rho_0 + beta^2 rho_1 +
          2 alpha beta rho_2 and tau_0 = alpha rho_0 + beta rho_2, tau_2 =
          alpha rho_2 + beta rho_1, with two scalar coefficients and one
          redshift bin. priors_psf.ini sets alpha ~ N(0.0051, 0.022) and beta ~
          N(0.8098, 0.1148), sampled within [-0.1, 0.1] and [-2, 2]
          (values_psf.ini). Paper III derives its Gaussian leakage priors from
          a separate fit of alpha and beta to rho and tau, because
          unconstrained leakage parameters can absorb cosmological signal
          through their degeneracies. In priors_psf.ini they are literals that
          no committed code derives from the rho/tau fit of the catalogue
          version [HARDCODED].
          Values:
          priors_psf.ini#psf_leakage_parameters.alpha = gaussian 0.0051 0.022;
          priors_psf.ini#psf_leakage_parameters.beta = gaussian 0.8098 0.1148;
          values_psf.ini#psf_leakage_parameters.alpha = -0.1 0.0 0.1;
          values_psf.ini#psf_leakage_parameters.beta = -2.0 0.0 2.0.
        default: gaussian_alpha_beta
        options:
          gaussian_alpha_beta:
            label: Gaussian priors on alpha and beta (priors_psf.ini)
          flat_alpha_beta:
            label: Flat priors within the sampling bounds
            description: A prior-file edit; Paper III runs it for comparison.
          no_xi_sys:
            label: No PSF term
            description: The no-PSF template, selected without --use-rho-tau.
      shear_calibration_prior:
        label: One multiplicative bias m1 with a Gaussian prior, applied to xi+- (and C_l)
        rationale: >-
          shear_m_bias with m_per_bin multiplies each auto-correlation bin by
          (1 + m_i)(1 + m_j); with one source bin a single m1 scales
          shear_xi_plus and shear_xi_minus (shear_cl in the harmonic template)
          by (1 + m1)^2, with m1 sampled in [-0.1, 0.1]. priors.ini sets m1 ~
          N(-0.057, 0.014): the image-simulation m = -0.057 +/- 0.0047 (Paper
          V) with its uncertainty tripled because the simulated images might
          not capture these effects exactly (Paper III). priors_psf.ini sets m1
          ~ N(-0.0057, 0.014), and generate_cosmosis_config references it in
          each requested real-space or harmonic configuration when
          --use-rho-tau is set without --mock. m1 rescales the theory
          amplitude, so changing its prior can affect inferred S8; (1 + m1)^2
          is 11% larger at m1 = -0.0057 than at m1 = -0.057. [LINT] the two
          committed templates differ by exactly a factor of ten in the m1 mean,
          with the same width, which looks like a dropped digit in
          priors_psf.ini (#391).
          Values:
          priors_psf.ini#shear_calibration_parameters.m1 = gaussian -0.0057 0.014;
          priors.ini#shear_calibration_parameters.m1 = gaussian -0.057 0.014;
          values_psf.ini#shear_calibration_parameters.m1 = -0.1 0.0 0.1;
          cosmosis_pipeline_A_psf.ini#shear_m_bias.m_per_bin = True;
          cosmosis_pipeline_A_psf.ini#shear_m_bias.cl_section = shear_xi_plus shear_xi_minus.
        default: gaussian_m1
        options:
          gaussian_m1:
            label: m1 ~ N(mean, 0.014), one bin
          fixed_zero:
            label: m1 fixed to 0
            description: A values-file edit.
      photoz_shift:
        label: Single additive shift of the n(z) with a Gaussian prior
        rationale: >-
          photoz_bias in additive mode shifts the one-bin n(z) to n(z - bias_1)
          with cubic interpolation and renormalises; bias_1 is sampled in
          [-0.1, 0.1] with the prior N(-0.030, 0.018) in priors_psf.ini and
          priors.ini. In Paper III the prior mean is the bias found by running
          the SOM calibration on MICE2 mocks, and the width is the bootstrap
          scatter over the spectroscopic calibration sample plus systematic
          terms. A larger bias_1 raises the mean source redshift and the
          lensing efficiency, which a lower S8 compensates (Paper III).
          Values:
          priors_psf.ini#nofz_shifts.bias_1 = gaussian -0.030 0.018;
          values_psf.ini#nofz_shifts.bias_1 = -0.1 0.0 0.1;
          cosmosis_pipeline_A_psf.ini#photoz_bias.mode = additive;
          cosmosis_pipeline_A_psf.ini#photoz_bias.interpolation = cubic.
        default: additive_gaussian
        options:
          additive_gaussian:
            label: n(z - bias_1), bias_1 ~ N(-0.030, 0.018)
          additive_flat:
            label: n(z - bias_1), bias_1 flat in [-0.1, 0.1]
            description: >-
              A template edit (drop the nofz_shifts prior) that the committed
              configs do not select. Paper III's flat-prior run (its
              published flat_delta_z.ini uses priors/no_delta_z.ini) triples
              the Delta-z error bars.
          multiplicative:
            label: z (1 - bias_1) stretch
            description: Available in photoz_bias; not selected.
          fixed_zero:
            label: bias_1 fixed to 0
            description: A values-file edit (robustness run).
      intrinsic_alignment_model:
        label: NLA intrinsic alignments with one amplitude and an informative prior
        rationale: >-
          la_model with method bk_corrected builds the GI, IG and II terms
          added by add_intrinsic; the amplitude A is sampled in [-5, 5] with
          the prior N(0.83, 0.7). One redshift bin constrains A poorly, so
          Paper III sets the prior from direct red- and blue-galaxy
          measurements weighted by the sample's red and blue fractions, 0.83
          +/- 0.39, with the width doubled to 0.78. A is degenerate with S8
          through the GI term: in Paper III fixing A = 0 shifts S8 by -0.71
          sigma and a flat prior nearly doubles the S8 uncertainty. The
          ia and cell templates load linear_alignments_interface_znla.py and
          the PSF template the plain interface; under bk_corrected both run
          bridle_king_corrected.
          Values:
          cosmosis_pipeline_A_psf.ini#linear_alignment.method = bk_corrected;
          priors_psf.ini#intrinsic_alignment_parameters.A = gaussian 0.83 0.7;
          values_psf.ini#intrinsic_alignment_parameters.A = -5.0 0 5.0.
        default: nla_gaussian_prior
        options:
          nla_gaussian_prior:
            label: NLA (bk_corrected), A ~ N(0.83, 0.7)
          nla_flat_prior:
            label: Flat A in [-5, 5]
            description: A prior-file edit (robustness run).
          no_ia:
            label: No intrinsic alignments (A = 0)
            description: >-
              A template edit (A fixed to 0, as the published values/no_ia.ini
              sets) that the committed configs do not select. Paper III's
              largest S8 shift, -0.71 sigma.
          nla_with_redshift_evolution:
            label: NLA with a redshift power-law (znla interface)
            description: >-
              Method znla in linear_alignments_interface_znla.py, the ia and
              cell templates' interface; it also reads an eta parameter that no
              committed values file sets.
          tatt:
            label: TATT
            description: Not implemented.
      cosmological_parameter_space:
        label: Flat LCDM sampled in omch2, h0, ombh2, n_s and S8
        rationale: >-
          values_psf.ini samples omch2 in [0.051, 0.255], h0 in [0.64, 0.82],
          ombh2 in [0.019, 0.026], n_s in [0.84, 1.1] and S_8_input in [0.1,
          1.3], which sample_S8 converts to sigma_8 = S8 / (Omega_m / 0.3)^0.5,
          with tau 0.0544, w -1, wa 0, omega_k 0 and mnu 0.06 eV fixed;
          priors_psf.ini adds the Gaussian N(0.0244, 0.00038) on ombh2. Paper
          III takes the ranges from Table 2 of the DES Y3 + KiDS-1000 analysis
          and adds a BBN prior on ombh2. The S8 prior is flat by construction,
          while Omega_m inherits the joint priors on omch2, ombh2 and h0,
          including the Gaussian ombh2 prior and the fixed neutrino
          contribution; sampling ln(10^10 A_s) with a flat prior instead
          induces a non-flat S8 prior.
          Values:
          values_psf.ini#cosmological_parameters.omch2 = 0.051 0.12249999999999998 0.255;
          values_psf.ini#cosmological_parameters.h0 = 0.64 0.70 0.82;
          values_psf.ini#cosmological_parameters.ombh2 = 0.019 0.024499999999999997 0.026;
          values_psf.ini#cosmological_parameters.n_s = 0.84 0.96 1.1;
          values_psf.ini#cosmological_parameters.S_8_input = 0.1 0.79563645 1.3;
          values_psf.ini#cosmological_parameters.tau = 0.0544;
          values_psf.ini#cosmological_parameters.w = -1.0;
          values_psf.ini#cosmological_parameters.mnu = 0.06;
          values_psf.ini#cosmological_parameters.omega_k = 0.0;
          values_psf.ini#cosmological_parameters.wa = 0.0;
          priors_psf.ini#cosmological_parameters.ombh2 = gaussian 0.0244 0.00038.
        default: s8_flat_lcdm
        options:
          s8_flat_lcdm:
            label: Flat LCDM in S8, with mnu, w and wa fixed
          sample_as:
            label: Sample ln(10^10 A_s) instead of S8
            description: Not implemented in the templates.
          free_neutrino_mass:
            label: Vary mnu
            description: A values-file edit.
      nonlinear_power_and_baryons:
        label: CAMB with HMCode2020 feedback, logT_AGN sampled
        rationale: >-
          The camb section sets power mode with halofit_version
          mead2020_feedback, kmax 20 extrapolated to 500, nk 200 and zmax 5,
          and values_psf.ini samples logT_AGN in [7.3, 8.0]. Paper III uses
          HMCode2020, quotes accuracy of up to 2.5% for k <= 10 h/Mpc against
          N-body simulations, and marginalises over AGN feedback, whose
          hydrodynamical calibrations give logT_AGN around 7.6-8.0. For its
          Planck 2018 fiducial cosmology and adopted n(z), Paper III estimates
          that at 12 arcmin wavenumbers above 0.43 h/Mpc contribute no more
          than 10% of xi+ and those above 2.85 h/Mpc no more than 10% of xi-,
          and finds no appreciable change in the best-fit S8, sigma8 or Omega_m
          with HMCode2020 without feedback or with Takahashi halofit. The
          fiducial C_l behind the pseudo-C_l covariance does not use this model
          (covariance.pseudo_cl_fiducial_theory).
          Values:
          cosmosis_pipeline_A_psf.ini#camb.halofit_version = mead2020_feedback;
          cosmosis_pipeline_A_psf.ini#camb.kmax = 20.0;
          cosmosis_pipeline_A_psf.ini#camb.kmax_extrapolate = 500.0;
          cosmosis_pipeline_A_psf.ini#camb.nk = 200;
          cosmosis_pipeline_A_psf.ini#camb.zmax = 5.0;
          values_psf.ini#halo_model_parameters.logT_AGN = 7.3 7.4755796676459387 8.0.
        default: hmcode2020_feedback
        options:
          hmcode2020_feedback:
            label: HMCode2020 with AGN feedback, logT_AGN free
          hmcode_no_feedback:
            label: HMCode without feedback
            description: halofit_version mead2020, a template edit (the Paper III no_baryons run).
          takahashi_halofit:
            label: Takahashi halofit
            description: halofit_version takahashi, a template edit (the Paper III Halofit run).
      sampler:
        label: PolyChord with 192 live points
        rationale: >-
          runtime.sampler is polychord with live_points 192 and resume T in the
          real-space and harmonic templates (cosmosis_pipeline_A_psf.ini,
          cosmosis_pipeline_A_ia_cell.ini); tolerance (0.1), num_repeats (0,
          which the sampler expands to three times the slow-parameter count)
          and random_seed (-1) stay at the CosmoSIS sampler defaults. PolyChord
          follows other Stage III analyses and gives reliable posteriors at
          reasonable cost (Paper III). Sampling noise enters S8 and the
          evidence; with no fixed seed, fresh runs are not bit-reproducible,
          and resume T enables reading the saved state for
          polychord_outfile_root under base_dir.
          Values:
          cosmosis_pipeline_A_psf.ini#runtime.sampler = polychord;
          cosmosis_pipeline_A_psf.ini#polychord.live_points = 192;
          cosmosis_pipeline_A_psf.ini#polychord.resume = True.
        default: polychord_192
        options:
          polychord_192:
            label: PolyChord, 192 live points, no fixed seed
          nautilus:
            label: Nautilus
            description: A template edit; Paper III runs it as a consistency check.
      posterior_summary:
        label: Point estimate and intervals reported from the chains
        rationale: >-
          write_samples_getdist_format converts the CosmoSIS chain, and
          load_chain reads it with GetDist with ignore_rows 0 (no burn-in
          removed) and a KDE smoothing scale that defaults to 0.3;
          papers/realspace/S8_om_sigma8_whisker.py, which builds the S8, sigma8
          and Omega_m summary, passes 0.5. extract_best_fit_params returns the
          weighted posterior mean by default; with 2Dkde, which the whisker
          script requests, it returns the mode of the joint (S_8, OMEGA_M) KDE
          on a 1000-bin grid for those two parameters and the 1D KDE mode for
          the others. Paper III reports the 2D mode for S8 and Omega_m to limit
          the projection effects of 1D marginalisation, and 1D modes otherwise.
          The intervals are GetDist's 68% marginal limits: equal-tail quantiles
          when the normalised KDE density at the two quantiles differs by less
          than 0.05 (credible_interval_threshold), otherwise the KDE's
          equal-density limits; the whisker script turns them into offsets from
          the mode. get_sigma_tension returns |x1 - x2| / sqrt(sigma1^2 +
          sigma2^2) with the sign of x1 - x2, each sigma the mean of the two
          offsets; the whisker script passes the 2D modes. The reported
          KDE-mode S8 depends on the smoothing, and the mode can differ from
          the posterior mean. [LINT] write_samples_getdist_format writes +log
          posterior into GetDist's -log-likelihood column for PolyChord chains,
          so likelihood-ordered GetDist outputs pick the worst sample; weights,
          means, KDE modes and limits are unaffected (#391). [LINT]
          derive_parameter_Om has no production caller; it divides omch2 by
          (h0/100)^2 although h0 is the reduced h, and omits ombh2 (#391). The
          smoothing_scale and best_fit_method pins hold the
          chain_postprocessing defaults; the reported values (0.5 and 2Dkde)
          are set in the whisker script.
          Values:
          smoothing_scale = 0.3;
          num_bins = 1000;
          best_fit_method = weighted_mean.
        default: kde_mode_2d
        options:
          kde_mode_2d:
            label: Joint 2D KDE mode for (S8, Omega_m), 1D modes otherwise, 68% GetDist limits
          weighted_mean:
            label: Posterior mean (the function default)
          parameter_shift_tension:
            label: Full parameter-difference tension
            description: Not implemented.

  # ═════════════════════════════════════════════════════════════════════════
  mocks:
    description: >-
      The GLASS lognormal mocks and what is tested on them: the mock
      cosmology, geometry and source population (sp_validation.glass_mock and
      scripts/glass_mock, the tomography branch's versions after the merge),
      the two-point measurements on mocks, the COSEBIs B-mode bias test, and
      the mock inference. The consumed mocks are the v1.4.6 nside-4096 set.
    inputs:
      - id: source_nz
        from: ../source_nz
      - id: glass_mocks
        from: ../glass_mocks
    outputs:
      - id: mock_tests
        type: report
        format: json
        description: The COSEBIs bias-test evidence and the mock CosmoSIS inputs.
        inputs: [source_nz, glass_mocks]
        decisions:
          [mock_cosmology_and_power, mock_geometry, mock_source_population,
           mock_two_point_measurements, cosebis_bias_test, mock_inference]
    decisions:
      mock_cosmology_and_power:
        label: Mock cosmology and nonlinear power
        rationale: >-
          GlassMockConfig sets CAMB from h 0.6766, Omega_m 0.30966, Omega_b
          0.04897, n_s 0.9665 and mnu 0.06 eV, with the neutrino density taken
          from CDM so the total matter density is fixed, and rescales A_s from
          2.1e-9 so that sigma8(z=0) is 0.8102; the nonlinear power is HMCode
          mead2020_feedback with logT_AGN 7.8 to kmax 20 (build_camb_params).
          The densities, n_s, sigma8 and mnu are astropy's Planck18 values
          (Planck 2018 TT,TE,EE+lowE+lensing+BAO), and the docstring says these
          defaults reproduce the fiducial UNIONS v1.4.6.3 mock; no rationale is
          recorded for the feedback level or kmax. On the tomography branch
          GlassMockConfig.from_yaml accepts each numeric field from YAML
          (config_glass_mock.yaml lists them commented out); develop's CLI
          exposes none. sigma8 controls the amplitude of newly computed shell
          spectra and their contribution to the mock signal and cosmic
          variance; at unchanged nside and limber, a rerun reuses cached
          spectra even when the cosmology changes, while shell construction and
          lensing accumulation still use the requested cosmology (see
          mock_geometry). [HARDCODED] the mead2020_feedback model on both
          branches, and every cosmology field on develop.
        default: planck18_sigma8_0p8102_hmcode
        options:
          planck18_sigma8_0p8102_hmcode:
            label: Planck18 densities, sigma8 0.8102, HMCode2020 feedback logT_AGN 7.8
          best_fit_cosmology:
            label: The UNIONS best-fit cosmology
            description: A YAML edit on the tomography branch.
          dark_matter_only:
            label: HMCode without feedback
            description: Not exposed.
      mock_geometry:
        label: Shells, resolution, band limit and lognormal fields
        rationale: >-
          Matter shells are glass.linear_windows on a comoving grid of
          thickness dx 200 Mpc (the example YAML uses 120) from z = 0 to zmax
          3, the n(z) truncated at zmax; the shell spectra are computed to lmax
          = nside (4096 for the consumed mocks), lognormal fields with ncorr 3
          shell correlations are generated, and each galaxy takes the shear of
          its pixel. The tomography branch's make_glass_sim.py, which the merge
          adopts, passes the spectra through glass.discretized_cls (truncation
          to lmax and ncorr 3, and the HEALPix pixel window) and exposes limber
          (default False; the example YAML sets True); develop feeds the raw
          spectra and uses exact (non-Limber) shell spectra. On a mask-cache
          miss the footprint comes from the mask file the run names, resampled
          when its nside differs and then kept where coverage is at least 0.75;
          otherwise the cached mask supplies the footprint, and #319 identifies
          the v1.4.6.3_v2 input as create_mask.py's occupied-pixel catalogue
          mask at nside 4096. No rationale is recorded for these values. The
          input spectra stop at ell 4096, about 2.6 arcmin, a scale larger than
          the 1 arcmin the COSEBIs bias test integrates from, and galaxies
          sample a shear that is constant over each nside-4096 pixel (0.86
          arcmin on a side by area). [LINT] the cls cache is keyed on nside and
          limber (develop's on nside alone) and the downgraded-mask cache on
          nside alone, neither on the cosmology or the input mask (#381).
        default: linear_shells_lmax_nside_lognormal
        options:
          linear_shells_lmax_nside_lognormal:
            label: >-
              dx 200 Mpc linear windows to z 3, lmax = nside, lognormal ncorr
              3, mask kept at coverage 0.75 when resampled
          higher_band_limit:
            label: lmax = 2-3 nside
            description: Not exposed; lmax is tied to nside.
          gaussian_fields:
            label: Gaussian instead of lognormal fields
            description: Not implemented.
      mock_source_population:
        label: Source density, clustering, shapes and tomographic labels
        rationale: >-
          At the generator defaults, the n(z) is normalised to n_arcmin2 6.0905
          and partitioned over shells with glass.partition; positions are drawn
          with linear bias 1.2 inside the mask; every object has weight 1;
          intrinsic ellipticities are glass.ellipticity_intnorm with sigma_e
          0.2684 per component; glass.galaxy_shear uses its default reduced
          shear g = gamma/(1 - kappa) to form the lensed ellipticity e_obs =
          (e_int + g)/(1 + conjugate(g) e_int), and e2 is stored as -Im(e_obs)
          (spin2_sign_convention); intrinsic alignments are off by default
          (ia_bias None). The tomography branch's make_glass_sim.py, which the
          merge adopts, normalises each n(z) column to its own n_arcmin2,
          samples it separately and labels it b + 1; develop digitises PHOTO_Z
          drawn from a Gaussian with mean z and standard deviation 0.03 (1 +
          z), truncated below zero, into equal-density bins (nbins 1), and both
          branches store photo-z draws from that truncated distribution. 6.0905
          is the catalogue n_eff from the 2405 deg2 era; on the 2894 deg2
          footprint the catalogue's n_eff is 4.957, and the v1.4.6.3_v2 mocks,
          generated at the 6.0905 default, carry 17% more galaxies than the
          catalogue (#319). No rationale is recorded for the bias 1.2. The
          density and sigma_e set the mock shape noise, which enters every mock
          covariance and PTE distribution. Reduced shear is nonlinear in the
          lensing field and can carry a small B-mode (Krause & Hirata 2010)
          that the zero-mean COSEBIs bias test does not model; its size on
          these mocks is not measured. [LINT] the optional NLA term is a
          thousand times too small (#386).
        default: neff_6p09_b1p2_sigma_0p2684
        options:
          neff_6p09_b1p2_sigma_0p2684:
            label: 6.0905 arcmin^-2 unit-weight sources, b 1.2, sigma_e 0.2684, reduced shear, no IA
          catalogue_positions:
            label: Sample at the catalogue's positions and weights
            description: Not implemented.
          with_intrinsic_alignments:
            label: NLA convergence added per shell (ia_bias set)
            description: Implemented with the wrong amplitude.
      mock_two_point_measurements:
        label: xi+- and pseudo-Cl measured on the mocks
        rationale: >-
          glass_mock.smk measures each mock's xi+- with TreeCorr on the data's
          integration grid (the same min_sep, max_sep and nbins) with the
          catalogue's unit weights and no response or leakage correction
          (run_glass_mock_2pcf.py), and its pseudo-Cl with NaMaster's catalogue
          estimator on 32 sqrt-spaced bands from lmin 8 to lmax 2048 with e2
          flipped (run_glass_mock_pseudo_cl.py), the bands the data pipeline
          builds at nside 1024; the script reads the rule's nside 1024 but does
          not use it. The rule comment gives the reason: the E/B transforms
          then see the same theta binning on mocks and data, though each runs
          on its own sample's pair-weighted meanr. The grid extends below the
          mock band limit (about 2.6 arcmin): it starts at 0.5 arcmin under
          papers/bmodes and 0.08 arcmin under papers/cosmo_val. The standalone
          runner (compute_two_point_stats_glass.py with
          glass_mock.TREECORR_CONFIG) measures xi+- at 1-250 arcmin in 20 bins
          and the catalogue pseudo-Cl on the same 32 bands, under the
          xi_glass_mock_*_nbins=20 and cl_glass_mock_* names the mock inference
          and mock covariance rules read. The tomography branch's
          glass_mock.smk hard-codes 0.5-500 arcmin in 1000 bins instead
          (fixed_grid).
          Values:
          power = 0.5;
          lmin = 8;
          glass_mock.smk#lmax = 2048;
          cl_nbins = [32];
          sep_units = arcmin.
        default: data_integration_grid_catalog_powspace32
        options:
          data_integration_grid_catalog_powspace32:
            label: Data integration grid for xi; catalogue pseudo-Cl, 32 sqrt bands
          fixed_grid:
            label: 0.5-500 arcmin, 1000 bins (tomography branch)
            excluded: true
            excluded_reason: >-
              Its bins differ from the data's integration grid, so mock and
              data E/B transforms would not share a theta binning.
      cosebis_bias_test:
        label: COSEBIs B_n bias test on 100 GLASS mocks
        rationale: >-
          mock_cosebis_scatter computes 20 log-COSEBIs modes per mock on the
          integration bins wholly inside 1-250 arcmin, filters normalised on
          the surviving bins' meanr range with precision 120, and
          mock_cosebis_bias_test tests the mean B_n over mocks 1-100 against
          zero with chi2 = mean^T (C_B/N)^-1 mean, C_B the CosmoCov Gaussian
          masked covariance of SP_v1.4.6_leak_corr on the same grid carried
          through the COSEBIs kernel, reporting the 20-mode PTE, printed 5- and
          8-mode subsets and sigma_emp/sigma_ana per mode. The docstrings state
          the test (mean B_n = 0 at sigma/sqrt(N) precision) and record no
          further rationale. C_B/N assumes independent mocks whose scatter the
          data covariance describes; sigma_emp/sigma_ana is reported as the
          check but does not enter the chi2. The consumed v1.4.6 mocks hold
          about 35 M unit-weight galaxies per realisation; #319's 51.6 M
          weight-effective count refers to the v1.4.6.3 catalogue, whereas this
          test selects the SP_v1.4.6_leak_corr covariance, and mock
          independence requires distinct -s seeds because -N only labels the
          file. The mocks' reduced shear can carry a small B-mode the zero-mean
          null does not model. [HARDCODED] the 5- and 8-mode subsets (the
          config's cosebis.mode_subsets, [6, 20], is not read).
          Values:
          bmodes/config/config.yaml#cosebis.theta_min = 1.0;
          bmodes/config/config.yaml#cosebis.theta_max = 250.0;
          cosmo_val/config/config.yaml#cosebis.theta_min = 1.0;
          cosmo_val/config/config.yaml#cosebis.theta_max = 250.0;
          mock_cosebis_bias_test.py#precision = 120.
        default: analytic_cov_over_n_100_mocks
        options:
          analytic_cov_over_n_100_mocks:
            label: Mean B_n over 100 mocks against C_B/N from the analytic covariance
          empirical_mock_covariance:
            label: Covariance of the mean from the mock ensemble
            description: >-
              Not implemented; the per-mode sigma_emp/sigma_ana is plotted and
              written to the evidence JSON instead.
          all_configured_seeds:
            label: All 350 configured seeds
            description: The rule enumerates mocks 1-100 directly.
      mock_inference:
        label: >-
          Mock CosmoSIS inputs with tau null draws and zero-centred priors, and
          the mock goodness of fit
        rationale: >-
          inference_prep_glass_mock pairs each mock's precomputed 20-bin xi
          (xi_glass_mock_*_nbins=20 in glass_mock_data_dir) with the real rho
          statistics and a tau_0+, tau_2+, tau_5+ vector drawn from N(0, C_tau)
          of the real data, seeded by the mock id
          (generate_glass_mock_rhotau_samples.py), whose docstring gives the
          reason: mocks carry no PSF leakage, so tau is consistent with zero.
          cosmosis_fitting.py passes only tau_0+ and tau_2+ to the likelihood.
          --mock selects priors_mock.ini, whose alpha, beta, A, m1 and bias_1
          priors are centred on zero; the data runs use priors_psf.ini. No
          rationale is recorded at the prior sites; the generator injects no
          PSF leakage or shear calibration bias and, at its default, no IA. The
          rule only writes the CosmoSIS inputs, and inference.smk marks the
          subsystem dormant. The paper scripts (papers/harmonic,
          papers/realspace) take each mock's best fit from its existing chain,
          compute its chi2 from a CosmoSIS test-sampler run there, and quote
          the fiducial chi2's PTE within that distribution. Mock and data runs
          therefore differ in every nuisance prior centre and in the m1 width
          (0.01 against 0.014). [LINT] the PTE integrates a 25-bin histogram
          from the bin after the one holding the fiducial chi2 (#378), and the
          real-space mock total chi2 sums separate xi+, xi- and tau terms,
          dropping the xi+/xi- cross-covariance the fiducial likelihood
          includes (#378).
          Values:
          priors_mock.ini#psf_leakage_parameters.alpha = gaussian 0.0 0.022;
          priors_mock.ini#psf_leakage_parameters.beta = gaussian 0.0 0.1148;
          priors_mock.ini#intrinsic_alignment_parameters.A = gaussian 0.0 0.7;
          priors_mock.ini#shear_calibration_parameters.m1 = gaussian 0.0 0.01;
          priors_mock.ini#nofz_shifts.bias_1 = gaussian 0.0 0.018.
        default: gaussian_tau_null_zero_centred_priors
        options:
          gaussian_tau_null_zero_centred_priors:
            label: tau ~ N(0, C_tau) with real rho; zero-centred nuisance priors
          measured_mock_tau:
            label: Measure tau between mock shear and real PSF stars
            description: >-
              Not wired into the mock inference;
              glass_mock.compute_leakage_harmony measures a harmonic-space
              tau_0 pseudo-Cl between mock galaxies and real PSF stars as a
              separate diagnostic.
          data_priors:
            label: Run mocks under the data priors
            description: >-
              Not selectable alone: --mock picks both priors_mock.ini and the
              mock xi reader; not selected.
