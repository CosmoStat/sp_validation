[aliases]
test=pytest

[metadata]
description-file = README.md

[tool:pytest]
testpaths = sp_validation
addopts =
  --verbose
  --pycodestyle
  --pydocstyle
  --cov=sp_validation
  --cov-report=term
  --cov-report=xml
  --junitxml=pytest.xml

[pycodestyle]
ignore = W503

[pydocstyle]
convention = numpy
add-ignore = D105,D107
