# @sc [decision:shear_field.fiducial_columns]
versions: [
  "SP_v1.4.5", "SP_v1.4.5_leak_corr",
  "SP_v1.4.6.3", "SP_v1.4.6.3_leak_corr",
  "SP_v1.4.8", "SP_v1.4.8_leak_corr",
  "SP_v1.4.11.3", "SP_v1.4.11.3_leak_corr"
]
ellipticity_suffix: "_leak_corrected"

# These scan keys are unused; the rules read the fiducial block below.
npatches: [120]

min_seps: [1]
max_seps: [250]
nbins: [20]

min_seps_int : [0.1]
max_seps_int: [500]
nbins_int: [100, 200, 300, 500]

# fiducial parameters
# @sc [decision:real_space.jackknife_patches]
# @sc [decision:real_space.reporting_grid]
# @sc [decision:shear_field.fiducial_columns]
fiducial:
  version: SP_v1.4.6.3_leak_corr
  npatch: 1
  min_sep: 1.0
  max_sep: 250.0
  nbins: 20

  # @sc [decision:shear_field.fiducial_columns]
  mock_version: SP_v1.4.6.3

  # The mock version's catalogue under each n(z) realisation: entries identical
  # but for shear.redshift_path, compared by bb_covariance_nz_independence.
  nz_realisations:
    A: SP_v1.4.6.3_A_leak_corr
    B: SP_v1.4.6.3_B_leak_corr
    C: SP_v1.4.6.3_C_leak_corr

  # @sc [decision:real_space.integration_grid]
  min_sep_int: 0.5
  max_sep_int: 300.0
  nbins_int: 1000

  # COSEBIS parameters
  # Compute 20 modes, evaluate PTEs for both 6 and 20
  # @sc [decision:bmodes.cosebis_modes]
  nmodes: 20
  
  # Unified fiducial scale cut for all B-mode analyses (arcmin)
  # Matches Paper II (Goh et al.): [12, 83] for both xi+ and xi-
  # COSEBIs use unified cuts since they cannot have separate xi+/xi- ranges
  # @sc [decision:bmodes.fiducial_scale_cut]
  fiducial_min_scale: 12
  fiducial_max_scale: 83

  # Pure E/B mode fiducial scale cuts for plots (arcmin)
  # From Paper II: [12, 83] for both (most conservative choice)
  # @sc [decision:bmodes.fiducial_scale_cut]
  fiducial_xip_scale_cut: [12, 83]
  fiducial_xim_scale_cut: [12, 83]

  chain: SP_v1.4.6.3_leak_corr_C_sc_10_150_new_ia


var_method: jackknife  # Unused; ξ± variance follows fiducial.npatch (shot when 1).

# @sc [decision:covariance.footprint_mask_power]
covariance:
  # Use masked covariance by default when true
  default_masked: true
  # Cosmology: imported from cs_util.cosmo.PLANCK18 (astropy Planck18)
  # Mask Cl paths: defined in covariance.smk (MASK_CLS_FILES)

# Harmonic-space (C_l) analysis parameters
# @sc [decision:bmodes.bmode_summary]
cl:
  n_ell_bins: 32
  # Finer binning for COSEBIS cross-validation (harmonic_config_cosebis_comparison).
  # 96-bin powspace recovers modes 1-5 within ~2% of config-space (validated on GLASS mocks).
  # Modes 6+ remain fundamentally limited by W_n(ell) numerical precision, not binning.
  cosebis_nbins: 96
  # Fiducial scale cuts for cosmological inference (from Paper II, Goh et al.)
  fiducial_ell_min: 300
  fiducial_ell_max: 1600

# Harmonic pseudo-Cl fiducial binning — the tag the producer (twopoint.smk
# pseudo_cl / pseudo_cl_cov) stamps into the filename, which the inference
# consumer reconstructs to request the exact file. Canonical: powspace / 32.
harmonic:
  fiducial:
    binning: powspace
    nbins: 32

# Cosmological inference data-product locations (dormant subsystem). Output
# products land beside the code (workflow/common.py COSMO_INFERENCE); only the
# external chain directories are configured here.
inference:
  # CosmoSIS chain output root for real-data runs.
  chains_dir: "/n09data/guerrini/output_chains"
  # CosmoSIS chain output root for GLASS mock runs.
  glass_mock_chains_dir: "/n09data/guerrini/glass_mock_chains"

# COSEBIS calculation parameters
# @sc [decision:bmodes.cosebis_modes]
# @sc [decision:mocks.cosebis_bias_test]
cosebis:
  theta_min: 1.0      # arcmin, angular scale range
  theta_max: 250.0    # arcmin, matches max_sep for consistency
  mode_subsets: [6, 20]  # mode counts for PTE evaluation

# Statistical thresholds
# @sc [decision:bmodes.bmode_summary]
statistics:
  pte_healthy_range: [0.05, 0.95]  # 5% per tail (10% two-sided; about 1.64σ)

# Plotting defaults
plotting:
  palette: "colorblind"  # seaborn palette
  version_alpha:
    fiducial: 1.0
    comparison: 1.0
  markers:
    style: "unfilled"
    linewidth: 1.5
    capsize: 3
  x_offsets: [-0.132, -0.044, 0.044, 0.132]  # prevent overlap in comparisons (4 versions), tighter spacing
  # Human-readable version labels for plots
  version_labels:
    SP_v1.4.5_leak_corr: "Initial"
    SP_v1.4.6.3_leak_corr: "Size cuts"
    SP_v1.4.8_leak_corr: "Masking"
    SP_v1.4.11.3_leak_corr: "Relaxed flags"
  # Which version's value is drawn as the fiducial reference line in version comparison plots
  fiducial_for_comparison: "SP_v1.4.6.3_leak_corr"
  # Version box styling
  version_box:
    edge_color: "0.3"
    edge_linewidth: 0.7
    fiducial_line_color: "black"
    fiducial_line_width: 1.0

# pixel mask processing for survey geometry and CosmoCov integration
pixel_mask:
  # Target nside values for downgrading (balance accuracy vs computational cost)
  target_nsides: [2048, 4096, 8192]
  # Source mask file for downgrading
  source_file: "/n17data/UNIONS/WL/masks/mask_r_nside131072.hsp"

# GLASS mock suite: catalogues and precomputed xi/Cl (Sacha's pipeline).
# Generated outputs are labelled by the parent directory's suite name.
glass_mocks:
  data_dir: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results"
  version: "v0"  # Inference product version, independent of the suite.
  seed_range: [1, 350]

# External tools
tools:
  cosmocov_executable: "/n23data1/n06data/lgoh/scratch/UNIONS/CosmoCov/covs/cov"
