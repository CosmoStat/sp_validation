# UNIONS catalogue cosmology-validation suite — run-specific config.
#
# Drives the decomposed CosmologyValidation diagnostics in
# workflow/rules/cosmo_val.smk. The `cosmo_val:` block holds the constructor
# and diagnostic settings. The shared workflow also reads `versions` and
# `fiducial` to select catalogues and real-space grids,
# `covariance.default_masked` to choose covariance files, and
# `harmonic.fiducial` to name pseudo-Cl inputs.

# Catalog versions to validate. Comparison runs overlay the leakage-corrected
# variant against its parent.
# @sc [decision:shear_field.fiducial_columns]
versions: [
  "SP_v1.4.6.3",
  "SP_v1.4.6.3_leak_corr",
]

# ---------------------------------------------------------------------------
# CosmologyValidation suite parameters (cosmo_val.py)
# ---------------------------------------------------------------------------
# @sc [decision:covariance.pseudo_cl_gaussian_covariance]
# @sc [decision:harmonic.multipoles_and_bandpowers]
# @sc [decision:harmonic.shear_estimator]
# @sc [decision:psf.leakage_fit_sampling]
# @sc [decision:psf.tau_covariance]
# @sc [decision:real_space.jackknife_patches]
# @sc [decision:real_space.reporting_grid]
# @sc [decision:shear_field.survey_area]
# @sc [decision:spin2_sign_convention]
cosmo_val:
  # CosmologyValidation constructor
  npatch: 100
  theta_min: 1.0
  theta_max: 250.0
  nbins: 20
  theta_min_plot: 0.8
  theta_max_plot: 260.0
  ylim_alpha: [-0.01, 0.05]
  nrandom_cell: 100
  cell_method: catalog
  nside_mask: 8192
  cov_estimate_method: th
  compute_cov_rho: true
  n_cov: 100
  var_method: jackknife  # TreeCorr variance for rho/tau; xi variance follows npatch.
  quantile: 0.1587
  ylim_xi_sys_ratio: [-0.02, 0.5]
  fiducial_input_inka: coupled
  # Diagnostic-runner settings; these do not configure the twopoint producers.
  # Those use nside=1024, catalogue estimation, power=0.5, 100 randoms, and
  # binning from harmonic.fiducial.
  nside: 1024
  binning: powspace
  power: 0.5
  n_ell_bins: 32
  ell_step: 10
  pol_factor: true
  noise_bias_method: analytic
  cell_seed: 8192
  path_onecovariance: "/home/guerrini/OneCovariance/"
  rho_tau_method: lsq

  # Fiducial scale cut (arcmin) for B-mode PTE extraction. Paper II: [12, 83].
  # @sc [decision:bmodes.fiducial_scale_cut]
  fiducial_scale_cut: [12, 83]

  # Whether the harmonic-space pseudo-Cl BB enters the B-mode summary. On by
  # default — it is no more expensive than the other diagnostics, and the
  # C_l^BB column belongs in the standard B-mode summary.
  # @sc [decision:bmodes.bmode_summary]
  include_pseudo_cl: true

  # CosmologyValidation reference values. The pseudo-Cl covariance producer
  # uses results/cosmology/planck18.json and CCL halofit, not these CAMB settings.
  # @sc [decision:covariance.pseudo_cl_fiducial_theory]
  cosmo_params:
    Omega_m: 0.30966
    Omega_b: 0.04897
    h: 0.6766
    sig8: 0.8102
    ns: 0.9665
    mnu: 0.06
    extra_params:
      camb:
        nonlinear: true
        halofit_version: mead2020_feedback
        HMCode_log_T_AGN: 7.8
        kmax: 20
        kmax_extrapolate: 500

  # The fine ξ± grid both B-mode statistics (COSEBIs, pure-E/B) integrate over.
  # @sc [decision:real_space.integration_grid]
  integration:
    min_sep: 0.08
    max_sep: 300
    nbins: 1000

  # COSEBIs on the integration grid: mode count and the scale cuts scanned.
  # @sc [decision:bmodes.cosebis_modes]
  cosebis:
    nmodes: 20
    scale_cuts: [
      [1, 250], [2, 250], [5, 250], [10, 250],
      [12, 83], [15, 250], [20, 250],
    ]

# ---------------------------------------------------------------------------
# Shared-workflow settings used by the diagnostics.
# `fiducial` sets real-space grids; `covariance.default_masked` selects
# covariance inputs.
# `harmonic.fiducial` supplies the pseudo-Cl filename tag.
# ---------------------------------------------------------------------------
# @sc [decision:shear_field.fiducial_columns]
fiducial:
  version: SP_v1.4.6.3_leak_corr
  npatch: 1
  min_sep: 1.0
  max_sep: 250.0
  nbins: 20
  min_sep_int: 0.5
  max_sep_int: 300.0
  nbins_int: 1000
  nmodes: 20
  mock_version: SP_v1.4.6.3
  fiducial_min_scale: 12
  fiducial_max_scale: 83

var_method: jackknife  # Unused at top level; rho/tau uses cosmo_val.var_method.

# @sc [decision:covariance.footprint_mask_power]
covariance:
  default_masked: true

cl:
  n_ell_bins: 32
  cosebis_nbins: 96
  fiducial_ell_min: 300
  fiducial_ell_max: 1600

# Harmonic pseudo-Cl fiducial binning — the tag the producer (twopoint.smk)
# stamps into the filename, reconstructed by the inference consumer.
# @sc [decision:harmonic.multipoles_and_bandpowers]
harmonic:
  fiducial:
    binning: powspace
    nbins: 32

# Cosmological inference data-product locations (dormant subsystem).
inference:
  chains_dir: "/n09data/guerrini/output_chains"
  glass_mock_chains_dir: "/n09data/guerrini/glass_mock_chains"

cosebis:
  theta_min: 1.0
  theta_max: 250.0
  mode_subsets: [6, 20]

pixel_mask:
  target_nsides: [2048, 4096, 8192]
  source_file: "/n17data/UNIONS/WL/masks/mask_r_nside131072.hsp"

# GLASS mock suite: catalogues and precomputed xi/Cl (Sacha's pipeline).
# Generated outputs are labelled by the parent directory's suite name.
glass_mocks:
  data_dir: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results"
  version: "v0"  # Inference product version, independent of the suite.
  seed_range: [1, 350]

tools:
  cosmocov_executable: "/n23data1/n06data/lgoh/scratch/UNIONS/CosmoCov/covs/cov"
