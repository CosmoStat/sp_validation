    inputs: [field, v2_stars, skills, swarp, option_settings]
    decisions: [field, galaxy_layout, magnitude_range, psf_model, noise_model, shear_amplitude, generator, shapepipe]
    recipe:
      command: >-
        python -m sp_validation.image_sims.simulate catalogue --branch 1p2z
        --options {inputs.option_settings}
        --select field={decisions.field} galaxy_layout={decisions.galaxy_layout}
        magnitude_range={decisions.magnitude_range} psf_model={decisions.psf_model}
        noise_model={decisions.noise_model} shear_amplitude={decisions.shear_amplitude}
        generator={decisions.generator} shapepipe={decisions.shapepipe}
        --field {inputs.field} --stars {inputs.v2_stars} --skills {inputs.skills}
        --swarp {inputs.swarp}/bin/swarp --cores 48 --memory-mb 150000 --output {output}
      resources: {cpus: 48, memory: 160Gi}

  - id: catalogue_1m2z
    type: data
    format: hdf5
    label: "ShapePipe catalogue, g₁ = −g"
    description: |
      ShapePipe's merged catalogue of branch 1m2z (g₁ = −g): the generator draws
      the branch's exposures and coadds its tiles in the recipe's temporary
      directory, then `sp run --here` processes them; the images go with the
      directory.
    inputs: [field, v2_stars, skills, swarp, option_settings]
    decisions: [field, galaxy_layout, magnitude_range, psf_model, noise_model, shear_amplitude, generator, shapepipe]
    recipe:
      command: >-
        python -m sp_validation.image_sims.simulate catalogue --branch 1m2z
        --options {inputs.option_settings}
        --select field={decisions.field} galaxy_layout={decisions.galaxy_layout}
        magnitude_range={decisions.magnitude_range} psf_model={decisions.psf_model}
        noise_model={decisions.noise_model} shear_amplitude={decisions.shear_amplitude}
        generator={decisions.generator} shapepipe={decisions.shapepipe}
        --field {inputs.field} --stars {inputs.v2_stars} --skills {inputs.skills}
        --swarp {inputs.swarp}/bin/swarp --cores 48 --memory-mb 150000 --output {output}
      resources: {cpus: 48, memory: 160Gi}

  - id: catalogue_1z2p
    type: data
    format: hdf5
    label: "ShapePipe catalogue, g₂ = +g"
    description: |
      ShapePipe's merged catalogue of branch 1z2p (g₂ = +g): the generator draws
