# The shear-calibration section: the multiplicative shear bias m of the
# calibrated sample, measured on image simulations that twin a real UNIONS
# campaign, processed by ShapePipe and selected and weighted as the data are.
#
# options.yaml gives the concrete settings of each option the simulation
# code reads (sp_validation.image_sims.options); the recipes select one
# option per decision, and fixed settings with no live alternative are
# written into the commands. Commands name a fetched product by the path its
# manifest records.

spec_version: "0.1.0"
label: Multiplicative shear bias from image simulations
description: >-
  Twin image simulations of a real campaign: every CCD of every real exposure
  keeps its WCS, zero point, weight and flag maps and its noise level, and
  carries SKiLLS galaxies sheared by a known g, convolved with a PSF matched
  to that CCD's v2 stars. Five shear branches (g = 0, ±g₁, ±g₂, |g| = 0.025)
  share their noise and are each processed by ShapePipe's own workflow at the
  code that made the v2 data, then selected, weighted with the data's weight
  table and metacalibrated as the data are. m and c follow from the
  calibrated mean shear of the ±g branches. The galaxies sit on a 10″
  lattice, so m measures the shape measurement and the selection without
  blending.

analyses:
  sp:
    path: ../..
  catalogue:
    path: ../catalogue

inputs:
  options:
    path: options.yaml
    description: What each option of each simulation decision sets.

outputs:
  twin_field:
    label: Staged real campaign
    type: data
    format: json
    description: >-
      The real campaign the simulation twins, staged from CADC by
      sp_validation.image_sims.stage: tiles/CFIS.XXX.YYY.r.fits (WCS, size,
      and HISTORY cards naming each tile's exposures) and
      exposures/NNNNNNNp{,.weight,.flag}.fits.fz (CCD headers, weights,
      flags, and the pixels the noise level is measured on).
    decisions: [field]
    recipe:
      command: >-
        python -m sp_validation.fetch '${{unions_data}}/image-sims/fields/{decisions.field}'
        --version {decisions.field} --out {output}
      resources: { cpus: 1, memory: 2GB, time_limit: 2h }

  skills:
    label: SKiLLS input galaxies
    type: data
    format: json
    description: >-
      The SKiLLS v07Ds input galaxy catalogue (six feather files): Sérsic
      index, effective radius, axis ratio and magnitudes, drawn at random
      onto the layout's positions.
    recipe:
      command: >-
        python -m sp_validation.fetch '${{unions_data}}/image-sims/skills'
        --version v07Ds --out {output}
      resources: { cpus: 1, memory: 2GB, time_limit: 1h }

  swarp:
    label: SWarp 2.41.5
    type: data
    format: json
    description: >-
      SWarp from conda-forge (astromatic-swarp 2.41.5), which coadds the
      simulated exposures onto the real tiles' pixel grids as the real tiles
      were made; the image lacks it.
    recipe:
      command: >-
        python -m sp_validation.fetch '${{unions_data}}/image-sims/tools/swarp'
        --version 2.41.5 --out {output}
      resources: { cpus: 1, memory: 2GB, time_limit: 1h }

  truth:
    label: Input galaxies
    type: data
    format: fits
    description: >-
      Every simulated galaxy: ID, RA, Dec, magnitude, flux, Sérsic n, size,
      axis ratio, angle and intrinsic shear.
    inputs: [options, twin_field, catalogue.star_catalogue, skills, swarp]
    decisions: [field, galaxy_layout, magnitude_range, psf_model]
    recipe:
      command: >-
        python -m sp_validation.image_sims.simulate truth
        --options {inputs.options}
        --select field={decisions.field} galaxy_layout={decisions.galaxy_layout}
        magnitude_range={decisions.magnitude_range} psf_model={decisions.psf_model}
        noise_model=gaussian_ccd_rms shear_amplitude=g0p025 generator=twin_c90c5b3
        shapepipe=v2_here selection=v2 simulation_weights=v2_table
        --field "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.twin_field})"
        --stars "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.catalogue.star_catalogue})"/dataset
        --skills "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.skills})"
        --swarp "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.swarp})"/bin/swarp
        --output {output}
      resources: { cpus: 1, memory: 16GB }

  catalogue_1z2z:
    label: ShapePipe catalogue, no shear
    type: data
    format: hdf5
    description: >-
      ShapePipe's merged catalogue of branch 1z2z (no shear): the generator draws
      the branch's exposures and coadds its tiles in a temporary directory,
      and `sp run --here` processes them; the images go with the directory.
    inputs: [options, twin_field, catalogue.star_catalogue, skills, swarp]
    decisions: [field, galaxy_layout, magnitude_range, psf_model]
    recipe:
      command: >-
        python -m sp_validation.image_sims.simulate catalogue --branch 1z2z
        --options {inputs.options}
        --select field={decisions.field} galaxy_layout={decisions.galaxy_layout}
        magnitude_range={decisions.magnitude_range} psf_model={decisions.psf_model}
        noise_model=gaussian_ccd_rms shear_amplitude=g0p025 generator=twin_c90c5b3
        shapepipe=v2_here selection=v2 simulation_weights=v2_table
        --field "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.twin_field})"
        --stars "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.catalogue.star_catalogue})"/dataset
        --skills "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.skills})"
        --swarp "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.swarp})"/bin/swarp
        --cores 48 --memory-mb 150000 --output {output}
      resources: { cpus: 48, memory: 160GB }

  catalogue_1p2z:
    label: ShapePipe catalogue, g₁ = +g
    type: data
    format: hdf5
    description: >-
      ShapePipe's merged catalogue of branch 1p2z (g₁ = +g): the generator draws
      the branch's exposures and coadds its tiles in a temporary directory,
      and `sp run --here` processes them; the images go with the directory.
    inputs: [options, twin_field, catalogue.star_catalogue, skills, swarp]
    decisions: [field, galaxy_layout, magnitude_range, psf_model]
    recipe:
      command: >-
        python -m sp_validation.image_sims.simulate catalogue --branch 1p2z
        --options {inputs.options}
        --select field={decisions.field} galaxy_layout={decisions.galaxy_layout}
        magnitude_range={decisions.magnitude_range} psf_model={decisions.psf_model}
        noise_model=gaussian_ccd_rms shear_amplitude=g0p025 generator=twin_c90c5b3
        shapepipe=v2_here selection=v2 simulation_weights=v2_table
        --field "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.twin_field})"
        --stars "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.catalogue.star_catalogue})"/dataset
        --skills "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.skills})"
        --swarp "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.swarp})"/bin/swarp
        --cores 48 --memory-mb 150000 --output {output}
      resources: { cpus: 48, memory: 160GB }

  catalogue_1m2z:
    label: ShapePipe catalogue, g₁ = −g
    type: data
    format: hdf5
    description: >-
      ShapePipe's merged catalogue of branch 1m2z (g₁ = −g): the generator draws
      the branch's exposures and coadds its tiles in a temporary directory,
      and `sp run --here` processes them; the images go with the directory.
    inputs: [options, twin_field, catalogue.star_catalogue, skills, swarp]
    decisions: [field, galaxy_layout, magnitude_range, psf_model]
    recipe:
      command: >-
        python -m sp_validation.image_sims.simulate catalogue --branch 1m2z
        --options {inputs.options}
        --select field={decisions.field} galaxy_layout={decisions.galaxy_layout}
        magnitude_range={decisions.magnitude_range} psf_model={decisions.psf_model}
        noise_model=gaussian_ccd_rms shear_amplitude=g0p025 generator=twin_c90c5b3
        shapepipe=v2_here selection=v2 simulation_weights=v2_table
        --field "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.twin_field})"
        --stars "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.catalogue.star_catalogue})"/dataset
        --skills "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.skills})"
        --swarp "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.swarp})"/bin/swarp
        --cores 48 --memory-mb 150000 --output {output}
      resources: { cpus: 48, memory: 160GB }

  catalogue_1z2p:
    label: ShapePipe catalogue, g₂ = +g
    type: data
    format: hdf5
    description: >-
      ShapePipe's merged catalogue of branch 1z2p (g₂ = +g): the generator draws
      the branch's exposures and coadds its tiles in a temporary directory,
      and `sp run --here` processes them; the images go with the directory.
    inputs: [options, twin_field, catalogue.star_catalogue, skills, swarp]
    decisions: [field, galaxy_layout, magnitude_range, psf_model]
    recipe:
      command: >-
        python -m sp_validation.image_sims.simulate catalogue --branch 1z2p
        --options {inputs.options}
        --select field={decisions.field} galaxy_layout={decisions.galaxy_layout}
        magnitude_range={decisions.magnitude_range} psf_model={decisions.psf_model}
        noise_model=gaussian_ccd_rms shear_amplitude=g0p025 generator=twin_c90c5b3
        shapepipe=v2_here selection=v2 simulation_weights=v2_table
        --field "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.twin_field})"
        --stars "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.catalogue.star_catalogue})"/dataset
        --skills "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.skills})"
        --swarp "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' {inputs.swarp})"/bin/swarp
        --cores 48 --memory-mb 150000 --output {output}
      resources: { cpus: 48, memory: 160GB }

  catalogue_1z2m:
    label: ShapePipe catalogue, g₂ = −g
    type: data
