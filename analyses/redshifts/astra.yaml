# The redshifts section: tomographic bins, their n(z) by SOM direct
# calibration, the n(z) realisations, and the response of each bin.
#
# config/calibration/nz/v2.yaml (sp.nz_v2) is the recipe sp_validation.nz
# runs: it names the inputs and sets every value of the calibration, and its
# `@sc [decision:redshifts.*]` tags name the decisions below. The script reads only
# that file, so the decisions are attached to the outputs it makes.

spec_version: "0.1.0"
label: Tomographic bins and n(z)
description: >-
  The source redshift distributions of the tomographic analysis. Sources and
  calibrators share one photometry, PhotoPipe's run on the DR6 detections:
  the sources are the calibrated sample's rows with their photometry from the
  v2 collection by DR6 object ID, the calibrators are DEEP2 and DEEP3 spectra
  in the EGS from the collection's spec-z extension. A self-organising map
  trained on the calibrators transfers their redshifts to the sources of each
  of four BPZ bins; within each bin, a gold selection keeps the SOM groups
  whose spectra agree with their sources' BPZ. An ensemble of 2,000
  realisations perturbs the calibration's inputs to give its uncertainty.
  The calibration rests on one spectroscopic field. The bins then get their
  own metacalibration response, with the sample's weight table held fixed.

analyses:
  sp:
    path: ../..
  catalogue:
    path: ../catalogue

outputs:
  nz_calibration:
    label: SOM direct calibration
    type: data
    format: dir
    description: >-
      Everything sp_validation.nz.pipeline writes: nz_tomo.txt, nz_nontomo.txt,
      tom_bin.parquet, realisations.npz, ensemble_inputs.npz, calibrators.npz,
      som_model.npz, calibration_arrays.npz, summary.json and recipe.yaml (the
      recipe, byte for byte). The recipe names the sources (the released
      calibrated catalogue) and the collection by data-root path.
    inputs:
      [sp.nz_v2, catalogue.calibrated_catalogue, catalogue.collection,
       sp.photopipe_specz]
    decisions:
      [source_photometry_join, tomographic_bins, calibrator_set,
       photometry_as_delivered, z2_offset, som_map, gold_selection,
       grid_step, ensemble_terms, sp.fiducial_cosmology]
    recipe:
      command: >-
        python ../../scripts/calibration/calibrate_nz.py {inputs.sp.nz_v2}
        --output {output} --workers 32
      resources: { cpus: 32, memory: 256GB, time_limit: 4h }

  nz_tomo:
    label: Tomographic n(z)
    type: data
    format: txt
    description: >-
      z on a Δz = 0.05 grid over [0, 5] and one density per bin, each
      integrating to the bin's share of the retained shear weight
      (cosmo_val's shear.redshift_path).
    inputs: [nz_calibration]
    recipe:
      command: cp {inputs.nz_calibration}/nz_tomo.txt {output}

  nz_nontomo:
    label: Non-tomographic n(z)
    type: data
    format: txt
    description: The sum of the bins, the n(z) of every TOM_BIN_ID > 0 galaxy.
    inputs: [nz_calibration]
    recipe:
      command: cp {inputs.nz_calibration}/nz_nontomo.txt {output}

  tom_bin:
    label: Each galaxy's bin
    type: data
    format: parquet
    description: >-
      OBJECT_ID, TOM_BIN_ID (1 to 4, 0 for a galaxy in no bin) and ZBAND,
      row-aligned with the calibrated catalogue.
    inputs: [nz_calibration]
    recipe:
      command: cp {inputs.nz_calibration}/tom_bin.parquet {output}

  realisations:
    label: n(z) realisations
    type: data
    format: npz
    description: >-
      2,000 draws of every bin at once, (draws, bins, z), each of unit
      integral and recentred on the delivered n(z).
    inputs: [nz_calibration]
    recipe:
      command: cp {inputs.nz_calibration}/realisations.npz {output}

  nz_summary:
    label: Calibration summary
    type: data
    format: json
    description: >-
      The bin edges; each bin's mean redshift, shear weight before and after
      gold, gold fraction and calibrator count; the photometry match of the
      sources by shear weight; and the retention after the BPZ range and gold.
    inputs: [nz_calibration]
    recipe:
      command: cp {inputs.nz_calibration}/summary.json {output}

  tomographic_sample:
    label: Calibrated sample with its bins
    type: data
    format: dir
    description: >-
      The calibrated sample with each row's TOM_BIN_ID, and catalogs/
      response.json with each bin's record under bins: R, its shear and
      selection parts, c_e and the delete-one-tile jackknife covariance,
      measured with the sample's weight table held fixed and each galaxy's
      bin held fixed across the metacal branches (bins come from the saved
      SOM model, so galaxies that only a sheared branch selects get one too).
      provenance/bin_response_checks.json records that the bins are those of
      tom_bin and that the bins' sums add to the sample's.
    inputs: [catalogue.calibrated_catalogue, nz_calibration]
    decisions: [sample_calibration]
    recipe:
      command: >-
        cp -r {inputs.catalogue.calibrated_catalogue} {output}
        && mkdir -p {output}/nz {output}/provenance
        && cp {inputs.nz_calibration}/tom_bin.parquet {output}/nz/
        && cp {inputs.nz_calibration}/som_model.npz {output}/provenance/nz_som_model.npz
        && cp {inputs.nz_calibration}/calibration_arrays.npz {output}/provenance/nz_calibration_arrays.npz
        && cp {inputs.nz_calibration}/recipe.yaml {output}/provenance/nz_recipe.yaml
        && python ../../scripts/calibration/bin_responses.py
        ../../config/calibration/sample/v2.yaml --output {output} --workers 64
      resources: { cpus: 64, memory: 256GB, time_limit: 1h }

  bin_responses:
    label: Response of each bin
    type: data
    format: json
    description: >-
      catalogs/response.json of the tomographic sample: the whole sample's
      record and, under bins, each bin's.
    inputs: [tomographic_sample]
    recipe:
      command: cp {inputs.tomographic_sample}/catalogs/response.json {output}

decisions:
  source_photometry_join:
    label: Source photometry joined on the DR6 object ID
    rationale: >-
      Each catalogue row takes PhotoPipe photometry and BPZ from the
      collection by OBJECT_ID = 10⁶ × tile + NUMBER, an exact integer key. A
      row with no DR6 number, or an ID the collection lacks, keeps NaN
      photometry and gets no bin; summary.json reports its share of the
      shear weight.
      Values: nz.inputs.OBJECT_ID = "OBJECT_ID".
    options:
      object_id:
        label: Join on OBJECT_ID
        description: Unmatched rows are counted, never guessed.
      exact_position:
        label: Exact RA/Dec match
        description: >-
          Depends on two catalogues writing the same bits for a position; a
          rounding difference silently drops or mismatches rows.

  tomographic_bins:
    label: Four equal-weight bins in BPZ
    rationale: >-
      Four bins cut on the DR6 BPZ point estimate Z_B within [0.10, 1.20),
      lower edges included. Each run places the three inner edges at the
      shear-weight quartiles of its sources with complete photometry and BPZ
      in range, before gold, and records them in summary.json; the
      calibrators are split by the same edges. Gold then removes a different
      share of each bin, so the delivered bins hold only roughly equal
      weight. Equal weight gives the bins comparable signal-to-noise; the
      range is where BPZ on ugriz is usable.
      Values: v2.yaml#bins.count = 4; v2.yaml#bins.range = [0.1, 1.2].
    options:
      equal_weight_quartiles:
        label: Equal shear weight, recomputed per run
      fixed_edges:
        label: Fixed edges 0.10/0.37/0.55/0.76/1.20
        description: >-
          The shear-weight quartiles of the first calibration, kept fixed.
          Bins stay comparable between runs but drift from equal weight.
      equal_number:
        label: Equal galaxy number
        description: Quantiles of galaxy count rather than shear weight.
      fixed_width:
        label: Fixed-width bins
        description: >-
          As KiDS-1000: Δz_B = 0.2 over 0.1–0.9 and a fifth bin over 0.9–1.2.
      som_cell_assignment:
        label: Bins assigned by SOM cell
        excluded: >-
          Needs a wide-field SOM and a deep-field transfer this calibration
          does not have.

  calibrator_set:
    label: DEEP2 and DEEP3 spectra in the EGS
    rationale: >-
      Calibrators are a selection on the collection's spec-z extension, so
      they share the sources' photometry: DEEP2 and DEEP3 spectra whose
      position lies in the EGS (RA 213–217°, Dec 51.5–54°), each kept once,
      with z > 0.002 (removing stars) and complete ugriz after the z2 fill.
      DEEP2 also covers Field 2 (RA 252°, Dec 35°), which DEEP2 preselected
      by BRI colour to z > 0.7; a SOM trained on both would calibrate the low
      bins on a sample missing low-z galaxies. No redshift-quality cut is
      applied: the compilation gives every DEEP2/3 entry confidence 0.99. One
      field means no field-to-field variance beyond the ensemble's
      line-of-sight term, and no model of the spectroscopic selection.
      Values: v2.yaml#inputs.calibrators.surveys = ["deep2_final", "deep3_final"];
      v2.yaml#inputs.calibrators.field = {"ra": [213.0, 217.0], "dec": [51.5, 54.0]};
      v2.yaml#inputs.calibrators.z_min = 0.002.
    options:
      deep2_deep3_egs:
        label: DEEP2 + DEEP3 in the EGS
      deep2_both_fields:
        label: DEEP2 in the EGS and Field 2, with DEEP3
        description: >-
          In SOM groups shared with the EGS, Field 2's spec-z sit higher by
          +0.44, +0.31, +0.14 and +0.017 in bins 1–4, and adding it moves
          bin 3's mean z by +0.039.
      add_desi_dr1:
        label: Add DESI DR1 spectra on the same tiles
        description: About 36,000 spectra with their own targeting.

  photometry_as_delivered:
    label: PhotoPipe photometry used as delivered
    rationale: >-
      [HARDCODED] Sources and calibrators take PhotoPipe's magnitudes with no
      stellar-locus or zero-point correction; the code has no correction
      step. The EGS sits off the DR6 stellar locus (+0.035 in g−r, +0.055 in
      i−z) and DR6 tiles carry 9–28 mmag zero-point errors in colour; these
      enter the ensemble as its zero-point term. Correcting the EGS by the
      full stellar offset would raise ⟨z⟩ by up to +0.018, +0.005, +0.007 and
      +0.013 in bins 1–4. The photometry is PhotoPipe's to correct.
      Values: none.
    options:
      as_delivered:
        label: As delivered
      correct_egs:
        label: Correct the EGS only
        description: >-
          Galaxies follow only 0.6–0.9 of a stellar offset, so this
          over-corrects.
      per_tile_stellar_locus:
        label: Per-tile stellar-locus correction of sources and calibrators

  z2_offset:
    label: z2 fills an undetected z
    rationale: >-
      Where z is undetected, the second z exposure (z2) fills it after a
      constant offset (−0.1105 mag), for sources and calibrators alike;
      canonical z takes precedence. Without it the sources measured only in
      z2, a third of the gold weight, lack complete photometry and leave
      every bin.
      Values: v2.yaml#z2_offset = -0.1104888916015625.
    options:
      offset_z2:
        label: z2 plus a constant offset
      canonical_only:
        label: Canonical z only
        description: Drops the z2-only sources.

  som_map:
    label: 101 × 101 SOM on the calibrators, 2,000 groups
    rationale: >-
      A planar 101 × 101 batch SOM, 60 epochs from a PCA initialisation, seed
      42, trained on the calibrators alone on the ten pairwise ugriz colours
      and r, each standardised. Ward clustering merges its 10,201 cells into
      2,000 groups of about five spectra, the unit of the calibration weights
      and of the gold test; each source goes to its nearest cell with no
      distance cut.
      Values: v2.yaml#som.side = 101; v2.yaml#som.epochs = 60;
      v2.yaml#som.seed = 42; v2.yaml#groups = 2000.
    options:
      calibrator_trained_101:
        label: 101 × 101 on the calibrators, 2,000 groups
        insights: [som_gold_sample]
      train_on_sources:
        label: Train on the sources
        description: Most cells then hold no spectrum.
      no_grouping:
        label: Calibrate per cell
        description: About one spectrum per cell; noisier weights.

  gold_selection:
    label: Gold groups at max(0.4, 5 × NMAD)
    rationale: >-
      Within a bin, a SOM group is gold when it holds an in-bin spectrum and
      its spectra's mean spec-z agrees with its sources' weighted mean BPZ
      within max(0.4, 5 × NMAD(spec-z − BPZ)) over every calibrator; sources
      outside gold get TOM_BIN_ID 0. Most of gold's loss is groups with no
      in-bin spectrum, not the agreement test. The factor's range enters the
      ensemble.
      Values: v2.yaml#gold_qc.floor = 0.4; v2.yaml#gold_qc.nmad_factor = 5.
    options:
      floor_0_4_nmad_5:
        label: max(0.4, 5 × NMAD)
        insights: [som_gold_sample]
      support_only:
        label: Every group with an in-bin spectrum
        description: No agreement test.

  grid_step:
    label: n(z) on a Δz = 0.05 grid
    rationale: >-
      The weighted spectra are deposited linearly on a grid of step 0.05 over
      [0, 5], which keeps each bin's mass and mean and widens it by about
      step²/6 in variance. A finer grid resolves the galaxy overdensities
      along the single EGS sightline, which belong to the calibration field
      and not to the sources. Against a 0.01 grid, 0.05 moves the ξ± theory
      (12–83′) by Δχ² < 0.01 without intrinsic alignments and 0.06 with
      A_IA = 1.
      Values: v2.yaml#grid.step = 0.05.
    options:
      step_0_05:
        label: Δz = 0.05
      step_0_01:
        label: Δz = 0.01
        description: Carries the EGS sightline's spikes into the n(z).

  ensemble_terms:
    label: Statistical and systematic terms of the realisations
    rationale: >-
      2,000 draws perturb the calibration's inputs and recalibrate every bin
      together. Statistical terms: a bootstrap of the spectra, and a
      lognormal line-of-sight density through the 2° × 0.25° DEEP2/3 strip
      with bias 1.3. Systematic terms: EGS zero points against the wide field
      (colour scatter and correlations from stellar-locus regression on
      3.4 deg² patches, and 0.01 mag grey), the z2 → z constant (0.02 mag),
      spec-z failures (1%), and the gold factor drawn in [4, 6]. The zero
      points dominate σ⟨z⟩ and correlate ⟨z⟩ between bins. Spectroscopic
      selection and method bias calibrated on simulations are not modelled,
      so the spread is a lower bound.
      Values: v2.yaml#ensemble.draws = 2000; v2.yaml#ensemble.bootstrap = True;
      v2.yaml#ensemble.density.field = [2.0, 0.25];
      v2.yaml#ensemble.density.bias = 1.3;
      v2.yaml#ensemble.zero_points.colour_sigma = [0.0215, 0.0194, 0.0119, 0.0208];
      v2.yaml#ensemble.zero_points.colour_corr = [[1.0, -0.59, 0.13, -0.13], [-0.59, 1.0, -0.05, 0.16], [0.13, -0.05, 1.0, -0.49], [-0.13, 0.16, -0.49, 1.0]];
      v2.yaml#ensemble.zero_points.grey = 0.01;
      v2.yaml#ensemble.z2_offset = 0.02;
      v2.yaml#ensemble.specz_failure = 0.01;
      v2.yaml#ensemble.nmad_factor = [4, 6].
    options:
      statistical_and_systematic:
        label: Statistical and systematic terms
      statistical_only:
        label: Bootstrap and density only
        description: Expected Δχ² 0.16 on v2 ξ±, against 1.06 with the systematic terms.
      delta_z_shifts:
        label: Independent per-bin Δz shifts
        description: >-
          σ = 0.018 per bin, the 2D analysis's prior: expected Δχ² 4.08 and no
          correlation between bins.

  sample_calibration:
    label: Where each bin's response is applied
    rationale: >-
      The response belongs to a sample: it is the derivative of that
      sample's weighted mean shear. The v2.0.0 bins have responses 0.854,
      0.858, 0.831 and 0.775 (R₁₁) against 0.786 for the whole sample, so the
      whole sample's R applied to bins 1–3 puts their shear high by 6–9%.
      Every bin's record is kept with the sample's; the question is whether
      the catalogue's e1, e2 carry it.
    options:
      per_sample_at_measurement:
        label: Catalogue keeps R_all; each bin's R applied when it is measured
        description: >-
          The shear of bin k is R_k⁻¹ R_all e minus the bin's weighted mean,
          applied by sp_validation as it measures a bin. A reader that takes
          the columns as they are measures a bin with the whole sample's R.
      calibrate_in_release:
        label: Catalogue's e1, e2 calibrated with each row's bin's R and c
        description: >-
          Each galaxy carries the calibration of its own bin; a statistic of
          the whole catalogue is then that of the union of separately
          calibrated bins.
      whole_sample:
        label: The whole sample's R for every bin
        excluded: Biases the shear of bins 1–3 by 6–9%.

prior_insights:
  som_gold_sample:
    claim: >-
      A SOM trained on the spectroscopic sample defines, per tomographic bin,
      a gold sample fully represented by spectra.
    evidence:
      - doi: "10.48550/arXiv.1909.09632"
        quote:
          exact: "We use the SOM to define a 100% represented ‘gold’ cosmic shear sample, per tomographic bin."

findings:
  bin_means:
    claim: >-
      The v2.0.0 bins, with edges 0.10/0.38/0.55/0.75/1.20, have mean
      redshifts 0.293, 0.456, 0.609 and 0.916, calibrated on 9,917 EGS
      spectra; after the BPZ range and gold, 54% of the sample's shear
      weight is in a bin.
    evidence:
      - artifact: nz_summary
        quote: { exact: "\"mean\": 0.2926222953762953" }
      - artifact: nz_summary
        quote: { exact: "\"mean\": 0.4564429777233325" }
      - artifact: nz_summary
        quote: { exact: "\"mean\": 0.6089238172100198" }
      - artifact: nz_summary
        quote: { exact: "\"mean\": 0.9155490145464295" }
      - artifact: nz_summary
        quote: { exact: "\"n_calibrators\": 9917" }
      - artifact: nz_summary
        quote: { exact: "\"gold\": 0.5441574244037846" }
  bin_response_differs:
    claim: >-
      Bin 1's response (R₁₁ = 0.854) is 8.7% above the whole sample's
      (0.786), and bin 4's (0.775) 1.3% below, so v2.0.0 applies each bin's
      own response when the bin is measured.
    evidence:
      - artifact: bin_responses
        quote: { exact: "0.8540098723066556" }
      - artifact: bin_responses
        quote: { exact: "0.7752978226636899" }
      - artifact: bin_responses
        quote: { exact: "0.7857610750514785" }
