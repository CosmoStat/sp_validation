[project]
name = "sp_validation"
version = "0.6.0"
description = "Validation of weak-lensing catalogues (galaxy and star shapes and other parameters) produced by ShapePipe"
authors = [
    {name = "Martin Kilbinger", email = "martin.kilbinger@cea.fr"},
    {name = "Cail Daley", email = "cail.daley@cea.fr"},
    {name = "Sacha Guerrini", email = "sacha.guerrini@cea.fr"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Operating System :: MacOS"
]
dependencies = [
    "adjustText",
    "astropy>=5.0",
    "camb",
    "clmm",
    "colorama",
    "cs_util>=0.2.1",
    "emcee",
    "getdist @ git+https://github.com/benabed/getdist.git@upper_triangle_whisker",
    "h5py",
    "healpy",
    "healsparse",
    "importlib_metadata",
    "joblib>=0.13",
    "jupyter",
    "jupyterlab",
    "jupytext==1.15.1",
    "lenspack",
    "lmfit",
    "numexpr",
    "numpy>=2.0",
    "opencv-python-headless",
    "pyccl",
    "pyarrow",
    "pymaster",
    "regions",
    "reproject",
    "scipy",
    "seaborn",
    "shear_psf_leakage @ git+https://github.com/CosmoStat/shear_psf_leakage.git@develop",
    "skyproj",
    "statsmodels",
    "treecorr>=5.0",
    "tqdm",
    "uncertainties"
]

[project.urls]
Homepage = "https://github.com/CosmoStat/sp_validation"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff"
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "numpydoc>=1.8",
    "sphinxcontrib-bibtex>=2.6",
    # 6.0.3 is a broken wheel on PyPI (dist-info only, no python module)
    "sphinxawesome-theme>=5.3,!=6.0.3"
]
develop = ["sp_validation[test,docs]"]

[tool.pytest.ini_options]
testpaths = ["src/sp_validation/tests"]
addopts = [
    "--verbose",
    "--cov=sp_validation",
    "--cov-report=term",
    "--cov-report=xml",
    "--junitxml=pytest.xml"
]
markers = [
    "fast: marks tests as fast (deselect with '-m \"not fast\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E712",  # comparison to True should be 'if cond is True:' or 'if cond:'
]

